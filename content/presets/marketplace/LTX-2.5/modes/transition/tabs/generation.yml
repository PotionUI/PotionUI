fields:
  - name: "speed_profile"
    type: "select"
    formula: "speed"
    label: "Speed profile"
    default: "distilled"
    configuration:
      options:
        - { label: "Distilled", value: "distilled", sub_label: "8 steps · CFG off · distilled sigma recipe" }
        - { label: "Balanced", value: "balanced", sub_label: "24 steps · CFG 4 · needs the dev checkpoint" }
        - { label: "Quality", value: "quality", sub_label: "30 steps · CFG 4 · multimodal guidance · needs the dev checkpoint" }
        - { label: "Custom", value: "custom", sub_label: "your own steps · sampler · CFG, left alone" }

  - type: "section"
    label: "Video"
    children:
      - type: "row"
        children: "{{ paths.preset }}/files/form/seed_quantity.yml"

      - name: "resolution"
        type: "resolution"
        formula: "size"
        label: "Resolution"
        configuration:
          files:
            - { path: "{{ paths._shared }}/resolutions/video.yml", group: "Video" }
            - { path: "{{ paths._shared }}/resolutions/social_media_video.yml", group: "Social Media" }
        default: "768x512"

      - name: "duration"
        type: "slider"
        formula: "size"
        label: "Length (seconds)"
        default: 5
        configuration: {min: 1, max: 10, step: 1}

  - type: "section"
    label: "Models"
    formula: "models"
    children:
      file: "{{ paths.preset }}/files/form/models_media.yml"

  - type: "section"
    label: "Transition LoRA"
    formula: "models"
    children:
      - name: "effect_lora"
        type: "model"
        formula: "models"
        label: "Transition LoRA"
        required: false
        description: "Optional. Smoother, more dramatic changes."
        configuration:
          model_type: "lora"
          placeholder: "ltx2.3-transition.safetensors"
          recommendations:
            - name: "ltx2.3-transition.safetensors"
              provider: "huggingface"
              ref: '{"repo": "valiantcat/LTX-2.3-Transition-LORA", "file": "ltx2.3-transition.safetensors", "revision": "main"}'
              size: "390.2 MB"
              sha256: "ba420d6fefafced8e317e2d6ff951b312b52f534377d016b491877a00b830d33"
              description: "Transition LoRA by Valiant Cat (Apache-2.0). Trained on LTX-2.3; used here on LTX-2.5."
