fields:
  - name: "upscale_enabled"
    type: "checkbox"
    label: "Enable Upscaling"
    default: false

  - type: "group"
    label: "Latent Upscale"
    children:
      - type: "row"
        children:
          - name: "upscale_method"
            type: "select"
            label: "Upscale Method"
            configuration:
              options:
                - { label: "Nearest Exact", value: "nearest-exact" }
                - { label: "Bilinear", value: "bilinear" }
                - { label: "Area", value: "area" }
                - { label: "Bicubic", value: "bicubic" }
                - { label: "Bislerp", value: "bislerp" }
                - { label: "Lanczos", value: "lanczos" }
            default: "nearest-exact"

          - name: "upscale_scale_by"
            type: "slider"
            label: "Scale Factor"
            configuration:
              min: 1.0
              max: 4.0
              step: 0.1
            default: 1.5

  - type: "group"
    label: "Refiner"
    children:
      - name: "upscale_model"
        type: "model"
        label: "Upscale Model"
        configuration:
          model_type: "upscaler"
          allow_info_modal: true
          placeholder: "Select upscale model..."
          filter_tags: "@config:upscaler_tags"

      - type: "row"
        children:
          - name: "upscale_steps"
            type: "slider"
            label: "Steps"
            configuration:
              min: 1
              max: 50
              step: 1
            default: 9

          - name: "upscale_cfg"
            type: "slider"
            label: "CFG"
            configuration:
              min: 1.0
              max: 10.0
              step: 0.1
            default: 1.1

      - type: "row"
        children:
          - name: "upscale_sampler"
            type: "select"
            label: "Sampler"
            configuration:
              file: { path: "{{ paths._shared }}/comfyui/form/samplers/all.yml" }
            default: "dpmpp_2s_ancestral"

          - name: "upscale_scheduler"
            type: "select"
            label: "Scheduler"
            configuration:
              file: { path: "{{ paths._shared }}/comfyui/form/schedulers/all.yml" }
            default: "normal"

      - name: "upscale_denoise"
        type: "slider"
        label: "Denoise"
        configuration:
          min: 0.0
          max: 1.0
          step: 0.05
        default: 0.35
