fields:
  - type: "section"
    label: "Sampling"
    children:
      - name: "steps"
        type: "slider"
        label: "Steps"
        audience: "advanced"
        default: 8
        configuration: {min: 1, max: 100, step: 1}
        reactions:
          - when: { field: "speed_profile", equals: "turbo" }
            then: { set_value: 8, set_disabled: false }
          - when: { field: "speed_profile", equals: "base" }
            then: { set_value: 30, set_disabled: false }
          - when: { field: "speed_profile", equals: "custom" }
            then: { set_disabled: false }

      - name: "sampler"
        type: "select"
        label: "Sampler"
        audience: "advanced"
        default: "euler"
        configuration:
          options:
            - { label: "Euler", value: "euler" }
            - { label: "DPM++ 2M", value: "dpmpp_2m" }
            - { label: "UniPC", value: "unipc" }
        reactions:
          - when: { field: "speed_profile", equals: "turbo" }
            then: { set_value: "euler", set_disabled: false }
          - when: { field: "speed_profile", equals: "base" }
            then: { set_value: "euler", set_disabled: false }
          - when: { field: "speed_profile", equals: "custom" }
            then: { set_disabled: false }

      # Turbo: 1.0 (single forward). Base / finetunes: ~4.0 (true CFG, uncond pass).
      - name: "cfg"
        type: "slider"
        label: "CFG Scale"
        audience: "advanced"
        default: 1.0
        configuration: {min: 1.0, max: 10.0, step: 0.5}
        reactions:
          - when: { field: "speed_profile", equals: "turbo" }
            then: { set_value: 1.0, set_disabled: false }
          - when: { field: "speed_profile", equals: "base" }
            then: { set_value: 4.0, set_disabled: false }
          - when: { field: "speed_profile", equals: "custom" }
            then: { set_disabled: false }

      # Optional sigma-shift override. Leave blank to use the model's built-in
      # default (ComfyUI Z-Image 3.0).
      - name: "shift"
        type: "number"
        label: "Shift (override)"
        audience: "advanced"
        configuration: {min: 0.1, max: 10.0, step: 0.05}

  - type: "section"
    label: "Step cache (FBCache)"
    audience: "advanced"
    children:
      - type: "row"
        children:
          - name: "step_cache_threshold"
            type: "slider"
            label: "Cache threshold"
            default: 0.0
            ai_hint: "A speed-for-fidelity trade, never a quality improvement -- it only removes work. Suggest 0.08 when the user explicitly wants a Z-Image render faster and can accept some softening of fine detail; 0.15 only if they ask for aggressive speed. Keep it at 0.0 for final renders and for the Turbo profile's 8-step run, where the warmup steps already cover most of the trajectory."
            configuration: {min: 0.0, max: 0.3, step: 0.01}
          - name: "step_cache_warmup_steps"
            type: "slider"
            label: "Warmup steps"
            default: 4
            ai_hint: "Only has an effect when Cache threshold is above 0. Raise toward 6-8 if a cached run loses composition -- it gives back some of the speed."
            configuration: {min: 0, max: 12, step: 1}
          - name: "step_cache_max_skips"
            type: "slider"
            label: "Max consecutive skips"
            default: 3
            ai_hint: "Only has an effect when Cache threshold is above 0. Lower to 1-2 if a cached run drifts or loses detail late in the trajectory."
            configuration: {min: 0, max: 10, step: 1}

  - type: "section"
    label: "Spectral Progressive Diffusion"
    audience: "advanced"
    children:
      - name: "spectral_progressive_enabled"
        type: "checkbox"
        label: "Enable"
        default: false
        ai_hint: "An experimental speed knob, not a quality feature. Only suggest enabling it if the user explicitly asks to try the prototype spectral-progressive speedup; leave off otherwise."
