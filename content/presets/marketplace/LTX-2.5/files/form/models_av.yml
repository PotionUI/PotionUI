          size: "1.35 GB"
          size_bytes: 1452269922
          precision: "bf16"
          gated: true
          license_url: "https://huggingface.co/Lightricks/LTX-2.5"
          description: "LTX-2.5 video VAE, conv decode - the cheaper decode path. Gated repo: accept the LTX-2 license on Hugging Face and set a token in Admin - Plugins."
        - name: "ltx-2.5-video-vae-bf16.safetensors"
          provider: "huggingface"
          ref: '{"repo": "Lightricks/LTX-2.5", "file": "vae/ltx-2.5-video-vae-bf16.safetensors", "revision": "main"}'
          size: "1.37 GB"
          size_bytes: 1472223346
          precision: "bf16"
          gated: true
          license_url: "https://huggingface.co/Lightricks/LTX-2.5"
