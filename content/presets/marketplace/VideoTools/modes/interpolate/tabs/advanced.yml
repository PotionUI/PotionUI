fields:
  - name: "scene_detection"
    type: "checkbox"
    formula: "interpolation"
    label: "Detect Cuts"
    audience: "advanced"
    default: true
    ai_hint: "With a Target Frame Rate, when two frames differ like a cut, show the nearer one instead of blending them into a ghost. Keep it on unless the clip has very fast motion that is wrongly read as cuts. Multiply blends every pair, as before."
    reactions:
      - when: { field: "target_fps", equals: 0 }
        then: { set_disabled: true }
      - when: { field: "target_fps", not_equals: 0 }
        then: { set_disabled: false }

  - name: "flow_scale"
    type: "select"
    formula: "interpolation"
    label: "Flow Scale"
    audience: "advanced"
    default: 1.0
    ai_hint: "Scale the optical-flow computation runs at. Keep Full resolution unless the source is above ~2K on its long side -- at very high resolutions half-scale flow is faster, uses less VRAM, and often tracks large motion better."
    configuration:
      options:
        - { label: "Full resolution flow", value: 1.0, sub_label: "Best detail for SD/HD sources (recommended)." }
        - { label: "Half resolution flow (for >2K sources)", value: 0.5, sub_label: "Computes flow at half scale -- for 2K+/4K sources." }
