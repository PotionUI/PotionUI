fields:
  - type: "section"
    label: "Sampling"
    children:
      - name: "steps"
        type: "slider"
        label: "Steps"
        configuration:
          min: 1
          max: 50
          step: 1
        default: 8

      - name: "sampler_name"
        type: "select"
        label: "Sampler"
        configuration:
          file: { path: "{{ paths._shared }}/comfyui/form/samplers/all.yml" }
        default: "euler"

      - name: "scheduler"
        type: "select"
        label: "Scheduler"
        configuration:
          file: { path: "{{ paths._shared }}/comfyui/form/schedulers/all.yml" }
        default: "simple"

      - name: "cfg"
        type: "slider"
        label: "CFG Scale"
        configuration:
          min: 1.0
          max: 10.0
          step: 0.1
        default: 1.0

  #############
  ## Krea2T Enhancer — optional model patch (node 300).
  ## Requires the ComfyUI-Krea2T-Enhancer custom node on the ComfyUI server:
  ## https://github.com/capitan01R/ComfyUI-Krea2T-Enhancer
  #############
  - name: "krea_enhancer"
    type: "gate"
    label: "Enable Krea2T Enhancer"
    default: false
    children:
      - name: "krea_enhancer_strength"
        type: "slider"
        label: "Strength"
        configuration:
          min: 0.0
          max: 2.0
          step: 0.05
          tooltip: "0 = neutral, 1 = default enhancement, 2 = maximum."
        default: 1.0
