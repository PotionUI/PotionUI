pipeline:
  - name: "media_loader"
    id: "media_loader"
    enabled: true
    configuration:
      validate_files: true
      max_file_size: 524288000
      auto_detect_type: true
      media:
        - type: "video"
          path: "{{ form.input_video }}"

  - name: "param_emitter"
    id: "param_emitter"
    enabled: true
    configuration:
      quantity: 1
      parameters:
        - ["factor", "{{ form.factor | default(2) }}"]
        - ["target_fps", "{{ form.target_fps | default(0) }}"]
        - ["mode", "{{ form.mode | default('medium') }}"]
        - ["scene_detection", "{{ form.scene_detection | default(true) }}"]
        - ["keep_audio", "{{ form.keep_audio | default(true) }}"]

  - name: "interpolator/rtx_vfg"
    id: "rtx_vfg"
    input:
      - ["video", "media_loader", "video"]
    enabled: true
    configuration:
      factor: "{{ form.factor | default(2) }}"
      target_fps: "{{ form.target_fps | default(0) }}"
      mode: "{{ form.mode | default('medium') }}"
      scene_detection: "{{ form.scene_detection | default(true) }}"
      keep_audio: "{{ form.keep_audio | default(true) }}"

  - name: "gallery"
    id: "gallery"
    input:
      - ["video", "rtx_vfg", "video"]
    enabled: true
    configuration:
      support_video: true
