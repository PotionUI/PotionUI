pipeline:
  - name: "media_loader"
    id: "media_loader"
    enabled: true
    configuration:
      validate_files: true
      max_file_size: 524288000
      auto_detect_type: true
      media:
        - type: "video"
          path: "{{ form.input_video }}"

  - name: "media_loader"
    id: "media_image"
    enabled: true
    configuration:
      media:
        - type: "image"
          path: "{{ form.input_image }}"

  - name: "control_video"
    id: "pose_guide"
    input:
      - ["video", "media_loader", "video"]
      - ["image", "media_image", "image"]
    enabled: true
    configuration:
      type: "pose"
      match_picture: true
      ease_in: "{{ form.pose_ease_in }}"
      size_multiple: 64
      max_frames: 1001
      max_pixels: 522240
      save_guide: "{{ form.save_guide }}"

  - name: "model_loader/ltx"
    enabled: true
    configuration:
      model:
        file_path: "{{ form.model }}"
        name: "{{ form.model }}"
      text_encoder:
        file_path: "{{ form.text_encoder }}"
        name: "{{ form.text_encoder }}"
      upscale_model:
        file_path: "{{ form.upscale_model }}"
        name: "{{ form.upscale_model }}"
      loras:
        "@loop":
          items: "{{ form.loras }}"
          template:
            file_path: "{{ item.model }}"
            weight: "{{ item.strength }}"

  - name: "prompt_encoder"
    input:
      - ["text_encoder", "model_loader/ltx", "text_encoder"]
    enabled: true
    configuration:
      p_prompt:
        input: &caption "{{ ((item.positive if item is defined else generation.prompts.first.positive) or '') | trim or 'A cinematic, photorealistic shot of the person from the picture dancing, full body in frame, with smooth natural motion in the same setting, lighting and clothing as the picture' }}"
        output: *caption
      n_prompt:
        input: &negative "{{ item.negative if item is defined else generation.prompts.first.negative }}"
        output: *negative
      pairs:
        "@loop":
          items: "{{ generation.prompts.pairs }}"
          template:
            positive: *caption
            negative: *negative
      quantity: 1
      guidance_scale: "{{ [form.cfg | default(generation.profile.guidance), form.refine_cfg] | max }}"
      negative_applied: "{{ generation.negative_applied }}"

  - name: "seed_generator"
    enabled: true
    configuration:
      seed: "{{ form.seed }}"
      quantity: 1

  - name: "dynamic_prompts_renderer"
    id: "dynamic_prompts_renderer"
    enabled: true
    configuration:
      pairs: "{{ generation.prompts.pairs }}"
      quantity: 1

  - name: "from_iotype"
    id: "from_iotype"
    enabled: true
    input:
      - ["seed", "seed_generator", "seed"]
    configuration:
      from: "seed"

  - name: "param_emitter"
    id: "param_emitter"
    enabled: true
    input:
      - ["seed", "from_iotype", "seed"]
    configuration:
      quantity: 1
      parameters:
        - ["model", "{{ form.model }}"]
        - ["model", "{{ form.text_encoder }}"]
        - ["model", "{{ form.effect_lora }}"]
        - "@loop":
            items: "{{ form.loras | active_loras }}"
            template: ["model", "{{ item.model }}"]
        - ["positive_prompt", "{{ generation.prompts.positives }}"]
        - ["negative_prompt", "{{ generation.prompts.negatives }}"]
        - ["cfg", "{{ form.cfg | default(generation.profile.guidance) }}"]
        - ["steps", "{{ form.steps | default(generation.profile.steps) }}"]
        - ["sampler", "{{ form.sampler | default(generation.profile.sampler) }}"]
        - ["schedule", "{{ form.schedule }}"]
        - ["strength", "{{ form.effect_strength }}"]
        - ["model", "{{ form.upscale_model }}"]

  - name: "generator/video_ltx"
    id: "generator_stage1"
    input:
      - ["model", "model_loader/ltx", "model"]
      - ["conditioning", "prompt_encoder", "conditioning"]
      - ["seed", "seed_generator", "seed"]
      - ["video", "pose_guide", "video"]
      - ["image", "media_image", "image"]
    enabled: true
    configuration:
      quantity: 1
      decode: false
      audio: false
      match_video: true
      max_pixels: 522240
      refine_scale: 2.0
      fps: 24.0
      steps: "{{ form.steps | default(generation.profile.steps) }}"
      cfg: "{{ form.cfg | default(generation.profile.guidance) }}"
      sampler: "{{ form.sampler | default(generation.profile.sampler) }}"
      schedule: "{{ form.schedule }}"
      manual_sigmas: "{{ preset.vars.distilled_sigma_recipe if (form.speed_profile == 'distilled') else ('' if (form.speed_profile == 'quality') else (form.manual_sigmas)) }}"
      quality_mode: "{{ (form.speed_profile) == 'quality' }}"
      quality_cfg: "{{ form.cfg | default(generation.profile.guidance) }}"
      quality_stg: "{{ preset.vars.quality_stg }}"
      quality_rescale: "{{ preset.vars.quality_rescale }}"
      quality_modality: "{{ preset.vars.quality_modality }}"
      quality_stg_blocks: "{{ preset.vars.quality_stg_blocks }}"
      step_cache_threshold: "{{ form.step_cache_threshold }}"
      step_cache_warmup_steps: "{{ form.step_cache_warmup_steps }}"
      step_cache_max_skips: "{{ form.step_cache_max_skips }}"
      media_placements:
        - { source: "video", index: 0, frame: "first", strength: 1.0, role: "reference" }
        - { source: "image", index: 0, frame: "first", strength: 1.0, role: "keyframe" }
      scoped_loras:
        - file_path: "{{ form.effect_lora }}"
          weight: "{{ form.effect_strength }}"

  - name: "latent_upscaler/ltx"
    id: "latent_upscaler"
    input:
      - ["latent", "generator_stage1", "latent"]
      - ["model", "model_loader/ltx", "model"]
    enabled: true
    configuration: {}

  - name: "generator/video_ltx"
    id: "generator"
    input:
      - ["model", "model_loader/ltx", "model"]
      - ["conditioning", "prompt_encoder", "conditioning"]
      - ["seed", "seed_generator", "seed"]
      - ["initial_latent", "latent_upscaler", "latent"]
      - ["video", "pose_guide", "video"]
      - ["image", "media_image", "image"]
      - ["audio", "media_loader", "video"]
    enabled: true
    configuration:
      quantity: 1
      decode: true
      audio: true
      audio_source: "file"
      match_video: true
      fps: 24.0
      cfg: "{{ form.refine_cfg }}"
      sampler: "{{ form.refine_sampler }}"
      refine_sigmas: "{{ form.upscale_refine_sigmas or preset.vars.ltx23_stage2_sigma_recipe }}"
      refine_reference: true
      media_placements:
        - { source: "video", index: 0, frame: "first", strength: 1.0, role: "reference" }
        - { source: "image", index: 0, frame: "first", strength: 1.0, role: "keyframe" }
      scoped_loras:
        - file_path: "{{ form.effect_lora }}"
          weight: "{{ form.effect_strength }}"

  - name: "gallery"
    input:
      - ["video", "generator", "video"]
      - ["seed", "seed_generator", "seed"]
    enabled: true
