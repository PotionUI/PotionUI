########
## YuE2-3B text-to-music (native engine)
##
## Single-stage-per-song generation: an autoregressive stage samples a
## semantic codec token per frame (25 fps) from style tags + lyrics -- with
## an optional chain-of-thought pass that first writes an ABC transcription
## the codec stage conditions on -- then a non-autoregressive flow-matching
## pass turns those tokens into an Oobleck-VAE latent the decoder renders to
## a waveform. One song per generation; there is no quantity knob, unlike
## the image/video families.
##
## Text-to-music ONLY: the shipped checkpoint has no audio encoder, so there
## is no style/reference, extend or repaint mode -- see description.md.
##
## WEIGHTS LICENSE: CC BY-NC 4.0 -- non-commercial use only, with
## attribution required. See description.md.
##
## Authoring reference: docs/presets.md
########
schema: 1
id: "01KX47YUE200000000000000YU"
name: "YuE2"
category: "audio"
version: "1.0.0"
engine: "native"
tags: ["yue2", "audio", "music", "t2m", "flow-matching", "local"]

configuration:
  checkpoint_tags:
    type: "model_tags"
    label: "Checkpoint tags"
    description: "Only models with any of these tags appear in the YuE2 AR/NAR backbone picker."
  vae_tags:
    type: "model_tags"
    label: "VAE tags"
    description: "Only models with any of these tags appear in the Oobleck VAE picker."
  style_categories:
    type: "tag_categories"
    label: "Style tag categories"
    description: "Category vocabulary offered by the Generation tab's Style tags field."
    default:
      - key: "language"
        label: "Language"
        multi: false
        tags: ["English", "Mandarin", "Japanese", "Korean", "Ukrainian", "Russian", "French", "German", "Spanish", "Brazilian Portuguese", "Swedish", "Dutch", "Indonesian", "Tagalog", "Persian", "Bengali"]
      - key: "genre"
        label: "Genre"
        multi: true
        tags: ["pop", "rock", "electronic", "classical", "R&B", "folk", "rap", "hip-hop", "soundtrack", "country", "indie rock", "punk", "jazz", "experimental", "funk", "blues", "ambient", "new age", "classic rock", "alternative rock", "reggae", "electro pop", "K-pop", "dance", "80s", "dancehall", "disco", "house", "death metal", "thrash metal", "progressive rock", "hard rock", "lounge", "Latin", "hardcore", "metalcore", "soul", "grunge", "easy listening"]
      - key: "instrumental"
        label: "Instrumentation"
        multi: true
        tags: ["piano", "drums", "guitar", "electric guitar", "acoustic guitar", "synthesizer", "keyboard", "violin", "bass", "bass guitar", "saxophone", "drum machine", "cello", "harmonica", "fiddle", "percussion", "beatboxing", "harp", "flute", "brass", "trumpet", "strings", "banjo", "sitar", "charango"]
      - key: "voice"
        label: "Voice"
        multi: true
        tags: ["female", "male", "soprano", "mezzo-soprano", "tenor", "child", "rapping", "screamo", "bright vocal", "full vocal", "airy vocal", "clear vocal", "mellow vocal", "dark vocal", "rich vocal", "light vocal", "crisp vocal", "powerful vocal", "high-pitched vocal", "deep vocal", "baritone vocal", "vibrant vocal", "soft vocal", "husky vocal", "aggressive vocal", "gravelly vocal", "vocal fry vocal", "velvet vocal", "raspy vocal", "breathy vocal", "passionate vocal", "emotional vocal", "whimsical vocal"]
      - key: "mood"
        label: "Mood"
        multi: true
        tags: ["uplifting", "emotional", "happy", "inspiring", "romantic", "sad", "melancholic", "dark", "upbeat", "energetic", "nostalgic", "calm", "hopeful", "melodic", "relaxing", "dreamy", "rebellious", "introspective", "confident", "aggressive", "cool", "angry", "celebratory", "bold", "optimistic", "sentimental", "tough", "motivational", "heartfelt", "funky", "danceable", "heavy", "thoughtful", "fast-paced"]
