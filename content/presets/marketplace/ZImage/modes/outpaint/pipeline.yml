pipeline:
  - name: "model_loader/z_image"
    enabled: true
    configuration:
      diffusion_model:
        file_path: "{{ form.diffusion_model }}"
        name: "{{ form.diffusion_model }}"
      text_encoder:
        file_path: "{{ form.text_encoder }}"
        name: "{{ form.text_encoder }}"
      vae:
        file_path: "{{ form.vae }}"
        name: "{{ form.vae }}"
      loras:
        "@loop":
          items: "{{ form.loras }}"
          template:
            file_path: "{{ item.model }}"
            weight: "{{ item.strength }}"

  - name: "media_loader"
    id: "media_loader"
    enabled: true
    configuration:
      media:
        - type: "image"
          path: "{{ form.source_image }}"

  - name: "canvas_expand"
    id: "canvas_expand"
    enabled: true
    input:
      - ["image", "media_loader", "image"]
    configuration:
      left: "{{ form.expand_left if form.canvas_mode | default('sides') == 'sides' else 0 }}"
      top: "{{ form.expand_top | default(0) if form.canvas_mode | default('sides') == 'sides' else 0 }}"
      right: "{{ form.expand_right if form.canvas_mode | default('sides') == 'sides' else 0 }}"
      bottom: "{{ form.expand_bottom | default(0) if form.canvas_mode | default('sides') == 'sides' else 0 }}"
      aspect: "{{ form.target_shape | default('16:9') if form.canvas_mode | default('sides') == 'shape' else '' }}"
      anchor: "{{ form.shape_anchor | default('center') }}"
      overlap: "{{ form.mask_feather }}"

  - name: "prompt_encoder"
    input:
      - ["text_encoder", "model_loader/z_image", "text_encoder"]
    enabled: true
    configuration:
      p_prompt:
        input: &inpaint_prompt "{{ (item.positive if item is defined else generation.prompts.first.positive) | text_or('the scene continued naturally beyond the edge') }}"
        output: *inpaint_prompt
      n_prompt:
        input: "{{ generation.prompts.first.negative }}"
        output: "{{ generation.prompts.first.negative }}"
      pairs:
        "@loop":
          items: "{{ generation.prompts.pairs }}"
          template:
            positive: *inpaint_prompt
            negative: "{{ item.negative }}"
      quantity: "{{ form.quantity }}"
      guidance_scale: "{{ form.cfg | default(generation.profile.guidance) }}"
      negative_applied: "{{ generation.negative_applied }}"

  - name: "seed_generator"
    enabled: true
    configuration:
      seed: "{{ form.seed }}"
      quantity: "{{ form.quantity }}"

  - name: "dynamic_prompts_renderer"
    id: "dynamic_prompts_renderer"
    enabled: true
    configuration:
      pairs: "{{ generation.prompts.pairs }}"
      quantity: "{{ form.quantity }}"

  - name: "from_iotype"
    id: "from_iotype"
    enabled: true
    input:
      - ["seed", "seed_generator", "seed"]
    configuration:
      from: "seed"

  - name: "param_emitter"
    id: "param_emitter"
    enabled: true
    input:
      - ["seed", "from_iotype", "seed"]
    configuration:
      quantity: "{{ form.quantity }}"
      parameters:
        - ["model", "{{ form.diffusion_model }}"]
        - ["model", "{{ form.text_encoder }}"]
        - ["model", "{{ form.vae }}"]
        - "@loop":
            items: "{{ form.loras | active_loras }}"
            template: ["model", "{{ item.model }}"]
        - "@loop":
            items: "{{ generation.prompts.pairs }}"
            template: ["positive_prompt", *inpaint_prompt]
        - ["negative_prompt", "{{ generation.prompts.negatives }}"]
        - ["cfg", "{{ form.cfg | default(generation.profile.guidance) }}"]
        - ["steps", "{{ form.steps | default(generation.profile.steps) }}"]
        - ["sampler", "{{ form.sampler | default(generation.profile.sampler) }}"]
        - ["schedule", "{{ form.schedule }}"]
        - ["denoise", "{{ form.denoise }}"]
        - ["canvas", "{{ form.canvas_mode | default('sides') }}"]

  - name: "generator/z_image"
    input:
      - ["model", "model_loader/z_image", "model"]
      - ["conditioning", "prompt_encoder", "conditioning"]
      - ["seed", "seed_generator", "seed"]
      - ["image", "canvas_expand", "images"]
      - ["mask", "canvas_expand", "masks"]
    enabled: true
    configuration:
      mode: "inpaint"
      max_pixels: "{{ {'1': 1048576, '2': 2097152, '4': 4194304}[form.output_size | default('4')] }}"
      denoise: "{{ form.denoise }}"
      steps: "{{ form.steps | default(generation.profile.steps) }}"
      guidance: "{{ form.cfg | default(generation.profile.guidance) }}"
      shift: "{% set s = form.shift | default('') %}{% if s is not none and s != '' %}{{ s }}{% endif %}"
      sampler: "{{ form.sampler | default(generation.profile.sampler) }}"
      schedule: "{{ form.schedule }}"
      quantity: "{{ form.quantity }}"
      step_cache:
        rel_threshold: "{{ form.step_cache_threshold }}"
        warmup_steps: "{{ form.step_cache_warmup_steps }}"
        max_consecutive_skips: "{{ form.step_cache_max_skips }}"

  - name: "inpaint_region_restore"
    id: "inpaint_region_restore"
    enabled: true
    input:
      - ["inpainted_image", "generator/z_image", "image"]
      - ["crop_region", "canvas_expand", "crop_region"]
      - ["original_image", "canvas_expand", "original_image"]
      - ["original_mask", "canvas_expand", "original_mask"]
    configuration:
      strategy: "inpaint"
      feather_px: "{{ form.mask_feather }}"

  - name: "gallery"
    input:
      - ["image", "inpaint_region_restore", "image"]
      - ["seed", "seed_generator", "seed"]
    enabled: true
