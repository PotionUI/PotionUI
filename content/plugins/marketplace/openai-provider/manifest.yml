id: "openai-provider"
name: "OpenAI"
version: "0.1.0"
description: "Generate and edit images with OpenAI's GPT Image models. Adds an OpenAI cloud backend, its model catalog and a ready-made image preset (text to image, edit with an optional mask)."
author: "PotionUI Team"
type: "backend-only"
category: "backends"

capabilities:
  - "backend-provider"
  - "cloud-models"

hooks:
  backend:
    - hook: "backend.register"
      handler: "backend.hooks.backend_hooks.register_backend"

presets:
  - path: "presets"

docs:
  - path: "README.md"
    title: "OpenAI"
    audience: "admin"

setup:
  - kind: "backend.added"
    driver: "cloud.openai"
    label: "Add an OpenAI backend with your API key"
  - kind: "cloud.models_enabled"
    driver: "cloud.openai"
  - kind: "presets.installed"
  - kind: "presets.assigned"
