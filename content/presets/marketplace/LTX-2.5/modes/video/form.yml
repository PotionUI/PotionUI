name: "custom"
fields:
  - type: "tabs"
    children:
      - type: "tab"
        label: "Generation"
        configuration:
          icon: "generation"
          icon_display: "icon_only"
        children: "{{ paths.preset }}/modes/video/tabs/generation.yml"
      - type: "tab"
        label: "Models"
        configuration:
          icon: "model"
          icon_display: "icon_only"
        children: "{{ paths.preset }}/modes/video/tabs/models.yml"
      - type: "tab"
        label: "LoRA"
        configuration:
          icon: "lora"
          icon_display: "icon_only"
        children: "{{ paths.preset }}/modes/video/tabs/lora.yml"
      - type: "tab"
        label: "Enhance"
        configuration:
          icon: "sparkles"
          icon_display: "icon_only"
        children: "{{ paths.preset }}/modes/video/tabs/enhance.yml"
      - type: "tab"
        label: "Advanced"
        audience: "advanced"
        configuration:
          icon: "settings"
          icon_display: "icon_only"
        children: "{{ paths.preset }}/modes/video/tabs/advanced.yml"
