fields:
  - name: "loras"
    type: "lora_picker"
    formula: "loras"
    default: []
    label: "LoRAs"
    ai_hint: "{{ vars.hint }}"
    configuration:
      model_type: "lora"
      placeholder: "{{ vars.placeholder }}"
      allow_info_modal: true
      strength_min: "{{ vars.strength_min }}"
      strength_max: "{{ vars.strength_max }}"
      strength_step: "{{ vars.strength_step }}"
      strength_default: 1.0
      max_items: "{{ vars.max_items }}"
      filter_tags: "@config:lora_tags"
      row_fields:
        - name: "step_start"
          type: "number"
          label: "From step"
          default: null
          description: "Steps count from 1. Leave blank to start at the first step."
        - name: "step_end"
          type: "number"
          label: "To step"
          default: null
          description: "Leave blank to stay on through the last step. Some distilled LoRAs must switch off early — check the model's own notes."
