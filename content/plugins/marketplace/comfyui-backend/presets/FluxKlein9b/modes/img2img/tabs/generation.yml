fields:
  - name: "speed_profile"
    type: "select"
    label: "Speed"
    description: "Fast uses a separately-trained distilled checkpoint, not a sampling shortcut on the same model - pick it in Diffusion Model below (the picker narrows to it automatically)."
    default: "balanced"
    configuration:
      options:
        - { label: "Balanced (20 steps, base checkpoint)", value: "balanced" }
        - { label: "Fast (4 steps, distilled checkpoint)", value: "fast" }

  - name: "seed"
    type: "seed"
    label: "Seed"
    default: -1

  - name: "quantity"
    type: "slider"
    label: "Batch Size"
    configuration:
      min: 1
      max: 4
      step: 1
    default: 1

  - type: "group"
    label: "Models"
    children:
      - name: "diffusion_model"
        type: "model"
        label: "Diffusion Model (UNET)"
        description: "Balanced needs the base checkpoint; Fast needs the distilled checkpoint. The two are separately-trained models, not interchangeable - the options below are narrowed to match the selected Speed profile."
        required: true
        configuration:
          model_type: "diffusion_model"
          allow_info_modal: true
          placeholder: "Select diffusion model..."
          filter_tags: "@config:checkpoint_tags"
        reactions:
          - when: { field: "speed_profile", equals: "balanced" }
            then: { set_filter_tags: "@config:checkpoint_tags" }
          - when: { field: "speed_profile", equals: "fast" }
            then: { set_filter_tags: "@config:checkpoint_tags_fast" }

      - name: "clip"
        type: "model"
        label: "CLIP Model"
        required: true
        configuration:
          model_type: "text_encoder"
          allow_info_modal: true
          placeholder: "Select CLIP model..."
          filter_tags: "@config:clip_tags"

      - name: "vae"
        type: "model"
        label: "VAE Model"
        required: true
        configuration:
          model_type: "vae"
          allow_info_modal: true
          placeholder: "Select VAE model..."
          filter_tags: "@config:vae_tags"

  - name: "megapixels"
    type: "slider"
    label: "Megapixels"
    configuration:
      min: 0.5
      max: 2.0
      step: 0.1
    default: 1.0
