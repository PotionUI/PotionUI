# img2img pipeline for the native Qwen-Image family.
#
#   model_loader/qwen -> media_loader -> prompt_encoder -> seed_generator -> generator/qwen (mode=img2img) -> gallery
#
# Reuses the shared Img2ImgGeneratorMixin already wired into generator/qwen
# (src/pipelines/pipes/_shared/generation/img2img.py): the source image is
# VAE-encoded via NativeGenerator.encode_image, then a truncated-schedule
# denoise runs from that latent instead of from noise. Conditioning still
# flows the mandated shared path — model_loader emits `text_encoder`, prompt_encoder
# turns prompts into `conditioning`, generator/qwen never re-encodes the
# prompt itself.
pipeline:
  #############
  ## Model loader (MMDiT + Qwen2.5-VL TE + causal-3D VAE, per-component cached)
  ############
  - name: "model_loader/qwen"
    enabled: true
    configuration:
      diffusion_model:
        file_path: "{{ form.diffusion_model }}"
        name: "{{ form.diffusion_model }}"
      text_encoder:
        file_path: "{{ form.text_encoder }}"
        name: "{{ form.text_encoder }}"
      vae:
        file_path: "{{ form.vae }}"
        name: "{{ form.vae }}"
      loras:
        "@loop":
          items: "{{ form.loras }}"
          template:
            file_path: "{{ item.model }}"
            weight: "{{ item.strength }}"

  #############
  ## Media Loader (Source Image)
  ############
  - name: "media_loader"
    id: "media_loader"
    enabled: true
    configuration:
      media:
        - type: "image"
          path: "{{ form.source_image }}"

  #############
  ## Prompt encoder (shared pipe; produces the conditioning)
  ############
  - name: "prompt_encoder"
    input:
      - ["text_encoder", "model_loader/qwen", "text_encoder"]
    enabled: true
    configuration:
      p_prompt:
        input: "{{ generation.prompts.first.positive }}"
        output: "{{ generation.prompts.first.positive }}"
      n_prompt:
        input: "{{ generation.prompts.first.negative }}"
        output: "{{ generation.prompts.first.negative }}"
      # Per-image expanded prompt pairs (src/core/prompt/expander.py).
      pairs: "{{ generation.prompts.pairs }}"
      quantity: "{{ form.quantity }}"
      # Qwen-Image uses true CFG -> encode the negative pass (guidance_scale > 1).
      guidance_scale: "{{ form.cfg | default(generation.profile.guidance) }}"

  #############
  ## Seed generator
  ############
  - name: "seed_generator"
    enabled: true
    configuration:
      seed: "{{ form.seed }}"
      quantity: "{{ form.quantity }}"

  #############
  ## Rendered prompts (provenance)
  ## Surfaces the per-image expanded prompts ({a|b}, ${variables}, phrasebook
  ## already resolved on the backend - see src/features/prompt/expander.py) as
  ## pipe artifacts, the prompt counterpart of seed_generator. `pairs` is the
  ## real list, handed in exactly as prompt_encoder receives it.
  ############
  - name: "dynamic_prompts_renderer"
    id: "dynamic_prompts_renderer"
    enabled: true
    configuration:
      pairs: "{{ generation.prompts.pairs }}"
      quantity: "{{ form.quantity }}"

  #############
  ## IOType to Value Converter
  ############
  - name: "from_iotype"
    id: "from_iotype"
    enabled: true
    input:
      - ["seed", "seed_generator", "seed"]
    configuration:
      from: "seed"

  #############
  ## Parameter Emitter
  ############
  - name: "param_emitter"
    id: "param_emitter"
    enabled: true
    input:
      - ["seed", "from_iotype", "seed"]
    configuration:
      quantity: "{{ form.quantity }}"
      parameters:
        - ["model", "{{ form.diffusion_model }}"]
        - ["model", "{{ form.text_encoder }}"]
        - ["model", "{{ form.vae }}"]
        - "@loop":
            items: "{{ form.loras | active_loras }}"
            template: ["model", "{{ item.model }}"]
        # Per-image arrays, so history records the prompt each image actually ran with.
        - ["positive_prompt", "{{ generation.prompts.positives }}"]
        - ["negative_prompt", "{{ generation.prompts.negatives }}"]
        - ["cfg", "{{ form.cfg | default(generation.profile.guidance) }}"]
        - ["steps", "{{ form.steps | default(generation.profile.steps) }}"]
        - ["sampler", "{{ form.sampler | default(generation.profile.sampler) }}"]
        - ["denoise", "{{ form.denoise }}"]

  #############
  ## Generator (img2img mode: VAE-encode the source image, partial denoise)
  ############
  - name: "generator/qwen"
    input:
      - ["model", "model_loader/qwen", "model"]
      - ["conditioning", "prompt_encoder", "conditioning"]
      - ["seed", "seed_generator", "seed"]
      - ["image", "media_loader", "image"]
    enabled: true
    configuration:
      mode: "img2img"
      denoise: "{{ form.denoise }}"
      steps: "{{ form.steps | default(generation.profile.steps) }}"
      guidance: "{{ form.cfg | default(generation.profile.guidance) }}"
      # Optional shift override; blank -> spec default (1.15).
      shift: "{% set s = form.shift | default('') %}{% if s is not none and s != '' %}{{ s }}{% endif %}"
      sampler: "{{ form.sampler | default(generation.profile.sampler) }}"
      quantity: "{{ form.quantity }}"

  #############
  ## Gallery
  ############
  - name: "gallery"
    input:
      - ["image", "generator/qwen", "image"]
      - ["seed", "seed_generator", "seed"]
    enabled: true
