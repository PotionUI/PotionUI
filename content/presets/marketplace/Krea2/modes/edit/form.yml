name: "custom"
mode_label: "Edit"
short_description: "Change a picture with a text instruction."
prompt_label: "Instruction"
prompt_placeholder: "make the jacket red and add sunglasses"
negative_prompt:
  applies_when:
    logic: "OR"
    conditions:
      - { field: "cfg", greater_than: 1 }
fields:
  - type: "tabs"
    children:
      - type: "tab"
        anchor: "generation"
        label: "Generation"
        configuration:
          icon: "generation"
          icon_display: "icon_only"
        children: "{{ paths.preset }}/modes/edit/tabs/generation.yml"
      - type: "tab"
        anchor: "references"
        label: "References"
        configuration:
          icon: "image"
          icon_display: "icon_only"
        children: "{{ paths.preset }}/modes/edit/tabs/references.yml"
      - type: "tab"
        anchor: "lora"
        label: "LoRA"
        configuration:
          icon: "lora"
          icon_display: "icon_only"
        children: "{{ paths.preset }}/modes/edit/tabs/lora.yml"
      - type: "tab"
        anchor: "advanced"
        label: "Advanced"
        audience: "advanced"
        configuration:
          icon: "settings"
          icon_display: "icon_only"
        children: "{{ paths.preset }}/modes/edit/tabs/advanced.yml"
