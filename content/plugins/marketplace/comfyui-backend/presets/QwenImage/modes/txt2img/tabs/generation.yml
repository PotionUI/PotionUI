fields:
  - type: "row"
    children:
      - name: "seed"
        type: "seed"
        label: "Seed"
        default: -1

      - name: "quantity"
        type: "slider"
        label: "Batch Size"
        configuration:
          min: 1
          max: 4
          step: 1
        default: 1

  - name: "resolution"
    type: "resolution"
    label: "Image Resolution"
    configuration:
      files:
        - { path: "{{ paths._shared }}/resolutions/flux.yml", group: "FLUX" }
        - { path: "{{ paths._shared }}/resolutions/social_media.yml", group: "Social Media" }
    default: "1140x1472"

  - name: "diffusion_model"
    type: "model"
    label: "Diffusion Model (UNET)"
    required: true
    configuration:
      model_type: "diffusion_model"
      allow_info_modal: true
      placeholder: "Select diffusion model..."
      filter_tags: "@config:checkpoint_tags"

  - name: "clip"
    type: "model"
    label: "CLIP Model"
    required: true
    configuration:
      model_type: "clip"
      allow_info_modal: true
      placeholder: "Select CLIP model..."
      filter_tags: "@config:clip_tags"

  - name: "vae"
    type: "model"
    label: "VAE Model"
    required: true
    configuration:
      model_type: "vae"
      allow_info_modal: true
      placeholder: "Select VAE model..."
      filter_tags: "@config:vae_tags"


