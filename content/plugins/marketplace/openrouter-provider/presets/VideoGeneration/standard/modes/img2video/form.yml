name: "custom"
short_description: "Animate a still image into a video."
fields:
  - type: "tabs"
    children:
      - type: "tab"
        label: "Generation"
        configuration: {icon: "generation", icon_display: "icon_only"}
        children: "{{ paths.preset }}/modes/img2video/tabs/generation.yml"
      - type: "tab"
        label: "Provider options"
        audience: "advanced"
        configuration: {icon: "settings", icon_display: "icon_only"}
        children: "{{ paths._shared }}/cloud/tabs/provider_options.yml"
