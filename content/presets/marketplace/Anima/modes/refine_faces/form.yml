name: "custom"
mode_label: "Fix faces"
short_description: "Repaint the faces in a picture with your checkpoint."
prompt: "optional"
prompt_label: "Describe the face"
prompt_placeholder: "smiling, detailed eyes, soft light"
negative_prompt:
  applies_when: { field: "cfg", greater_than: 1 }
fields:
  - type: "tabs"
    children:
      - type: "tab"
        anchor: "generation"
        label: "Fix"
        configuration:
          icon: "generation"
          icon_display: "icon_only"
        children: "{{ paths.preset }}/modes/refine_faces/tabs/generation.yml"
      - type: "tab"
        anchor: "references"
        label: "References"
        configuration:
          icon: "image"
          icon_display: "icon_only"
        children: "{{ paths.preset }}/modes/refine_faces/tabs/references.yml"
      - type: "tab"
        anchor: "lora"
        label: "LoRA"
        configuration:
          icon: "lora"
          icon_display: "icon_only"
        children:
          file: "{{ paths._shared }}/native/lora.yml"
          vars:
            hint: "LoRAs add specialized styles, concepts, or characters to Anima. Multiple LoRAs can be combined. Check the LoRA's own page for a recommended strength; 0.5-0.8 suits most, 1.0 is full effect, and negative values invert the effect. Leave empty if not needed."
            placeholder: "Select an Anima LoRA..."
            max_items: 10
            strength_min: -10.0
            strength_max: 10.0
            strength_step: 0.1
      - type: "tab"
        anchor: "advanced"
        label: "Advanced"
        audience: "advanced"
        configuration:
          icon: "settings"
          icon_display: "icon_only"
        children: "{{ paths.preset }}/modes/refine_faces/tabs/advanced.yml"
