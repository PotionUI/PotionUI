name: "custom"
mode_label: "Refine faces"
short_description: "Sharpen faces and hands in an existing video."
negative_prompt:
  applies_when: false
fields:
  - type: "tabs"
    children:
      - type: "tab"
        anchor: "generation"
        label: "Generation"
        configuration:
          icon: "generation"
          icon_display: "icon_only"
        children: "{{ paths.preset }}/modes/refine_faces/tabs/generation.yml"
      - type: "tab"
        anchor: "references"
        label: "References"
        configuration:
          icon: "image"
          icon_display: "icon_only"
        children: "{{ paths.preset }}/modes/refine_faces/tabs/references.yml"
      - type: "tab"
        anchor: "lora"
        label: "LoRA"
        configuration:
          icon: "lora"
          icon_display: "icon_only"
        children: "{{ paths.preset }}/modes/video/tabs/lora.yml"
      - type: "tab"
        anchor: "advanced"
        label: "Advanced"
        audience: "advanced"
        configuration:
          icon: "settings"
          icon_display: "icon_only"
        children: "{{ paths.preset }}/modes/refine_faces/tabs/advanced.yml"
