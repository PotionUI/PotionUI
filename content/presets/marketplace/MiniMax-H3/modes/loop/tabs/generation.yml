fields:
  - type: "section"
    label: "Video"
    children:
      - type: "row"
        children:
          - name: "seed"
            type: "seed"
            label: "Seed"
            default: -1
            width: "3/5"
          - name: "quantity"
            type: "stepper"
            label: "Quantity"
            default: 1
            configuration: {min: 1, max: 4, step: 1}
            width: "2/5"
            full_width: true

      - name: "resolution"
        type: "resolution"
        formula: "size"
        label: "Resolution"
        ai_hint: "Both axes must be multiples of 32, aspect ratio between 1:4 and 4:1 — the offered sizes are what MiniMax-H3's own canvas math produces. Area is the dominant cost. The start picture is fitted to the picked size once, keeping its aspect ratio, so pick the shape the finished loop should have."
        configuration:
          files:
            - { path: "{{ paths._shared }}/resolutions/minimax_h3_canvas.yml", group: "Native canvas (768 short edge)" }
            - { path: "{{ paths._shared }}/resolutions/minimax_h3_fast.yml", group: "Faster (below native canvas)" }
            - { path: "{{ paths._shared }}/resolutions/minimax_h3_480p.yml", group: "480p (Flex-trained)" }
        default: "1344x768"

      - name: "loop_seconds"
        type: "select"
        formula: "size"
        label: "Length"
        default: 4
        description: "Cut on whole 0.7 s steps, 2.1 s with sound."
        ai_hint: "How long one pass of the loop lasts: 2, 3, 4, 5, 6, 8 or 10 seconds, and nothing else. 2 to 4 seconds suits a wallpaper. The loop is cut on the model's own 17-frame steps, so it can run a fraction of a second longer or shorter than picked (4 s gives 4.25 s); with sound it moves in 2.1 s steps, so 3 s gives 2.1 s and 5 s gives 4.25 s. It is made in two passes: one 0.7 s longer than the loop and one a little over half of it."
        configuration:
          options:
            - { label: "2 s", value: 2 }
            - { label: "3 s", value: 3 }
            - { label: "4 s", value: 4 }
            - { label: "5 s", value: 5 }
            - { label: "6 s", value: 6 }
            - { label: "8 s", value: 8 }
            - { label: "10 s", value: 10 }

      - name: "movement"
        type: "select"
        label: "Movement"
        default: "subtle"
        ai_hint: "Subtle asks for slight, slow movement, the kind that gives a still picture life on a wallpaper. Lively asks for steadier, more visible movement. The loop hides best when motion renews or stays in place over much of the frame (flowing water, waves, rain, snow, swaying grass). Something large drifting slowly one way, such as clouds, has to return to its start and can snap back mid-clip; in a dark, nearly still scene where only fog, haze or reflections drift, the restart can show as a faint tick."
        configuration:
          options:
            - { label: "Subtle", value: "subtle" }
            - { label: "Lively", value: "lively" }

      - name: "sound"
        type: "checkbox"
        label: "Sound"
        default: false
        ai_hint: "Off writes a silent loop, which suits a wallpaper. On adds quiet ambient sound that loops with the picture; the length then moves in 2.1-second steps so the sound wraps cleanly."

  - type: "section"
    label: "Models"
    formula: "models"
    children: "{{ paths.preset }}/files/form/models_loop.yml"
