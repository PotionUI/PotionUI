preview:
  prompt_prefix: ""
  negative: ""
  example_prompt: "a glowing potion bottle standing in tall grass beside a forest path, wildflowers around it, a small village and mountains in the distance, soft morning light, detailed background"

styles:
  - id: "film-35mm"
    name: "35mm Film"
    category: "Photography"
    description: "Everyday analog snapshot, warm color negative stock, fine grain."
    prepend: "A 35mm film photograph of "
    append: ". The frame was shot on a warm color negative stock with a 50mm lens in natural light. Colors are warm and true to life, the grain is fine and visible across the whole frame, highlights roll off softly, and the image has the honest, unretouched look of a scanned analog negative."
    negative: "illustration, painting, 3d render"
  - id: "medium-format"
    name: "Medium Format"
    category: "Photography"
    description: "Large negative, creamy tonality, razor detail, calm composition."
    prepend: "A medium format film photograph of "
    append: ". It was captured on a large 6x7 negative with an 80mm lens, giving creamy, smooth tonal transitions and exceptional fine detail in the plane of focus. The background falls off gently into a soft blur, and the composition is calm and deliberate."
    negative: "illustration, painting, 3d render"
  - id: "editorial"
    name: "Editorial Magazine"
    category: "Photography"
    description: "Glossy magazine spread, styled light, considered framing."
    prepend: "An editorial magazine photograph of "
    append: ". It is styled like a glossy print feature: clean directional light from a large softbox, restrained color grading, generous negative space around the subject and a precise, art-directed composition."
    negative: "illustration, painting, amateur snapshot"
  - id: "street"
    name: "Street Photography"
    category: "Photography"
    description: "Candid, off-center, harsh daylight, a moment caught in passing."
    prepend: "A candid street photograph of "
    append: ". It was taken quickly with a 28mm lens in hard midday light. The framing is slightly off-center, shadows are deep and crisp, incidental everyday details crowd the edges of the frame, and the whole image has the unposed energy of a moment caught in passing."
    negative: "illustration, painting, posed, studio lighting"
  - id: "golden-hour"
    name: "Golden Hour"
    category: "Photography"
    description: "Low warm sun, long shadows, glowing rim light."
    prepend: "A golden hour photograph of "
    append: ". The low sun sits just above the horizon behind the scene, casting long shadows and a warm amber glow. Every backlit edge shimmers with rim light, a faint lens flare drifts across the frame, and the air holds a soft golden haze."
    negative: "overcast, flat lighting, cold tones"
  - id: "overcast-soft"
    name: "Overcast Softbox"
    category: "Photography"
    description: "Flat diffuse daylight, muted tones, no hard shadows."
    prepend: "A photograph of "
    append: ", taken under a thick overcast sky that acts like a giant softbox. The light is even and diffuse with no hard shadows anywhere, the tones are muted and slightly desaturated, and the colors are quiet and true to life."
    negative: "hard shadows, harsh sunlight, oversaturated"
  - id: "night-neon"
    name: "Night Neon"
    category: "Photography"
    description: "City night, colored neon glow, reflections, high ISO grain."
    prepend: "A night photograph of "
    append: ", lit by nearby neon signs glowing magenta and cyan. It was shot handheld at high ISO with a fast lens: wet surfaces mirror the colored light, the shadows are deep, and visible grain covers the frame."
    negative: "daylight, illustration"
  - id: "long-exposure"
    name: "Long Exposure"
    category: "Photography"
    description: "Tripod-mounted, motion smeared into silky streaks."
    prepend: "A long exposure photograph of "
    append: ". The camera was tripod-mounted with the shutter open for several seconds, so moving water and clouds smear into silky streaks and any lights stretch into glowing trails, while every still element stays tack sharp."
    negative: "illustration, camera shake"
  - id: "macro"
    name: "Macro Close-Up"
    category: "Photography"
    description: "Extreme proximity, every surface texture, paper-thin focus."
    prepend: "An extreme close-up macro photograph of "
    append: ". A 100mm macro lens reveals every fine texture, droplet and fiber. The plane of focus is paper-thin, and everything around it melts into a soft, creamy blur."
    negative: "wide shot, illustration"
  - id: "black-and-white"
    name: "Black and White"
    category: "Photography"
    description: "Classic monochrome, rich blacks, silver grain."
    prepend: "A black and white film photograph of "
    append: ". It is classic monochrome with rich deep blacks, luminous highlights and a full range of silver grey midtones, finished with the fine grain of a traditional darkroom print."
    negative: "color, illustration"
  - id: "polaroid"
    name: "Instant Polaroid"
    category: "Photography"
    description: "Instant film, faded colors, soft focus, white frame."
    prepend: "An instant Polaroid photograph of "
    append: ". The colors are slightly faded and washed out with a cool cyan cast, the focus is soft, the exposure uneven and lightly vignetted, and the glossy square print sits inside its white paper frame."
    negative: "illustration, digital art"
  - id: "flash-on-camera"
    name: "Direct Flash"
    category: "Photography"
    description: "Harsh on-camera flash, hard shadows, point-and-shoot snapshot."
    prepend: "A direct flash snapshot of "
    append: ". A harsh on-camera flash lights the scene head-on, blowing out the nearest surfaces and throwing a hard black shadow behind the subject, while the background falls into darkness, like a late-night point-and-shoot photo."
    negative: "soft lighting, studio lighting"
  - id: "drone-aerial"
    name: "Drone Aerial"
    category: "Photography"
    description: "High top-down view, patterns of land, tiny details."
    prepend: "An aerial drone photograph of "
    append: ", seen from high above at a steep top-down angle. The landscape reads as patterns and textures, small details become tiny, and crisp daylight covers a wide sweeping view."
    negative: "ground level view, close-up"
  - id: "anamorphic"
    name: "Anamorphic Widescreen"
    category: "Cinematic"
    description: "Movie frame, oval bokeh, horizontal streak flares."
    prepend: "A cinematic widescreen film still of "
    append: ". It was shot on anamorphic lenses, with oval bokeh, long horizontal blue streak flares across the frame, a gentle vignette and subtle film grain. The color grade makes it feel like a frame lifted from a feature film."
    negative: "illustration, cartoon"
  - id: "teal-orange"
    name: "Teal and Orange"
    category: "Cinematic"
    description: "Blockbuster grade, warm skin tones against cool shadows."
    prepend: "A cinematic still of "
    append: ". It is graded in the modern blockbuster style: warm orange highlights and skin tones set against cool teal shadows, high contrast, a soft haze in the background and a shallow cinematic depth of field."
    negative: "illustration, desaturated"
  - id: "noir"
    name: "Film Noir"
    category: "Cinematic"
    description: "Monochrome, hard light, venetian blind shadows, smoke."
    prepend: "A black and white film noir still of "
    append: ". Hard single-source light cuts through drifting smoke, striped shadows fall as if from venetian blinds, the blacks are deep and inky, surfaces are glossy and wet, and the whole frame carries a heavy 1940s crime-film mood."
    negative: "color, bright cheerful lighting"
  - id: "seventies-film"
    name: "70s Film Stock"
    category: "Cinematic"
    description: "Faded 1970s cinema, warm yellow cast, soft grain, halation."
    prepend: "A 1970s film still of "
    append: ". The color is faded and warm with a yellow-brown cast, the contrast softened, the film grain coarse, bright lights bloom with gentle halation, and the print has the slightly worn look of one projected many times."
    negative: "digital, modern, illustration"
  - id: "oil-painting"
    name: "Classical Oil"
    category: "Fine Art"
    description: "Thick impasto, glazed layers, dramatic light from one side."
    prepend: "A classical oil painting of "
    append: ". It is painted on canvas with thick impasto brushstrokes and layered translucent glazes in rich earthy pigments. Dramatic light enters from one side and leaves deep warm shadows, in the manner of the old masters."
    negative: "photograph, 3d render"
  - id: "impressionist"
    name: "Impressionist"
    category: "Fine Art"
    description: "Broken dabs of color, dappled light, painted outdoors."
    prepend: "An impressionist painting of "
    append: ". The whole scene is built from short broken dabs of bright color laid side by side, with dappled outdoor light and no hard outlines, giving a lively, loosely painted surface that captures a fleeting moment."
    negative: "photograph, sharp outlines"
  - id: "dutch-still-life"
    name: "Dutch Still Life"
    category: "Fine Art"
    description: "Dark background, single window light, exquisite surface detail."
    prepend: "A Dutch Golden Age still life painting of "
    append: ". It is set against a near-black background with a single soft window light from the upper left. Glass, dew and fabric are rendered meticulously in muted browns and greens, and the painting has a quiet air of stillness."
    negative: "photograph, bright background"
  - id: "ukiyo-e"
    name: "Ukiyo-e Woodblock"
    category: "Fine Art"
    description: "Japanese woodblock print, flat color, bold outlines, patterned sky."
    prepend: "A traditional Japanese ukiyo-e woodblock print of "
    append: ". It uses flat areas of color with bold dark outlines, stylized patterned clouds and waves, and a limited palette of indigo, ochre and soft red, with the texture of ink pressed into handmade paper."
    negative: "photograph, 3d render"
  - id: "art-nouveau"
    name: "Art Nouveau"
    category: "Fine Art"
    description: "Flowing organic lines, ornate floral border, muted gold."
    prepend: "An art nouveau poster illustration of "
    append: ". Flowing organic linework frames the scene inside an ornate border of stylized flowers and vines, rendered in flat muted colors with gold accents, with the elegant decorative feel of a turn-of-the-century lithograph."
