########
## Z-Image: E2E test suite (grounded in a maintainer TXT2IMG session).
## Authoring reference: docs/presets.md "Testing presets"
########
schema: 1

cases:
  # Turbo smoke: session's turbo profile (8 steps, CFG 1.0, euler), shift 3.1
  # kept verbatim, smallest square resolution. NextDiT (turbo) + Qwen3-4B TE +
  # Z-Image VAE pinned by real sha256 (present on disk).
  - name: "zimage-turbo-baseline-fast"
    mode: "txt2img"
    seed: 12345
    tags: ["fast"]
    form:
      prompt: "a small wooden sailboat on a calm blue lake"
      speed_profile: "turbo"
      steps: 8
      cfg: 1
      sampler: "euler"
      shift: 3.1
      resolution: "1024x1024"
    models:
      diffusion_model:
        sha256: "2407613050b809ffdff18a4ac99af83ea6b95443ecebdf80e064a79c825574a6"
      text_encoder:
        sha256: "6c671498573ac2f7a5501502ccce8d2b08ea6ca2f661c458e708f36b36edfc5a"
      vae:
        sha256: "afc8e28272cd15db3919bacdb6918ce9c1ed22e96cb12c4d5ed0fba823529e38"
    checks:
      min_outputs: 1
      resolution: "1024x1024"
      not_black: true
