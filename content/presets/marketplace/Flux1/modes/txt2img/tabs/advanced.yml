fields:
  - type: "section"
    label: "Sampling"
    children:
      - name: "steps"
        type: "slider"
        label: "Steps"
        audience: "advanced"
        default: 30
        configuration: {min: 1, max: 100, step: 1}

      - name: "sampler"
        type: "select"
        label: "Sampler"
        audience: "advanced"
        default: "euler"
        configuration:
          options:
            - { label: "Euler", value: "euler" }
            - { label: "DPM++ 2M", value: "dpmpp_2m" }
            - { label: "UniPC", value: "unipc" }

      - name: "guidance"
        type: "slider"
        label: "Guidance"
        audience: "advanced"
        default: 3.5
        configuration: {min: 0.0, max: 20.0, step: 0.1}

      # Trajectory warm-start: re-rendering the same seed with a tweaked
      # prompt reuses part of the previous run's sampling trajectory
      # (NativeGenerator._plan_warm_start gates eligibility; Euler only).
      - name: "iterate_mode"
        type: "checkbox"
        label: "Iterate mode"
        audience: "advanced"
        default: false
        ai_hint: "A speed knob for rapid iterative regeneration -- tweaking a prompt slightly and re-rendering the same seed. Suggest enabling it only for that repeated-tweak workflow, never for a single one-off render, and only when Sampler is Euler."

  - type: "section"
    label: "Step cache (FBCache)"
    audience: "advanced"
    children:
      - type: "row"
        children:
          - name: "step_cache_threshold"
            type: "slider"
            label: "Cache threshold"
            default: 0.0
            ai_hint: "A speed-for-fidelity trade, never a quality improvement -- it only removes work. Suggest 0.08 when the user explicitly wants a Flux render faster and can accept some softening of fine detail; 0.15 only if they ask for aggressive speed. Keep it at 0.0 for final renders, and for short/distilled runs (under ~15 steps) where the warmup steps already cover most of the trajectory and there is almost nothing left to skip."
            configuration: {min: 0.0, max: 0.3, step: 0.01}
          - name: "step_cache_warmup_steps"
            type: "slider"
            label: "Warmup steps"
            default: 4
            ai_hint: "Only has an effect when Cache threshold is above 0. Raise toward 6-8 if a cached run loses composition -- it gives back some of the speed."
            configuration: {min: 0, max: 12, step: 1}
          - name: "step_cache_max_skips"
            type: "slider"
            label: "Max consecutive skips"
            default: 3
            ai_hint: "Only has an effect when Cache threshold is above 0. Lower to 1-2 if a cached run drifts or loses detail late in the trajectory."
            configuration: {min: 0, max: 10, step: 1}
