name: "custom"
mode_label: "Combine images"
short_description: "Edit the first image using up to nine others; type @ in the prompt to point at one."
fields:
  - type: "tabs"
    children:
      - type: "tab"
        anchor: "generation"
        label: "Generation"
        configuration:
          icon: "generation"
          icon_display: "icon_only"
        children: "{{ paths.preset }}/modes/combine/tabs/generation.yml"
      - type: "tab"
        anchor: "references"
        label: "References"
        configuration:
          icon: "image"
          icon_display: "icon_only"
        children: "{{ paths.preset }}/modes/combine/tabs/references.yml"
      - type: "tab"
        anchor: "lora"
        label: "LoRA"
        configuration:
          icon: "lora"
          icon_display: "icon_only"
        children: "{{ paths._shared }}/tabs/lora.yml"
      - type: "tab"
        anchor: "advanced"
        label: "Advanced"
        audience: "advanced"
        configuration:
          icon: "settings"
          icon_display: "icon_only"
        children: "{{ paths.preset }}/modes/txt2img/tabs/advanced.yml"
