pipeline:
  #############
  ## Model loader (MMDiT + Qwen3-VL-8B TE + RGBA 16x VAE, per-component cached)
  ############
  - name: "model_loader/qwen_image21"
    enabled: true
    configuration:
      diffusion_model:
        file_path: "{{ form.diffusion_model }}"
        name: "{{ form.diffusion_model }}"
      text_encoder:
        file_path: "{{ form.text_encoder }}"
        name: "{{ form.text_encoder }}"
      vae:
        file_path: "{{ form.vae }}"
        name: "{{ form.vae }}"
      loras:
        "@loop":
          items: "{{ ([{'model': form.turbo_lora, 'strength': 1.0}] if form.speed_profile == 'turbo' and form.turbo_lora else []) + (form.loras or []) }}"
          template:
            file_path: "{{ item.model }}"
            weight: "{{ item.strength }}"
      # The whole point of this mode: keep+load the vision tower so the text
      # encoder can see the source image(s), not just describe them in text.
      vision: true

  #############
  ## Media Loader (target image)
  ############
  - name: "media_loader"
    id: "media_loader"
    enabled: true
    configuration:
      media:
        - type: "image"
          path: "{{ form.source_image }}"

  #############
  ## Region mask (optional)
  ############
  - name: "media_loader"
    id: "mask_loader"
    enabled: "{{ (form.source_image_inpaint_mask | default('', true)) != '' }}"
    configuration:
      media:
        - type: "image"
          path: "{{ form.source_image_inpaint_mask | default('', true) }}"

  #############
  ## Region crop (context scales with the region, resampled to the working size)
  ############
  - name: "inpaint_region_crop"
    id: "inpaint_region_crop"
    enabled: "{{ (form.source_image_inpaint_mask | default('', true)) != '' }}"
    input:
      - ["image", "media_loader", "image"]
      - ["mask", "mask_loader", "image"]
    configuration:
      strategy: "scaled"
      context: "{{ form.region_context }}"
      multiple: 16

  #############
  ## Prompt encoder (shared pipe; produces the vision-grounded conditioning)
  ############
  - name: "prompt_encoder"
    input:
      - ["text_encoder", "model_loader/qwen_image21", "text_encoder"]
      - ["image", "{% if (form.source_image_inpaint_mask | default('', true)) != '' %}inpaint_region_crop{% else %}media_loader{% endif %}", "{% if (form.source_image_inpaint_mask | default('', true)) != '' %}images{% else %}image{% endif %}"]
    enabled: true
    configuration:
      p_prompt:
        input: "{{ generation.prompts.first.positive }}"
        output: "{{ generation.prompts.first.positive }}"
      n_prompt:
        input: "{{ generation.prompts.first.negative }}"
        output: "{{ generation.prompts.first.negative }}"
      # Per-image expanded prompt pairs (src/core/prompt/expander.py).
      pairs: "{{ generation.prompts.pairs }}"
      quantity: "{{ form.quantity }}"
      # Qwen-Image-2.1 uses true CFG -> encode the negative pass (guidance_scale > 1).
      guidance_scale: "{{ form.cfg | default(generation.profile.guidance) }}"
      negative_applied: "{{ generation.negative_applied }}"

  #############
  ## Seed generator
  ############
  - name: "seed_generator"
    enabled: true
    configuration:
      seed: "{{ form.seed }}"
      quantity: "{{ form.quantity }}"

  #############
  ## Rendered prompts (provenance)
  ## Surfaces the per-image expanded prompts ({a|b}, ${variables}, phrasebook
  ## already resolved on the backend - see src/features/prompt/expander.py) as
  ## pipe artifacts, the prompt counterpart of seed_generator. `pairs` is the
  ## real list, handed in exactly as prompt_encoder receives it.
  ############
  - name: "dynamic_prompts_renderer"
    id: "dynamic_prompts_renderer"
    enabled: true
    configuration:
      pairs: "{{ generation.prompts.pairs }}"
      quantity: "{{ form.quantity }}"

  #############
  ## IOType to Value Converter
  ############
  - name: "from_iotype"
    id: "from_iotype"
    enabled: true
    input:
      - ["seed", "seed_generator", "seed"]
    configuration:
      from: "seed"

  #############
  ## Parameter Emitter
  ############
  - name: "param_emitter"
    id: "param_emitter"
    enabled: true
    input:
      - ["seed", "from_iotype", "seed"]
    configuration:
      quantity: "{{ form.quantity }}"
      parameters:
        - ["model", "{{ form.diffusion_model }}"]
        - ["model", "{{ form.text_encoder }}"]
        - ["model", "{{ form.vae }}"]
        - "@loop":
            items: "{{ ([{'model': form.turbo_lora}] if form.speed_profile == 'turbo' and form.turbo_lora else []) + (form.loras | active_loras) }}"
            template: ["model", "{{ item.model }}"]
        # Per-image arrays, so history records the prompt each image actually ran with.
        - ["positive_prompt", "{{ generation.prompts.positives }}"]
        - ["negative_prompt", "{{ generation.prompts.negatives }}"]
        - ["cfg", "{{ form.cfg | default(generation.profile.guidance) }}"]
        - ["steps", "{{ form.steps | default(generation.profile.steps) }}"]
        - ["sampler", "{{ form.sampler | default(generation.profile.sampler) }}"]
        - ["schedule", "{{ form.schedule }}"]

  #############
  ## Generator (edit mode: vision-grounded conditioning + ref_latents)
  ############
  - name: "generator/qwen_image21"
    input:
      - ["model", "model_loader/qwen_image21", "model"]
      - ["conditioning", "prompt_encoder", "conditioning"]
      - ["seed", "seed_generator", "seed"]
      - ["image", "{% if (form.source_image_inpaint_mask | default('', true)) != '' %}inpaint_region_crop{% else %}media_loader{% endif %}", "{% if (form.source_image_inpaint_mask | default('', true)) != '' %}images{% else %}image{% endif %}"]
    enabled: true
    configuration:
      mode: "edit"
      steps: "{{ form.steps | default(generation.profile.steps) }}"
      guidance: "{{ form.cfg | default(generation.profile.guidance) }}"
      # Optional multiplicative shift override; blank -> resolution-dynamic mu.
      shift: "{% set s = form.shift | default('') %}{% if s is not none and s != '' %}{{ s }}{% endif %}"
      sampler: "{{ form.sampler | default(generation.profile.sampler) }}"
      # Sigma schedule (Advanced tab): 'shift' is the registry key for the
      # model's own ramp, so the default value is a no-op; any other key
      # replaces it outright (see docs/techniques/samplers-and-schedules.md).
      schedule: "{{ form.schedule }}"
      quantity: "{{ form.quantity }}"
      # Step cache (FBCache, Advanced tab): assembled into the nested
      # `step_cache` dict FlowMatchGeneratorPipe.build_context reads directly.
      # rel_threshold 0.0 (default) never wraps the guidance strategy, so an
      # untouched form renders byte-identical to before this knob existed.
      step_cache:
        rel_threshold: "{{ form.step_cache_threshold }}"
        warmup_steps: "{{ form.step_cache_warmup_steps }}"
        max_consecutive_skips: "{{ form.step_cache_max_skips }}"

  #############
  ## Region restore (feathered pixel composite, colour matched to the surroundings)
  ############
  - name: "inpaint_region_restore"
    id: "inpaint_region_restore"
    enabled: "{{ (form.source_image_inpaint_mask | default('', true)) != '' }}"
    input:
      - ["inpainted_image", "generator/qwen_image21", "image"]
      - ["crop_region", "inpaint_region_crop", "crop_region"]
      - ["original_image", "inpaint_region_crop", "original_image"]
      - ["original_mask", "inpaint_region_crop", "original_mask"]
    configuration:
      strategy: "composite"

  #############
  ## Gallery
  ############
  - name: "gallery"
    input:
      - ["image", "{% if (form.source_image_inpaint_mask | default('', true)) != '' %}inpaint_region_restore{% else %}generator/qwen_image21{% endif %}", "image"]
      - ["seed", "seed_generator", "seed"]
    enabled: true
