schema: 1
id: "01M3SV8HJTGT3JPPH2BA5MP6PR"
name: "OpenRouter Video"
category: "video"
version: "1.1.0"
engine: "cloud"
driver: "cloud.openrouter"
tags: ["cloud", "openrouter", "video"]

media:
  cover: "public/examples/1-mwjx8ew9.mp4"

  gallery:
    - src: "public/examples/1-mwjx8ew9.mp4"
      prompt: "A tall slender glass potion bottle on a dark wooden table, the liquid inside moving like a miniature storm, a strip of glowing film frames spiralling out of the open neck and curling upward into a drifting band of soft blue light, each frame showing a blurred moment of motion, a running horse, a wave, falling leaves. Faint motion trails, gentle volumetric haze, single warm key light from the left and a cool blue fill from above, dark moody background, cinematic, shallow depth of field, high detail, 16:9, no text, no logos"
      seed: 1743904755
      mode: "txt2video"
formulas:
  groups:
    size:     { label: "Size" }
    provider: { label: "Provider options" }
    models:   { label: "Models", preselect: false }

modes:
  - txt2video
  - img2video

vars:
  video_director:
    family: "cloud"
    model_field: "model"
    preset_modes: ["txt2video", "img2video"]
    segment_routing: true
    modes:
      t2v: {}
      director:
        keyframes: "first_only"
        max_segments: 6
        fps_locked: true
        max_overlap_frames: 0
        continue_from_video: true
        continuation:
          source: "last_frame"
          overlap_frames: 0
          stitch: true
        tips:
          - "Every shot is its own paid request to the provider, so a film of four shots costs four videos."
          - "A shot that continues starts from the last frame of the shot before it. Give a shot its own start picture to cut instead."
    limits:
      default_duration: 5
      default_fps: 24
      max_duration: 10
    preset_mode_overrides:
      img2video:
        modes:
          t2v: null
          i2v: {}
          flf: {}
