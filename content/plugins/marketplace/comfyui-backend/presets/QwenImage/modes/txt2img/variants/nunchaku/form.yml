name: "nunchaku"
label: "Nunchaku (FP4)"
description: "Nunchaku FP4-quantized DiT with the NunchakuQwenImageLoraStackV3 slot-fill LoRA mechanism and configurable CPU offload. No model is preselected — pick a matching nunchaku_qwen_image_*_fp4 DiT, a Qwen 2.5 VL CLIP, and the Qwen-Image VAE from the pickers."
default: false
fields:
  - type: "tabs"
    children:
      - type: "tab"
        label: "Generation"
        configuration:
          icon: "generation"
          icon_display: "icon_only"
        children: "{{ paths.preset }}/modes/txt2img/variants/nunchaku/tabs/generation.yml"

      - type: "tab"
        label: "LoRA"
        configuration:
          icon: "lora"
          icon_display: "icon_only"
        children: "{{ paths.preset }}/modes/txt2img/variants/nunchaku/tabs/lora.yml"

      - type: "tab"
        label: "Advanced"
        audience: "advanced"
        configuration:
          icon: "settings"
          icon_display: "icon_only"
        children: "{{ paths.preset }}/modes/txt2img/variants/nunchaku/tabs/advanced.yml"
