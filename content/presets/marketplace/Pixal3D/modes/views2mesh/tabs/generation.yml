fields:
  - name: "resolution_tier"
    type: "select"
    formula: "size"
    label: "Detail Level"
    default: "1536"
    description: "How finely the shape is resolved. Higher captures more detail and costs sharply more time and VRAM."
    ai_hint: "Picks which of Pixal3D's two cascade paths runs, and that decides how much geometric detail survives. Pixal3D has no 512 tier: its weights ship no texture model for it, so the choice is 1024 or 1536. 1536 is upstream's default and the heaviest on VRAM; it also gives denser raw meshes, so the export step takes longer at the same decimation target. Suggest 1024 while the user is still checking whether an image reconstructs well, or on a card that runs out of memory at 1536."
    configuration:
      options:
        - { label: "Standard (1024)", value: "1024", sub_label: "Cascade · lighter on VRAM" }
        - { label: "High (1536)", value: "1536", sub_label: "Cascade · default · heaviest on VRAM" }

  - name: "camera_fov"
    type: "slider"
    formula: "camera"
    label: "Camera FOV"
    default: 20.0
    description: "Horizontal field of view of the cameras that took the views, in degrees. One value for all four views."
    ai_hint: "Pixal3D is pixel-aligned: every voxel is projected into each view through its camera and samples the features at that point, and the views are then averaged. The four cameras sit on one orbit at distance 1.1 x 0.5 / tan(fov / 2), so a wrong FOV misplaces every voxel's sample in every view. 20 is the FOV of upstream's shipped multi-view rig and ComfyUI's default; keep it unless the views were rendered with a known, different FOV."
    configuration:
      min: 5
      max: 120
      step: 0.01
      tooltip: "Multi-view rig default 20°"

  - type: "section"
    label: "Mesh"
    children:
      - name: "remove_background"
        type: "checkbox"
        formula: "mesh"
        label: "Remove background"
        default: false
        description: "Segment the subject out of every view's background before reconstructing it."
        ai_hint: "Left off, whatever is in the frame gets reconstructed, so a pre-cut image is best. An image that already has a transparent background needs nothing else; an opaque one is matted with the checkpoint picked under Matting Model, and nothing is ever downloaded for you."

      - name: "seed"
        type: "seed"
        label: "Seed"
        default: -1

      - type: "row"
        children:
          - name: "decimation_target"
            type: "slider"
            formula: "mesh"
            label: "Decimation Target"
            default: 300000
            description: "Face budget the exported mesh is simplified down to."
            ai_hint: "This costs export time, not generation time: the UV unwrap runs on CPU and grows faster than the face count — at the default Balanced unwrap about 2 seconds at 50k faces, 5 at 100k, 12 at 200k and 20 at 300k, and roughly four times that on Best. The 300k default keeps small parts such as lamps, wheels and panel edges; go lower for a lightweight asset and up to 1M when the user wants the densest mesh."
            configuration:
              min: 20000
              max: 1000000
              step: 10000

          - name: "texture_size"
            type: "select"
            formula: "mesh"
            label: "Texture Size"
            default: 2048
            description: "Edge length of the baked PBR maps."
            configuration:
              options:
                - { label: "1024", value: 1024 }
                - { label: "2048", value: 2048 }
                - { label: "4096", value: 4096 }

  - type: "section"
    label: "Models"
    formula: "models"
    children:
      - name: "diffusion_model"
        type: "model"
        label: "Pixal3D Multi-view Transformer"
        required: true
        description: "The multi-view Pixal3D bundle. The single-view and multi-view bundles have identical keys and are told apart only by file name: the file name must contain \"multiview\", and a mismatched bundle is refused."
        configuration:
          model_type: "diffusion_model"
          placeholder: "Select pixal3d_multiview_bf16.safetensors..."
          recommendations:
            - name: "pixal3d_multiview_bf16.safetensors"
              provider: "huggingface"
              ref: '{"repo": "Comfy-Org/Pixal3D", "file": "diffusion_models/pixal3d_multiview_bf16.safetensors", "revision": "main"}'
              size: "11.0 GB"
              description: "Pixal3D multi-view bundle (bf16, MIT). Not part of the Pixal3D Starter recipe's download."

      - name: "shape_vae"
        type: "model"
        label: "Shape VAE"
        required: true
        description: "Decodes the sparse structure and the shape latent into geometry. The same file TRELLIS.2 uses."
        configuration:
          model_type: "vae"
          placeholder: "Select trellis_2_shape_vae_bf16.safetensors..."

      - name: "texture_vae"
        type: "model"
        label: "Texture VAE"
        required: true
        description: "Decodes the texture latent into the PBR attributes baked onto the mesh. The same file TRELLIS.2 uses."
        configuration:
          model_type: "vae"
          placeholder: "Select trellis_2_texture_vae_bf16.safetensors..."

      - name: "image_encoder"
        type: "model"
        label: "Image Encoder (DINOv3 + NAF)"
        required: true
        description: "DINOv3 ViT-L/16 with the NAF feature upsampler bundled in the same file. The plain TRELLIS.2 dino_v3_vit_l file has no NAF weights and is refused."
        configuration:
          model_type: "text_encoder"
          placeholder: "Select dino_v3_L_naf_fp32.safetensors..."

      - name: "matting_model"
        type: "model"
        label: "Matting Model"
        required: false
        description: "Only used by Remove background, and only when the source image is opaque. BiRefNet-general from ZhengPeng7/BiRefNet (MIT) and RMBG-2.0 from briaai/RMBG-2.0 (stronger on product shots, non-commercial licence) share the same architecture, so either loads."
        configuration:
          model_type: "detection_segm"
          placeholder: "Select BiRefNet-general.safetensors..."
