pipeline:
  - name: "media_loader"
    id: "media_loader"
    enabled: true
    configuration:
      validate_files: true
      max_file_size: 524288000
      auto_detect_type: true
      media:
        - type: "video"
          path: "{{ form.input_video }}"

  - name: "model_loader/minimax_h3"
    enabled: true
    configuration:
      model:
        file_path: "{{ form.model }}"
        name: "{{ form.model }}"
      text_encoder:
        file_path: "{{ form.text_encoder }}"
        name: "{{ form.text_encoder }}"
      video_vae:
        file_path: "{{ form.video_vae }}"
        name: "{{ form.video_vae }}"
      audio_vae:
        file_path: "{{ form.audio_vae }}"
        name: "{{ form.audio_vae }}"
      upscale_model:
        file_path: "{{ form.upscale_model }}"
        name: "{{ form.upscale_model }}"
      loras:
        "@loop":
          items: "{{ form.refine_loras | default([]) }}"
          template:
            file_path: "{{ item.model }}"
            weight: "{{ item.strength }}"

  - name: "prompt_encoder"
    input:
      - ["text_encoder", "model_loader/minimax_h3", "text_encoder"]
    enabled: true
    configuration:
      p_prompt:
        input: "{{ generation.prompts.first.positive }}"
        output: "{{ generation.prompts.first.positive }}"
      pairs: "{{ generation.prompts.pairs }}"
      quantity: "{{ form.quantity | default(1) }}"
      guidance_scale: 1.0

  - name: "seed_generator"
    enabled: true
    configuration:
      seed: "{{ form.seed | default(-1) }}"
      quantity: "{{ form.quantity | default(1) }}"

  - name: "dynamic_prompts_renderer"
    id: "dynamic_prompts_renderer"
    enabled: true
    configuration:
      pairs: "{{ generation.prompts.pairs }}"
      quantity: "{{ form.quantity | default(1) }}"

  - name: "from_iotype"
    id: "from_iotype"
    enabled: true
    input:
      - ["seed", "seed_generator", "seed"]
    configuration:
      from: "seed"

  - name: "param_emitter"
    id: "param_emitter"
    enabled: true
    input:
      - ["seed", "from_iotype", "seed"]
    configuration:
      quantity: "{{ form.quantity | default(1) }}"
      parameters:
        - ["model", "{{ form.model }}"]
        - ["model", "{{ form.text_encoder }}"]
        - ["model", "{{ form.video_vae }}"]
        - ["model", "{{ form.audio_vae }}"]
        - ["model", "{{ form.upscale_model }}"]
        - "@loop":
            items: "{{ form.refine_loras | default([]) | active_loras }}"
            template: ["model", "{{ item.model }}"]
        - ["positive_prompt", "{{ generation.prompts.positives }}"]
        - ["target_size", "{{ form.target_size | default('hd') }}"]
        - ["refine_denoise", "{{ form.refine_denoise | default('0.45') }}"]
        - ["refine_steps", "{{ form.refine_steps | default(4) }}"]

  - name: "latent_upscaler/minimax_h3"
    id: "latent_upscaler"
    input:
      - ["video", "media_loader", "video"]
      - ["model", "model_loader/minimax_h3", "model"]
    enabled: true
    configuration:
      target_mode: "{{ 'scale' if (form.target_size | default('hd')) in ['1.5x', '2x'] else 'megapixels' }}"
      megapixels: "{{ 3.7 if (form.target_size | default('hd')) == '2k' else 2.1 }}"
      scale: "{{ 2.0 if (form.target_size | default('hd')) == '2x' else 1.5 }}"

  - name: "generator/video_minimax_h3"
    id: "generator_refine"
    input:
      - ["model", "model_loader/minimax_h3", "model"]
      - ["conditioning", "prompt_encoder", "conditioning"]
      - ["seed", "seed_generator", "seed"]
      - ["initial_latent", "latent_upscaler", "latent"]
      - ["source_frame_count", "latent_upscaler", "source_frame_count"]
      - ["audio", "media_loader", "video"]
    enabled: true
    configuration:
      mode: "video"
      quantity: "{{ form.quantity | default(1) }}"
      preview: "{{ form.preview | default(true) }}"
      decode: true
      audio_source: "passthrough"
      audio_refine: "{{ form.audio_refine | default('lock') }}"
      denoise: "{{ form.refine_denoise | default('0.45') | float }}"
      video_sigma_shift: "{{ form.refine_video_sigma_shift | default(9.0) }}"
      steps: "{{ form.refine_steps | default(4) }}"
      sampler: "{{ form.refine_sampler | default('euler') }}"
      scheduler: "{{ form.scheduler | default('simple') }}"
      manual_sigmas: "{{ form.refine_manual_sigmas | default('') }}"
      manual_audio_sigmas: "{{ form.refine_manual_audio_sigmas | default('') }}"
      step_cache_threshold: "{{ form.step_cache_threshold | default(0.0) }}"
      step_cache_warmup_steps: "{{ form.step_cache_warmup_steps | default(4) }}"
      step_cache_max_skips: "{{ form.step_cache_max_skips | default(3) }}"
      sparse_attn: "{{ form.sparse_attn | default('off') }}"
      sol_attn_tau: "{{ form.sol_attn_tau | default(1.0) }}"
      sla_sparsity: "{{ form.sla_sparsity | default(0.9) }}"
      sla_block_size: "{{ form.sla_block_size | int }}"
      sparse_attn_dense_last_steps: "{{ form.sparse_attn_dense_last_steps | default(2) }}"
      seq_chunk_rows: "{{ form.seq_chunk_rows | default(16384) }}"

  - name: "gallery"
    input:
      - ["video", "generator_refine", "video"]
      - ["seed", "seed_generator", "seed"]
    enabled: true
