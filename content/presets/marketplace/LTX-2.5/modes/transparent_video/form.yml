prompt: "none"
name: "custom"
mode_label: "Transparent video"
short_description: "Cut the subject out of a video and keep it see-through."
requirements:
  - type: "model"
    field: "effect_lora"
    hint: "Download the Alpha-Gen LoRA in this mode."
fields:
  - type: "tabs"
    children:
      - type: "tab"
        label: "Generation"
        configuration:
          icon: "generation"
          icon_display: "icon_only"
        children: "{{ paths.preset }}/modes/transparent_video/tabs/generation.yml"
      - type: "tab"
        label: "References"
        configuration:
          icon: "image"
          icon_display: "icon_only"
        children: "{{ paths.preset }}/modes/transparent_video/tabs/references.yml"
      - type: "tab"
        label: "LoRA"
        configuration:
          icon: "lora"
          icon_display: "icon_only"
        children: "{{ paths.preset }}/modes/video/tabs/lora.yml"
      - type: "tab"
        label: "Advanced"
        audience: "advanced"
        configuration:
          icon: "settings"
          icon_display: "icon_only"
        children: "{{ paths.preset }}/modes/transparent_video/tabs/advanced.yml"
