fields:
  - type: "row"
    children:
      - name: "seed"
        type: "seed"
        label: "Seed"
        default: -1
        width: "3/5"
        ai_hint: "-1 picks a random seed each time. Not every hosted model honours a seed; when it does not, the result is simply not repeatable."

      - name: "count"
        type: "stepper"
        label: "Quantity"
        default: 1
        width: "2/5"
        full_width: true
        configuration: { min: 1, max: 8, step: 1 }
        ai_hint: "How many videos to generate. Each model produces a fixed number per request, so a larger count is split into several requests and billed for each."

  - name: "aspect_ratio"
    type: "select"
    formula: "size"
    label: "Aspect ratio"
    ai_hint: "The shape of the video. The choices come from the selected model."
    capability: { model_field: "model", param: "aspect_ratio" }

  - name: "resolution"
    type: "select"
    formula: "size"
    label: "Resolution"
    ai_hint: "The size tier of the video. Larger tiers usually cost more."
    capability: { model_field: "model", param: "resolution" }

  - name: "duration"
    type: "number"
    formula: "size"
    label: "Duration (seconds)"
    ai_hint: "How long the clip runs. Longer clips cost more."
    capability: { model_field: "model", param: "duration_s" }

  - name: "generate_audio"
    type: "checkbox"
    label: "Generate audio"
    default: false
    ai_hint: "Also generate a soundtrack, where the model supports it."
    capability: { model_field: "model", param: "generate_audio" }

