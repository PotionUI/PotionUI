styles:
  - id: "film-35mm"
    name: "35mm Film"
    category: "Photography"
    description: "Everyday analog snapshot, warm color negative stock, fine grain."
    prepend: "A 35mm analog film photograph of "
    append: ". Shot on Kodak Portra 400 with a 50mm lens at f/2.8, soft natural daylight from the side, warm true-to-life skin and foliage tones, fine visible film grain, gently rolled-off highlights and the honest, unretouched look of a scanned negative."
    negative: ""
  - id: "medium-format"
    name: "Medium Format"
    category: "Photography"
    description: "Large negative, creamy tonality, razor detail, calm composition."
    prepend: "A medium format film photograph of "
    append: ". Shot on a 6x7 camera with an 80mm lens at f/4, soft diffused window-like light, creamy smooth tonal transitions, exceptional fine detail in the plane of focus, a gentle falloff into a softly blurred background and a calm, deliberate composition."
    negative: ""
  - id: "editorial"
    name: "Editorial Magazine"
    category: "Photography"
    description: "Glossy magazine spread, styled light, considered framing."
    prepend: "An editorial magazine photograph of "
    append: ". Lit with a large softbox key light and a subtle rim light, restrained color grading, generous clean negative space, precise art-directed framing and the polished finish of a glossy print feature."
    negative: ""
  - id: "street"
    name: "Street Photography"
