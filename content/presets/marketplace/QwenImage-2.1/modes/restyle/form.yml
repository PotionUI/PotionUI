prompt_label: "What to change it to"
prompt_placeholder: "a soft watercolour painting"
name: "custom"
mode_label: "Restyle"
short_description: "Change the style, background or lighting, make it a photo, colourise or restore."
fields:
  - type: "tabs"
    children:
      - type: "tab"
        anchor: "generation"
        label: "Generation"
        configuration:
          icon: "generation"
          icon_display: "icon_only"
        children: "{{ paths.preset }}/modes/restyle/tabs/generation.yml"
      - type: "tab"
        anchor: "references"
        label: "Image"
        configuration:
          icon: "image"
          icon_display: "icon_only"
        children: "{{ paths.preset }}/modes/restyle/tabs/references.yml"
      - type: "tab"
        anchor: "lora"
        label: "LoRA"
        configuration:
          icon: "lora"
          icon_display: "icon_only"
        children:
          file: "{{ paths._shared }}/native/lora.yml"
          vars:
            hint: LoRAs add specialized styles, concepts, or characters to Qwen-Image-2.1. Multiple LoRAs can be combined. 0.5-0.8 is recommended for most LoRAs, 1.0 = full effect. LoRAs made for the first Qwen-Image or its edit versions do not load on this model; the run log reports any LoRA keys that did not match.
            placeholder: Select a Qwen-Image-2.1 LoRA...
            max_items: 10
            strength_min: -10.0
            strength_max: 10.0
            strength_step: 0.1
      - type: "tab"
        anchor: "advanced"
        label: "Advanced"
        audience: "advanced"
        configuration:
          icon: "settings"
          icon_display: "icon_only"
        children: "{{ paths.preset }}/modes/txt2img/tabs/advanced.yml"
