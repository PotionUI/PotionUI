# LTX-2.5 ships its components as SEPARATE files, unlike the 2.0/2.3
# all-in-one checkpoints the `LTX-2 / 2.3` preset targets: the DiT file is
# transformer-only, the video VAE and audio VAE(+vocoder) are standalone, and
# the text-embedding projection has moved off the DiT onto the Gemma4 text
# encoder. Every picker on this tab therefore points at a different file --
# see docs/models/ltx.md's split-file layout table.
#
# `video_vae` is REQUIRED, not optional: with a transformer-only DiT there is
# no embedded `vae.*` to slice, and model_loader/ltx's `_require_embedded_
# component` pre-flight would reject the run. `audio_vae` stays optional
# because audio itself is optional (Generate Audio, Generation tab) -- the
# same pre-flight raises only when audio is actually requested.
fields:
  - name: "model"
    type: "model"
    label: "LTX-2.5 DiT (transformer-only)"
    required: true
    configuration:
      model_type: "diffusion_model"
      placeholder: "ltx-2.5-22b-dev-transformer-bf16 / -distilled-..."
      filter_tags: "@config:checkpoint_tags"
      recommendations:
        - name: "ltx-2.5-22b-distilled-transformer-comfy-int8-convrot.safetensors"
          provider: "huggingface"
          ref: '{"repo": "Lightricks/LTX-2.5", "file": "diffusion_models/ltx-2.5-22b-distilled-transformer-comfy-int8-convrot.safetensors", "revision": "main"}'
          size: "20.03 GB"
          description: "LTX-2.5 22B distilled DiT, int8 ConvRot - half of bf16. Gated repo: accept the LTX-2 license on Hugging Face and set a token in Admin - Plugins."
        - name: "ltx-2.5-22b-distilled-transformer-nvfp4.safetensors"
          provider: "huggingface"
          ref: '{"repo": "Lightricks/LTX-2.5", "file": "diffusion_models/ltx-2.5-22b-distilled-transformer-nvfp4.safetensors", "revision": "main"}'
          size: "17.44 GB"
          description: "LTX-2.5 22B distilled DiT, nvfp4 - smallest tier, fast path needs Blackwell. Gated repo: accept the LTX-2 license on Hugging Face and set a token in Admin - Plugins."
        - name: "ltx-2.5-22b-distilled-transformer-bf16.safetensors"
          provider: "huggingface"
          ref: '{"repo": "Lightricks/LTX-2.5", "file": "diffusion_models/ltx-2.5-22b-distilled-transformer-bf16.safetensors", "revision": "main"}'
          size: "39.13 GB"
          description: "LTX-2.5 22B distilled DiT, bf16 reference. Gated repo: accept the LTX-2 license on Hugging Face and set a token in Admin - Plugins."
        - name: "ltx-2.5-22b-dev-transformer-bf16.safetensors"
          provider: "huggingface"
          ref: '{"repo": "Lightricks/LTX-2.5", "file": "diffusion_models/ltx-2.5-22b-dev-transformer-bf16.safetensors", "revision": "main"}'
          size: "39.13 GB"
          description: "LTX-2.5 22B dev DiT, bf16 - non-distilled, more steps. Gated repo: accept the LTX-2 license on Hugging Face and set a token in Admin - Plugins."

  - name: "text_encoder"
    type: "model"
    label: "Text Encoder (Gemma4-12B with projection)"
    required: true
    configuration:
      model_type: "text_encoder"
      placeholder: "gemma4-12b-with-proj-ltx-2.5-bf16..."
      filter_tags: "@config:text_encoder_tags"
      recommendations:
        - name: "gemma4-12b-with-proj-ltx-2.5-comfy-int8-convrot.safetensors"
          provider: "huggingface"
          ref: '{"repo": "Lightricks/LTX-2.5", "file": "text_encoders/gemma4-12b-with-proj-ltx-2.5-comfy-int8-convrot.safetensors", "revision": "main"}'
          size: "14.32 GB"
          description: "Gemma4-12B with text-embedding projection, int8 ConvRot. Gated repo: accept the LTX-2 license on Hugging Face and set a token in Admin - Plugins."
        - name: "gemma4-12b-with-proj-ltx-2.5-bf16.safetensors"
          provider: "huggingface"
          ref: '{"repo": "Lightricks/LTX-2.5", "file": "text_encoders/gemma4-12b-with-proj-ltx-2.5-bf16.safetensors", "revision": "main"}'
          size: "24.46 GB"
          description: "Gemma4-12B with projection, bf16 reference - 2.5 needs the with-proj build. Gated repo: accept the LTX-2 license on Hugging Face and set a token in Admin - Plugins."

  - type: "section"
    label: "VAEs"
    children:
      # Only the conv-decode video VAE is supported -- the non-conv variant
      # needs a diffusion decoder this engine doesn't implement
      # (docs/models/ltx.md "Not yet supported").
      - name: "video_vae"
        type: "model"
        label: "Video VAE"
        required: true
        configuration:
          model_type: "vae"
          placeholder: "ltx-2.5-video-vae-bf16 (diffusion decode) or -conv- (conv decode)..."
          filter_tags: "@config:vae_tags"
          recommendations:
            - name: "ltx-2.5-video-vae-conv-bf16.safetensors"
              provider: "huggingface"
              ref: '{"repo": "Lightricks/LTX-2.5", "file": "vae/ltx-2.5-video-vae-conv-bf16.safetensors", "revision": "main"}'
              size: "1.35 GB"
              description: "LTX-2.5 video VAE, conv decode - the cheaper decode path. Gated repo: accept the LTX-2 license on Hugging Face and set a token in Admin - Plugins."
            - name: "ltx-2.5-video-vae-bf16.safetensors"
              provider: "huggingface"
              ref: '{"repo": "Lightricks/LTX-2.5", "file": "vae/ltx-2.5-video-vae-bf16.safetensors", "revision": "main"}'
              size: "1.37 GB"
              description: "LTX-2.5 video VAE, diffusion decode - sharper, heavier. Gated repo: accept the LTX-2 license on Hugging Face and set a token in Admin - Plugins."

      - name: "audio_vae"
        type: "model"
        label: "Audio VAE (required for Generate Audio)"
        ai_hint: "Only needed when Generate Audio (Generation tab) is on, or when the Director timeline carries its own audio clips. Leave empty for a silent render -- the audio VAE and vocoder are then never loaded, costing nothing."
        configuration:
          model_type: "vae"
          placeholder: "ltx-2.5-audio-vae-bf16..."
          filter_tags: "@config:vae_tags"
          recommendations:
            - name: "ltx-2.5-audio-vae-bf16.safetensors"
              provider: "huggingface"
              ref: '{"repo": "Lightricks/LTX-2.5", "file": "vae/ltx-2.5-audio-vae-bf16.safetensors", "revision": "main"}'
              size: "348.0 MB"
              description: "LTX-2.5 audio VAE + vocoder - required only when generating audio. Gated repo: accept the LTX-2 license on Hugging Face and set a token in Admin - Plugins."
