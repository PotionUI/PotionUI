# The LoRA tab is the `video` mode's own file, read directly: the DiT and its
# LoRA stack are the same machinery on the same checkpoint family, and a copy
# here would drift (same idiom as modes/refs/form.yml). The Advanced tab is
# NOT reused the same way -- see that file's own header comment for why.
name: "custom"
fields:
  - type: "tabs"
    children:
      - type: "tab"
        label: "Generation"
        configuration: {icon: "generation", icon_display: "icon_only"}
        children: "{{ paths.preset }}/modes/upscale/tabs/generation.yml"
      - type: "tab"
        label: "LoRA"
        configuration: {icon: "lora", icon_display: "icon_only"}
        children: "{{ paths.preset }}/modes/video/tabs/lora.yml"
      - type: "tab"
        label: "Advanced"
        audience: "advanced"
        configuration: {icon: "settings", icon_display: "icon_only"}
        children: "{{ paths.preset }}/modes/upscale/tabs/advanced.yml"
