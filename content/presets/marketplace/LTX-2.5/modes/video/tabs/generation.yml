# Video Director mode -- the director editor (form_data.video_director, a
# separate document submitted outside this dynamic form) owns prompts, frames,
# fps, and keyframe/reference/audio media. This tab keeps only what the
# document does NOT carry: model-run parameters for the one generation this
# preset always makes (t2v/i2v/flf/director all route through the same
# generator/video_ltx call). The file pickers live on the Models tab -- LTX-2.5
# needs four of them, enough to crowd this tab out on its own. Steps/Sampler/
# CFG live on the Advanced tab's Sampling section (Krea-2 layout) -- the Speed
# profile below still bakes their actual values via reactions.
fields:
  - name: "speed_profile"
    type: "select"
    label: "Speed"
    default: "balanced"
    configuration:
      options:
        - { label: "Balanced (24 steps)", value: "balanced" }
        - { label: "Distilled (fast, 8 steps)", value: "distilled" }
        - { label: "Quality (slow, 30 steps)", value: "quality" }
        - { label: "Custom (set steps/CFG freely)", value: "custom" }

  - type: "section"
    label: "Video"
    children:
      - name: "seed"
        type: "seed"
        label: "Seed"
        default: -1

      - name: "resolution"
        type: "resolution"
        label: "Resolution"
        configuration:
          files:
            - { path: "{{ paths._shared }}/resolutions/video.yml", group: "Video" }
            - { path: "{{ paths._shared }}/resolutions/social_media_video.yml", group: "Social Media" }
        default: "768x512"

      # Every profile bakes euler_ancestral, the first-party LTX-2.5 stage-1
      # sampler (see preset.yml's speed_profiles comment for exactly how far the
      # diffusers evidence goes), unlike 2.0/2.3 where the base pass is
      # deterministic -- so Sampler's own default/reactions (Advanced tab) all
      # pin euler_ancestral, not euler.

      - name: "generate_audio"
        type: "checkbox"
        label: "Generate Audio"
        ai_hint: "Needs the Audio VAE picker (Models tab) filled -- LTX-2.5 ships the audio VAE and vocoder as a separate file, so a request with this on and that picker empty is rejected before generation starts."
        default: false
