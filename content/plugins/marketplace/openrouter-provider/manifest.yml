id: "openrouter-provider"
name: "OpenRouter"
version: "0.1.0"
description: "Generate images and video with hosted models through OpenRouter. Adds an OpenRouter cloud backend, its model catalog and ready-made image (text to image, edit) and video (text to video, image to video) presets."
author: "PotionUI Team"
type: "backend-only"
category: "backends"

capabilities:
  - "backend-provider"
  - "cloud-models"

hooks:
  backend:
    - hook: "backend.register"
      handler: "backend.hooks.backend_hooks.register_backend"

presets:
  - path: "presets"

docs:
  - path: "README.md"
    title: "OpenRouter"
    audience: "admin"

setup:
  - kind: "backend.added"
    driver: "cloud.openrouter"
    label: "Add an OpenRouter backend with your API key"
  - kind: "cloud.models_enabled"
    driver: "cloud.openrouter"
  - kind: "presets.installed"
  - kind: "presets.assigned"
