name: "custom"
mode_label: "Structure"
short_description: "Keep the pose, outlines or depth of a guide picture and paint a new image on it."
prompt_label: "Describe the new picture"
prompt_placeholder: "a knight in silver armor, forest at dawn"
fields:
  - type: "tabs"
    children:
      - type: "tab"
        label: "Structure"
        configuration:
          icon: "generation"
          icon_display: "icon_only"
        children: "{{ paths.preset }}/modes/control/tabs/generation.yml"

      - type: "tab"
        label: "LoRA"
        configuration:
          icon: "lora"
          icon_display: "icon_only"
        children: "{{ paths.preset }}/modes/txt2img/tabs/lora.yml"

      - type: "tab"
        label: "Embeddings"
        configuration:
          icon: "embedding"
          icon_display: "icon_only"
        children: "{{ paths.preset }}/modes/txt2img/tabs/embeddings.yml"

      - type: "tab"
        label: "Advanced"
        audience: "advanced"
        configuration:
          icon: "settings"
          icon_display: "icon_only"
        children: "{{ paths.preset }}/modes/txt2img/tabs/advanced.yml"
