########
## Setup recipe: MiniMax-Music3 on the native engine
##
## See src/features/recipes/schema.py for the schema this file is
## validated against (scripts/recipe_lint.py) and
## src/features/recipes/executors/ for what each step kind actually does.
########
schema_version: 1
id: "minimax-music3-starter"
version: 1
name: "MiniMax-Music3 Starter"
engine: "native"
category: "audio"
summary: "Get a working MiniMax-Music3 setup on your local GPU and produce a first song."
description: >
  Installs the bundled MiniMax-Music3 preset on the native (in-process)
  engine, makes sure its three model files are available, and proves the
  pipeline is wired up correctly before handing you a ready-to-use preset
  (see docs/models/minimax_music3.md). MiniMax-Music3 is a text-to-music
  family: an autoregressive stage samples a semantic + residual code from a
  style description and lyrics, then a flow-matching DiT and DAV vocoder
  turn that into a 44.1 kHz song. The three files together are a real
  download (~20.3 GB, mostly the pruned AR text encoder).

  LICENCE: the Comfy-Org repository this recipe downloads from tags its
  card Apache-2.0, but PotionUI's own docs (docs/models/minimax_music3.md)
  read the family as covered by the MiniMax Music3 Community License - no
  territorial exclusion, but attribution and hosted-safeguards obligations
  above a revenue threshold. The official model card
  (https://huggingface.co/MiniMaxAI/MiniMax-Music3) carries no licence tag
  at all, so treat the community-license reading as the safer assumption
  until MiniMax clarifies it.

plugins:
  - id: "huggingface-provider"
    reason: >
      Resolves the diffusion model, text encoder and VAE from HuggingFace
      (Comfy-Org's single-file repackage of MiniMax-Music-3) by exact repo
      path. HuggingFace has no hash-lookup API, so each artifact below
      names its file explicitly; the sha256 in each artifact's checksum
      still verifies the download afterwards.

backend:
  engine: "native"

artifacts:
  - id: "minimax-music3-diffusion-model"
    kind: "diffusion_model"
    model_type: "diffusion_model"
    filename: "minimax_music3_dit_fp16.safetensors"
    display_name: "MiniMax-Music3 DiT (flow-matching, fp16)"
    required: true
    size_bytes: 4914197682
    checksum:
      algorithm: "sha256"
      value: "45494a2b6b69af115902ff28eaf54118d19067aa54da01000f3e3efce7ba0e34"
    # Declared by capability, never by a concrete plugin id - core resolves a
    # download source through whichever enabled plugin advertises this
    # capability (see plugin manifest `capabilities:`).
    capability: "model-lookup"
    provider_hint:
      source: "huggingface"
      model_id: "Comfy-Org/MiniMax-Music-3"
      version_id: "main@diffusion_models/minimax_music3_dit_fp16.safetensors"

  - id: "minimax-music3-text-encoder"
    kind: "text_encoder"
    model_type: "text_encoder"
    filename: "minimax_music3_text_encoder_pruned_bf16.safetensors"
    display_name: "MiniMax-Music3 text encoder (pruned AR + depth decoder, bf16)"
    required: true
    size_bytes: 16706629398
    checksum:
      algorithm: "sha256"
      value: "e81e469c92af324dc69b77e5a11179e22542a6d628f2b205c8cf6143e510d976"
    capability: "model-lookup"
    provider_hint:
      source: "huggingface"
      model_id: "Comfy-Org/MiniMax-Music-3"
      version_id: "main@text_encoders/minimax_music3_text_encoder_pruned_bf16.safetensors"

  - id: "minimax-music3-vae"
    kind: "vae"
    model_type: "vae"
    filename: "minimax_music3_dav.safetensors"
    display_name: "MiniMax-Music3 DAV vocoder"
    required: true
    size_bytes: 216696128
    checksum:
      algorithm: "sha256"
      value: "2a32155b769be01445fcc2a8663b910fc9e1751e18dc1c3ec528064512d9ef0c"
    capability: "model-lookup"
    provider_hint:
      source: "huggingface"
      model_id: "Comfy-Org/MiniMax-Music-3"
      version_id: "main@vae/minimax_music3_dav.safetensors"

presets:
  - preset_id: "01KX47MINIMAXMUSIC300000MU"
    path_hint: "marketplace/MiniMax-Music3"
    assign_to_owner: true

# No `smoke:` block / `generation.smoke` step here on purpose - see the
# comment above the "Validate the pipeline" step below for why.

steps:
  - key: "plugins.ensure"
    kind: "plugins.ensure"
    title: "Enable required plugins"
    params:
      # huggingface-provider is needed so the download step can resolve each
      # artifact's exact repo file.
      plugin_ids: ["huggingface-provider"]

  - key: "backend.ensure"
    kind: "backend.ensure"
    title: "Prepare the native backend"
    params:
      engine: "native"

  # Index BEFORE planning downloads: on a fresh instance nothing is indexed
  # yet, so without this pass artifacts.plan cannot see files the user
  # already has and would ask to download them.
  - key: "models.index"
    kind: "models.index"
    title: "Find models you already have"
    params:
      engine: "native"

  - key: "artifacts.plan"
    kind: "artifacts.plan"
    title: "Plan required downloads"
    params:
      artifact_ids: ["minimax-music3-diffusion-model", "minimax-music3-text-encoder", "minimax-music3-vae"]

  - key: "artifacts.fetch"
    kind: "artifacts.fetch"
    title: "Download the MiniMax-Music3 model files"
    params:
      artifact_ids: ["minimax-music3-diffusion-model", "minimax-music3-text-encoder", "minimax-music3-vae"]

  - key: "models.index.downloads"
    kind: "models.index"
    title: "Register downloaded models"
    params:
      engine: "native"

  - key: "preset.ensure"
    kind: "preset.ensure"
    title: "Install and assign the MiniMax-Music3 preset"
    params:
      preset_id: "01KX47MINIMAXMUSIC300000MU"

  # A `generation.smoke` step would run a real song generation, but
  # GenerationSmokeExecutor's output collector (executors/generation_smoke.py
  # `_collect`) only counts ImageGenerationOutput/GalleryGenerationOutput -
  # song mode only ever emits AudioGenerationOutput, so `output_count` would
  # stay 0 and the step would report failure even after a fully successful
  # generation. The preset's own tests.yml documents the identical harness
  # gap and sets `checks.min_outputs: 0` for exactly this reason - a knob
  # `generation.smoke` has no equivalent for. Until the executor learns to
  # count audio output, `pipeline.render` (a dry run, no GPU) is the
  # strongest validation this recipe can safely run.
  - key: "pipeline.render"
    kind: "pipeline.render"
    title: "Validate the pipeline"
    params:
      preset_id: "01KX47MINIMAXMUSIC300000MU"
      mode: "song"

  - key: "workspace.activate"
    kind: "workspace.activate"
    title: "Finish onboarding"
    # Only meaningful during the first-run wizard - a run started from
    # Admin -> Recipes skips it.
    onboarding_only: true
    params: {}
