fields:
  - name: "start_image"
    type: "image"
    label: "Start picture"
    required: true
    description: "The first frame of the video. It is cropped to fill the chosen resolution."
    ai_hint: "The picture the video opens on; its look, subject and framing are carried into the motion. It is cropped to fill the chosen resolution, so pick a resolution with the picture's aspect ratio. The prompt then says what happens, not what the picture already shows."
