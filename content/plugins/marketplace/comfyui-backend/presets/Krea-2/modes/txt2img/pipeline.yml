pipeline:
  #############
  ## Rendered prompts (provenance)
  ## Surfaces the per-image expanded prompts ({a|b}, ${variables}, autocomplete
  ## already resolved on the backend - see src/features/prompt/expander.py) as
  ## pipe artifacts, the prompt counterpart of seed_generator. A single-workflow
  ## engine runs the whole batch off pairs[0]; the pipe broadcasts it across
  ## `quantity` so every image reports the prompt it actually ran with.
  ############
  - name: "dynamic_prompts_renderer"
    id: "dynamic_prompts_renderer"
    enabled: true
    configuration:
      pairs: "{{ generation.prompts.pairs }}"
      quantity: "{{ form.quantity }}"

  #############
  ## Seed Generator
  #############
  - name: "seed_generator"
    id: "seed_generator"
    enabled: true
    configuration:
      seed: "{{ form.seed }}"
      quantity: "{{ form.quantity }}"

  #############
  ## IOType to Value Converter (seed -> plain value for param_emitter)
  #############
  - name: "from_iotype"
    id: "from_iotype"
    enabled: true
    input:
      - ["seed", "seed_generator", "seed"]
    configuration:
      from: "seed"

  #############
  ## Parameter Emitter (UI tracking: models, seed, prompts, settings)
  #############
  - name: "param_emitter"
    id: "param_emitter"
    enabled: true
    input:
      - ["seed", "from_iotype", "seed"]
    configuration:
      quantity: "{{ form.quantity }}"
      parameters:
        # Models
        - ["model", "{{ form.diffusion_model | default('') }}"]
        - ["model", "{{ form.clip | default('') }}"]
        - ["model", "{{ form.vae | default('') }}"]

        # LoRAs (the picker value only contains selected entries)
        - "@loop":
            items: "{{ form.loras | active_loras }}"
            template: ["model", "{{ item.model }}"]

        # Prompts
        - ["positive_prompt", "{{ generation.prompts.first.positive }}"]
        - ["negative_prompt", "{{ generation.prompts.first.negative }}"]

        # Generation parameters
        - ["cfg", "{{ form.cfg }}"]
        - ["steps", "{{ form.steps }}"]
        - ["sampler", "{{ form.sampler_name }}"]
        - ["scheduler", "{{ form.scheduler }}"]
        - ["resolution", "{{ form.resolution }}"]
        - ["denoise", "{{ form.denoise | default(1.0) }}"]

  #############
  ## ComfyUI Workflow Executor
  #############
  - name: "comfyui"
    enabled: true
    input:
      - ["seed", "seed_generator", "seed"]
    configuration:
      workflow_file: "{{ paths.preset }}/modes/txt2img/files/workflows/txt2img.json"
      timeout: 300
      secure: false
      node_manipulations:
        #############
        # LoRA chain built from the `loras` picker value ([{model, strength}, ...] -
        # only selected entries, may be empty):
        # UNETLoader (37) -> LoRA 1 -> LoRA 2 -> ... -> KSampler (3)
        #############

        # Add one LoraLoaderModelOnly node per selected LoRA, chaining each entry
        # to the previous one (the first connects to the UNET loader 37)
        - "@loop":
            items: "{{ form.loras }}"
            template:
              type: "add_node"
              node_id: "lora_{{ loop.index }}"
              node_config:
                inputs:
                  lora_name: "{{ item.model | strip_model_dir }}"
                  strength_model: "{{ item.strength }}"
                  model: ["{% if loop.first %}{{ preset.vars.lora_chain_base_node }}{% else %}lora_{{ loop.index0 }}{% endif %}", 0]
                class_type: "LoraLoaderModelOnly"
                _meta:
                  title: "LoRA {{ loop.index }}"

        # Connect KSampler (3) to the end of the chain: the last generated LoRA node,
        # or the UNET loader (preset.vars.lora_chain_base_node, the workflow default)
        # when no LoRAs are selected
        - type: "update_node_input"
          node_id: "3"
          input_key: "model"
          input_value: ["{% set loras = form.loras %}{% if loras %}lora_{{ loras | length }}{% else %}{{ preset.vars.lora_chain_base_node }}{% endif %}", 0]

      field_mappings:
        # Positive prompt -> CLIPTextEncode (node 6). Negative is zeroed out
        # (node 7 = ConditioningZeroOut) since Krea 2 Turbo runs at cfg 1.
        - ["{{ generation.prompts.first.positive }}", "6.inputs.text", "str"]

        # Models
        - ["{{ form.diffusion_model | strip_model_dir }}", "37.inputs.unet_name", "str"]
        - ["{{ form.clip | strip_model_dir }}", "38.inputs.clip_name", "str"]
        - ["{{ form.vae | strip_model_dir }}", "39.inputs.vae_name", "str"]

        # Resolution (parsed from "WxH")
        - ["{{ (form.resolution).split('x')[0] }}", "58.inputs.width", "int"]
        - ["{{ (form.resolution).split('x')[1] }}", "58.inputs.height", "int"]
        - ["{{ form.quantity }}", "58.inputs.batch_size", "int"]

        # KSampler (node 3)
        - ["@seed", "3.inputs.seed", "int"]
        - ["{{ form.steps }}", "3.inputs.steps", "int"]
        - ["{{ form.cfg }}", "3.inputs.cfg", "float"]
        - ["{{ form.sampler_name }}", "3.inputs.sampler_name", "str"]
        - ["{{ form.scheduler }}", "3.inputs.scheduler", "str"]
        - ["{{ form.denoise | default(1.0) }}", "3.inputs.denoise", "float"]

  #############
  ## Gallery - Collect outputs
  #############
  - name: "gallery"
    enabled: true
    input:
      - ["image", "comfyui", "image"]
