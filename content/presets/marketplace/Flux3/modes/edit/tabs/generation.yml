fields:
  - name: "speed_profile"
    type: "select"
    formula: "speed"
    label: "Speed profile"
    default: "base"
    configuration:
      options:
        - { label: "Turbo", value: "turbo", sub_label: "16 steps, no CFG, distilled checkpoint" }
        - { label: "Base", value: "base", sub_label: "50 steps, CFG 3.5, Base checkpoint" }
        - { label: "Custom", value: "custom", sub_label: "set steps/CFG freely" }

  - type: "section"
    label: "Image"
    children:
      - type: "row"
        children: "{{ paths._shared }}/native/seed_quantity.yml"

      - name: "output_size"
        type: "select"
        formula: "size"
        label: "Output size"
        default: "match"
        configuration:
          options:
            - { label: "Match first reference", value: "match" }
            - { label: "1024x1024", value: "1024x1024" }
            - { label: "1152x896", value: "1152x896" }
            - { label: "896x1152", value: "896x1152" }
            - { label: "1344x768", value: "1344x768" }
            - { label: "768x1344", value: "768x1344" }
            - { label: "1536x1536", value: "1536x1536" }

  - type: "section"
    label: "Models"
    formula: "models"
    children:
      - name: "diffusion_model"
        type: "model"
        label: "Diffusion Model"
        required: true
        configuration:
          model_type: "diffusion_model"
          families: ["flux3"]
          placeholder: "Select a FLUX 3 Image Klein checkpoint (distilled or base)..."
          filter_tags: "@config:checkpoint_tags"
          recommendations:
            - name: "flux3-image-klein-bf16.safetensors"
              provider: "huggingface"
              ref: '{"repo": "black-forest-labs/flux-3-image-klein-comfy", "file": "diffusion_models/flux3-image-klein-bf16.safetensors", "revision": "main"}'
              size: "10.34 GB"
              size_bytes: 11097404512
              precision: "bf16"
              sha256: "c3e9813cdd049c831c836b2e9db61150e49a93fc1a4c63b256494642fee0bd7c"
              gated: true
              license_url: "https://huggingface.co/black-forest-labs/flux-3-image-klein"
              description: "FLUX 3 Image Klein distilled, bf16 - the Turbo profile's checkpoint, 16 steps without CFG. Gated repo: accept the FLUX Kommunity License on Hugging Face and set a token in Admin - Plugins."
            - name: "flux3-image-klein-base-bf16.safetensors"
              provider: "huggingface"
              ref: '{"repo": "black-forest-labs/flux-3-image-klein-comfy", "file": "diffusion_models/flux3-image-klein-base-bf16.safetensors", "revision": "main"}'
              size: "10.32 GB"
              size_bytes: 11076957072
              precision: "bf16"
              sha256: "5c921759dc03663dbb67df11d8e3d317d2d5b893b31b969c95dc77ebf861b19c"
              gated: true
              license_url: "https://huggingface.co/black-forest-labs/flux-3-image-klein"
              description: "FLUX 3 Image Klein Base, bf16 - the Base profile's checkpoint, 50 steps with true CFG. Gated repo: accept the FLUX Kommunity License on Hugging Face and set a token in Admin - Plugins."
            - name: "flux3-image-klein-int8-convrot.safetensors"
              provider: "huggingface"
              ref: '{"repo": "black-forest-labs/flux-3-image-klein-comfy", "file": "diffusion_models/flux3-image-klein-int8-convrot.safetensors", "revision": "main"}'
              size: "5.43 GB"
              size_bytes: 5827874779
              precision: "int8"
              sha256: "847d8933548afd93df4af2cac2498e70891bf28d9dae06d695f536992e168fe2"
              gated: true
              license_url: "https://huggingface.co/black-forest-labs/flux-3-image-klein"
