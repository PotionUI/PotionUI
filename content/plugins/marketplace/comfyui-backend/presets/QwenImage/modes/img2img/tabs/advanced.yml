fields:
  - type: "section"
    label: "Sampling"
    children:
      - name: "steps"
        type: "slider"
        label: "Steps"
        configuration:
          min: 1
          max: 50
          step: 1
        default: 4

      - name: "sampler_name"
        type: "select"
        label: "Sampler"
        configuration:
          file: { path: "{{ paths._shared }}/comfyui/form/samplers/all.yml" }
        default: "euler"

      - name: "scheduler"
        type: "select"
        label: "Scheduler"
        configuration:
          file: { path: "{{ paths._shared }}/comfyui/form/schedulers/all.yml" }
        default: "simple"

      - name: "cfg"
        type: "slider"
        label: "CFG Scale"
        configuration:
          min: 1.0
          max: 10.0
          step: 0.1
        default: 1.0

      - name: "denoise"
        type: "slider"
        label: "Denoise"
        configuration:
          min: 0.0
          max: 1.0
          step: 0.05
        default: 1.0

      - name: "shift"
        type: "slider"
        label: "Model Shift"
        description: "ModelSamplingAuraFlow shift parameter"
        configuration:
          min: 1.0
          max: 10.0
          step: 0.1
        default: 3.1

      - name: "cfg_norm_strength"
        type: "slider"
        label: "CFG Norm Strength"
        description: "CFGNorm strength for improved image quality"
        configuration:
          min: 0.0
          max: 2.0
          step: 0.1
        default: 1.0
