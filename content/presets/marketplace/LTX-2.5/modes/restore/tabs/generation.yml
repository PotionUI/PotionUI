fields:
  - name: "speed_profile"
    type: "select"
    formula: "speed"
    label: "Speed profile"
    default: "distilled"
    configuration:
      options:
        - { label: "Distilled", value: "distilled", sub_label: "8 steps · CFG off · distilled sigma recipe" }
        - { label: "Balanced", value: "balanced", sub_label: "24 steps · CFG 4 · needs the dev checkpoint" }
        - { label: "Quality", value: "quality", sub_label: "30 steps · CFG 3 · multimodal guidance · needs the dev checkpoint" }
        - { label: "Custom", value: "custom", sub_label: "your own steps · sampler · CFG, left alone" }

  - type: "section"
    label: "Video"
    children:
      - type: "row"
        children: "{{ paths.preset }}/files/form/seed_quantity.yml"

      - name: "output_size"
        type: "select"
        formula: "size"
        label: "Size"
        default: "1080p"
        description: "Pick 720p if you run out of memory."
        configuration:
          options:
            - { label: "720p", value: "720p" }
            - { label: "1080p", value: "1080p" }

  - type: "section"
    label: "Models"
    formula: "models"
    children:
      - name: "model"
        type: "model"
        formula: "models"
        label: "LTX-2.5 DiT (transformer-only)"
        required: true
        configuration:
          model_type: "diffusion_model"
          placeholder: "ltx-2.5-22b-dev-transformer-bf16 / -distilled-..."
          filter_tags: "@config:checkpoint_tags"
          recommendations:
            - name: "ltx-2.5-22b-distilled-transformer-comfy-int8-convrot.safetensors"
              provider: "huggingface"
              ref: '{"repo": "Lightricks/LTX-2.5", "file": "diffusion_models/ltx-2.5-22b-distilled-transformer-comfy-int8-convrot.safetensors", "revision": "main"}'
              size: "20.03 GB"
              description: "LTX-2.5 22B distilled DiT, int8 ConvRot - half of bf16. Gated repo: accept the LTX-2 license on Hugging Face and set a token in Admin - Plugins."
            - name: "ltx-2.5-22b-distilled-transformer-nvfp4.safetensors"
              provider: "huggingface"
              ref: '{"repo": "Lightricks/LTX-2.5", "file": "diffusion_models/ltx-2.5-22b-distilled-transformer-nvfp4.safetensors", "revision": "main"}'
              size: "17.44 GB"
              description: "LTX-2.5 22B distilled DiT, nvfp4 - smallest tier, fast path needs Blackwell. Gated repo: accept the LTX-2 license on Hugging Face and set a token in Admin - Plugins."
            - name: "ltx-2.5-22b-distilled-transformer-bf16.safetensors"
              provider: "huggingface"
              ref: '{"repo": "Lightricks/LTX-2.5", "file": "diffusion_models/ltx-2.5-22b-distilled-transformer-bf16.safetensors", "revision": "main"}'
              size: "39.13 GB"
              description: "LTX-2.5 22B distilled DiT, bf16 reference. Gated repo: accept the LTX-2 license on Hugging Face and set a token in Admin - Plugins."
            - name: "ltx-2.5-22b-dev-transformer-bf16.safetensors"
              provider: "huggingface"
              ref: '{"repo": "Lightricks/LTX-2.5", "file": "diffusion_models/ltx-2.5-22b-dev-transformer-bf16.safetensors", "revision": "main"}'
              size: "39.13 GB"
              description: "LTX-2.5 22B dev DiT, bf16 - non-distilled, more steps. Gated repo: accept the LTX-2 license on Hugging Face and set a token in Admin - Plugins."

      - name: "text_encoder"
        type: "model"
        formula: "models"
        label: "Text Encoder (Gemma4-12B with projection)"
        required: true
        configuration:
          model_type: "text_encoder"
          placeholder: "gemma4-12b-with-proj-ltx-2.5-bf16..."
          filter_tags: "@config:text_encoder_tags"
          recommendations:
            - name: "gemma4-12b-with-proj-ltx-2.5-comfy-int8-convrot.safetensors"
              provider: "huggingface"
              ref: '{"repo": "Lightricks/LTX-2.5", "file": "text_encoders/gemma4-12b-with-proj-ltx-2.5-comfy-int8-convrot.safetensors", "revision": "main"}'
              size: "14.32 GB"
              description: "Gemma4-12B with text-embedding projection, int8 ConvRot. Gated repo: accept the LTX-2 license on Hugging Face and set a token in Admin - Plugins."
            - name: "gemma4-12b-with-proj-ltx-2.5-bf16.safetensors"
              provider: "huggingface"
              ref: '{"repo": "Lightricks/LTX-2.5", "file": "text_encoders/gemma4-12b-with-proj-ltx-2.5-bf16.safetensors", "revision": "main"}'
              size: "24.46 GB"
              description: "Gemma4-12B with projection, bf16 reference - 2.5 needs the with-proj build. Gated repo: accept the LTX-2 license on Hugging Face and set a token in Admin - Plugins."

      - name: "video_vae"
        type: "model"
        formula: "models"
        label: "Video VAE"
        required: true
        configuration:
          model_type: "vae"
          placeholder: "ltx-2.5-video-vae-bf16 (diffusion decode) or -conv- (conv decode)..."
          filter_tags: "@config:vae_tags"
          recommendations:
            - name: "ltx-2.5-video-vae-conv-bf16.safetensors"
              provider: "huggingface"
              ref: '{"repo": "Lightricks/LTX-2.5", "file": "vae/ltx-2.5-video-vae-conv-bf16.safetensors", "revision": "main"}'
              size: "1.35 GB"
              description: "LTX-2.5 video VAE, conv decode - the cheaper decode path. Gated repo: accept the LTX-2 license on Hugging Face and set a token in Admin - Plugins."
            - name: "ltx-2.5-video-vae-bf16.safetensors"
              provider: "huggingface"
              ref: '{"repo": "Lightricks/LTX-2.5", "file": "vae/ltx-2.5-video-vae-bf16.safetensors", "revision": "main"}'
              size: "1.37 GB"
              description: "LTX-2.5 video VAE, diffusion decode - sharper, heavier. Gated repo: accept the LTX-2 license on Hugging Face and set a token in Admin - Plugins."

      - name: "restore_lora"
        type: "model"
        formula: "models"
        label: "Restore LoRA"
        required: true
        description: "Used by Restore old footage."
        configuration:
          model_type: "lora"
          placeholder: "ltx-2.5-22b-ic-lora-restore-1.0.safetensors"
          recommendations:
            - name: "ltx-2.5-22b-ic-lora-restore-1.0.safetensors"
              provider: "huggingface"
              ref: '{"repo": "Lightricks/LTX-2.5-22b-IC-LoRA-Restore", "file": "ltx-2.5-22b-ic-lora-restore-1.0.safetensors", "revision": "main"}'
              size: "1.71 GB"
              description: "LTX-2.5 Restore IC-LoRA. Gated repo: accept the license on Hugging Face and set a token in Admin - Plugins."
        reactions:
          - when: { field: "restore_task", not_equals: "restore" }
            then: { set_required: false }
          - when: { field: "restore_task", equals: "restore" }
            then: { set_required: true }

      - name: "deblur_lora"
        type: "model"
        formula: "models"
        label: "Remove blur LoRA"
        required: true
        description: "Used by Remove blur."
        configuration:
          model_type: "lora"
          placeholder: "ltx-2.5-22b-ic-lora-deblur-0.9.safetensors"
          recommendations:
            - name: "ltx-2.5-22b-ic-lora-deblur-0.9.safetensors"
              provider: "huggingface"
              ref: '{"repo": "Lightricks/LTX-2.5-22b-IC-LoRA-Deblur", "file": "ltx-2.5-22b-ic-lora-deblur-0.9.safetensors", "revision": "main"}'
              size: "906.1 MB"
              description: "LTX-2.5 Deblur IC-LoRA. Gated repo: accept the license on Hugging Face and set a token in Admin - Plugins."
        reactions:
          - when: { field: "restore_task", not_equals: "deblur" }
            then: { set_required: false }
          - when: { field: "restore_task", equals: "deblur" }
            then: { set_required: true }

      - name: "decompress_lora"
        type: "model"
        formula: "models"
        label: "Remove compression LoRA"
        required: true
        description: "Used by Remove compression."
        configuration:
          model_type: "lora"
          placeholder: "ltx-2.5-22b-ic-lora-decompression-0.9.safetensors"
          recommendations:
            - name: "ltx-2.5-22b-ic-lora-decompression-0.9.safetensors"
              provider: "huggingface"
              ref: '{"repo": "Lightricks/LTX-2.5-22b-IC-LoRA-Decompression", "file": "ltx-2.5-22b-ic-lora-decompression-0.9.safetensors", "revision": "main"}'
              size: "906.1 MB"
              description: "LTX-2.5 Decompression IC-LoRA. Gated repo: accept the license on Hugging Face and set a token in Admin - Plugins."
        reactions:
          - when: { field: "restore_task", not_equals: "decompress" }
            then: { set_required: false }
          - when: { field: "restore_task", equals: "decompress" }
            then: { set_required: true }
