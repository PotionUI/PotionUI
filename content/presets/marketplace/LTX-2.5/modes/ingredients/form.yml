prompt_placeholder: "The knight walks into the tavern, sits beside the fox and lifts the lantern. Medium shot, slow push in."
name: "custom"
mode_label: "Ingredients"
short_description: "Keep characters and props from your pictures consistent in a new video."
negative_prompt:
  applies_when:
    logic: "OR"
    conditions:
      - { field: "cfg", greater_than: 1 }
requirements:
  - type: "model"
    field: "effect_lora"
    hint: "Download the Ingredients LoRA in this mode."
fields:
  - type: "tabs"
    children:
      - type: "tab"
        anchor: "generation"
        label: "Generation"
        configuration:
          icon: "generation"
          icon_display: "icon_only"
        children: "{{ paths.preset }}/modes/ingredients/tabs/generation.yml"
      - type: "tab"
        anchor: "references"
        label: "References"
        configuration:
          icon: "image"
          icon_display: "icon_only"
        children: "{{ paths.preset }}/modes/ingredients/tabs/references.yml"
      - type: "tab"
        anchor: "lora"
        label: "LoRA"
        configuration:
          icon: "lora"
          icon_display: "icon_only"
        children: "{{ paths.preset }}/modes/video/tabs/lora.yml"
      - type: "tab"
        anchor: "advanced"
        label: "Advanced"
        audience: "advanced"
        configuration:
          icon: "settings"
          icon_display: "icon_only"
        children: "{{ paths.preset }}/modes/ingredients/tabs/advanced.yml"
