fields:
  - type: "row"
    children:
      - name: "steps"
        type: "slider"
        label: "Steps"
        configuration:
          min: 1
          max: 50
          step: 1
        default: 4

      - name: "cfg"
        type: "slider"
        label: "CFG Scale"
        configuration:
          min: 1.0
          max: 20.0
          step: 0.1
        default: 1

  - type: "row"
    children:
      - name: "sampler_name"
        type: "select"
        label: "Sampler"
        configuration:
          file: { path: "{{ paths._shared }}/comfyui/form/samplers/all.yml" }
        default: "euler"

      - name: "scheduler"
        type: "select"
        label: "Scheduler"
        configuration:
          file: { path: "{{ paths._shared }}/comfyui/form/schedulers/all.yml" }
        default: "simple"

  - name: "denoise"
    type: "slider"
    label: "Denoise"
    configuration:
      min: 0.0
      max: 1.0
      step: 0.05
    default: 1.0

  - type: "group"
    label: "Model Sampling"
    children:
      - name: "shift"
        type: "slider"
        label: "AuraFlow Shift"
        configuration:
          min: 0.0
          max: 10.0
          step: 0.01
        default: 1.23

  - type: "group"
    label: "VRAM Optimization"
    children:
      - name: "cpu_offload"
        type: "select"
        label: "CPU Offload"
        configuration:
          options:
            - label: "Auto"
              value: "auto"
            - label: "Enable"
              value: "enable"
            - label: "Disable"
              value: "disable"
        default: "auto"

      - name: "num_blocks_on_gpu"
        type: "slider"
        label: "Blocks on GPU"
        configuration:
          min: 1
          max: 100
          step: 1
        default: 60
