# Lyrics are the standard prompt section (see PromptSection.svelte) -- caption,
# duration, the instrumental toggle and seed are the only settings this
# preset's form owns. Krea-2 layout: Style description plays the role of
# Krea-2's top-level Speed profile field (both are the first thing the form
# asks for), a "Song" section holds this mode's own core generation knobs
# (no Krea-2 counterpart for duration/instrumental, but seed lives here the
# same way it lives in Krea-2's Image section), and "Models" closes it out.
fields:
  - name: "description"
    type: "string"
    label: "Style description"
    required: true
    configuration:
      input_type: "textarea"
      rows: 4
      placeholder: "style & tempo · vocals · arrangement"
    ai_hint: "The generator's only conditioning signal besides lyrics -- an empty caption fails generation outright. Aim for roughly 250-450 words covering genre/tempo/mood, vocal character (omit entirely for an instrumental track), and arrangement -- see this preset's llm.guide for the full recipe."

  - type: "section"
    label: "Song"
    children:
      - type: "row"
        children:
          - name: "duration"
            type: "integer"
            label: "Max duration (seconds, 0 = auto)"
            default: 60
            configuration: {min: 0, max: 360}
            ai_hint: "A hard CAP, not a target -- the model has no length input and ends a song with its own stop token when the lyrics run out; a cap below the natural ending cuts the song mid-phrase. 0 = auto: generate until the song ends (up to the 360s model max). Song length is really steered by how many sections the lyrics (the Prompt box) carry."
            width: "1/2"

          - name: "instrumental"
            type: "boolean"
            label: "Instrumental (no vocals)"
            default: false
            ai_hint: "Composes the literal '[instrumental]' lyrics regardless of what the Prompt box contains."
            width: "1/2"

      - name: "seed"
        type: "seed"
        label: "Seed"
        default: -1
        ai_hint: "Drives both the AR stage's token sampling and every flow-matching window -- one seed reproduces the whole song, same device only (sampled tokens are not reproducible across dtype/device)."

  - type: "section"
    label: "Models"
    children:
      - name: "model"
        type: "model"
        label: "MiniMax-Music3 DiT"
        required: true
        configuration:
          model_type: "diffusion_model"
          placeholder: "minimax_music3_dit_fp16..."
          filter_tags: "@config:checkpoint_tags"
          recommendations:
            - name: "minimax_music3_dit_fp16.safetensors"
              link: "https://huggingface.co/Comfy-Org/MiniMax-Music-3/resolve/main/diffusion_models/minimax_music3_dit_fp16.safetensors"
              size: "4.58 GB"
              sha256: "45494a2b6b69af115902ff28eaf54118d19067aa54da01000f3e3efce7ba0e34"
              description: "MiniMax-Music-3 flow DiT, fp16 - the default."
            - name: "minimax_music3_dit_int8_convrot.safetensors"
              link: "https://huggingface.co/Comfy-Org/MiniMax-Music-3/resolve/main/diffusion_models/minimax_music3_dit_int8_convrot.safetensors"
              size: "2.33 GB"
              sha256: "d6b959633e69899f99f3a92d6741c0fe79f26958a30811e50e372ef978b24d5f"
              description: "MiniMax-Music-3 flow DiT, int8 ConvRot - half the fp16 footprint."
            - name: "minimax_music3_dit_fp32.safetensors"
              link: "https://huggingface.co/Comfy-Org/MiniMax-Music-3/resolve/main/diffusion_models/minimax_music3_dit_fp32.safetensors"
              size: "9.15 GB"
              sha256: "ab54b44bcc40ea49c44bd65fd86cade12adf1c5bd9a5aba63f0c68f438554d2d"
              description: "MiniMax-Music-3 flow DiT, fp32 reference."

      - name: "text_encoder"
        type: "model"
        label: "Text Encoder (fused LLM + depth decoder)"
        required: true
        configuration:
          model_type: "text_encoder"
          placeholder: "minimax_music3_text_encoder_pruned_bf16..."
          filter_tags: "@config:text_encoder_tags"
          recommendations:
            - name: "minimax_music3_text_encoder_pruned_bf16.safetensors"
              link: "https://huggingface.co/Comfy-Org/MiniMax-Music-3/resolve/main/text_encoders/minimax_music3_text_encoder_pruned_bf16.safetensors"
              size: "15.56 GB"
              sha256: "e81e469c92af324dc69b77e5a11179e22542a6d628f2b205c8cf6143e510d976"
              description: "Pruned AR text encoder, bf16 - the default pairing."
            - name: "minimax_music3_text_encoder_pruned_int8_convrot.safetensors"
              link: "https://huggingface.co/Comfy-Org/MiniMax-Music-3/resolve/main/text_encoders/minimax_music3_text_encoder_pruned_int8_convrot.safetensors"
              size: "8.57 GB"
              sha256: "010b7416d2336a08c711bc22ee65849c9623069ddb7d89bec011a75699e52014"
              description: "Pruned AR text encoder, int8 ConvRot - roughly half the bf16 footprint."
            - name: "minimax_music3_text_encoder_bf16.safetensors"
              link: "https://huggingface.co/Comfy-Org/MiniMax-Music-3/resolve/main/text_encoders/minimax_music3_text_encoder_bf16.safetensors"
