  cover: "public/examples/0-yn3kd9j4.webp"
  gallery:
    - src: "public/examples/0-yn3kd9j4.webp"
      prompt: "A photorealistic, highly detailed macro photograph of a central, highly ornate spherical glass potion vessel resting on an aged dark oak alchemist's bench in a cluttered, atmospheric workshop. Inside the potion, a violently swirling, pearlescent and bioluminescent liquid nebula, composed of deep ultraviolet, sapphire, and molten gold hues, creates intense internal light. Perfectly visible within this cosmic liquid is a detailed, miniature functional clockwork mechanism made of intricate brass and gold gears, sapphire bearings, and crystal components. Above the bottle, a complex, swirling wisp of bioluminescent blue smoke forms glowing, runic patterns. The bottle's exterior features subtle arcane etchings, sealed with a decorative metal cap, a complex leather strap, and miniature gears. The bench surface around the bottle shows deep, complex, blue-green glowing caustic light patterns cast through the liquid onto the weathered wood grain. In the deeply blurred (bokeh) background, other alchemical apparatus, old books, and dried herbs are present. A young woman alchemist with complex braided hair, wearing a detailed vest with filigree and leather gear, is positioned to the right of the bottle, her face in close-up portrait, her eyes focused intently on the internal mechanism, her expression one of serious analysis. Atmospheric perspective, cinematic lighting mixing warm workshop light with cool internal glow, volumetric dust motes, subsurface scattering, extreme depth of field with the internal gears in razor-sharp focus. High definition digital painting style with photorealistic textures."
