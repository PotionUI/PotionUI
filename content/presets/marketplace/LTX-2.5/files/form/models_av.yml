  - name: "audio_vae"
    type: "model"
    label: "Audio VAE (required for Generate Audio)"
    ai_hint: "Only needed when Generate Audio (Generation tab) is on, or when the Director timeline carries its own audio clips. Leave empty for a silent render -- the audio VAE and vocoder are then never loaded, costing nothing."
    configuration:
      model_type: "vae"
      placeholder: "ltx-2.5-audio-vae-bf16..."
      filter_tags: "@config:vae_tags"
      recommendations:
        - name: "ltx-2.5-audio-vae-bf16.safetensors"
