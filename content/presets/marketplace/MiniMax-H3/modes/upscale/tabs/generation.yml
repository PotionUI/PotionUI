fields:
  - name: "speed_profile"
    type: "select"
    formula: "speed"
    label: "Speed profile"
    default: "custom"
    ai_hint: "The refine's released recipe is 4 steps; Custom starts there and leaves the Steps slider on the Advanced tab to the user. Turbo pins 4 steps. Quality pins 24, about six times slower; suggest it only when a refine still looks under-cooked."
    configuration:
      options:
        - { label: "Quality", value: "quality", sub_label: "24 steps" }
        - { label: "Turbo", value: "turbo", sub_label: "4 steps" }
        - { label: "Custom", value: "custom", sub_label: "4 steps by default, left alone" }
  - type: "section"
    label: "Video"
    children:
      - type: "row"
        children:
          - name: "seed"
            type: "seed"
            label: "Seed"
            default: -1
            width: "3/5"

          - name: "quantity"
            type: "stepper"
            label: "Quantity"
            default: 1
            configuration: {min: 1, max: 4, step: 1}
            width: "2/5"
            full_width: true

      - name: "target_size"
        type: "select"
        formula: "size"
        label: "Target Size"
        default: "hd"
        ai_hint: "How large the upscale targets, as an area or a straight multiple of the source's own encode canvas. 'HD' is the checkpoint's own release canvas area and the recommended default. '2K' is a heavier area target for a source that is already close to HD. The two multiplier options scale the source canvas directly rather than hitting a fixed area -- reach for those when the user wants a specific size relationship to the source rather than a fixed resolution class. All four still round onto the model's own 32px canvas grid."
        configuration:
          options:
            - { label: "HD (~2.1MP, native H3 canvas)", value: "hd" }
            - { label: "2K (~3.7MP)", value: "2k" }
            - { label: "1.5x source", value: "1.5x" }
            - { label: "2x source", value: "2x" }

  - type: "section"
    label: "Models"
    formula: "models"
    children:
      - name: "model"
        type: "model"
        label: "MiniMax-H3 DiT"
        required: true
        configuration:
          model_type: "diffusion_model"
          placeholder: "minimax_h3_fl2va_pruned_fp8_scaled..."
          filter_tags: "@config:checkpoint_tags"

      - name: "text_encoder"
        type: "model"
        label: "Text Encoder (Qwen3-VL-32B)"
        required: true
        configuration:
          model_type: "text_encoder"
          placeholder: "Select the Qwen3-VL-32B encoder..."
          filter_tags: "@config:text_encoder_tags"

      - name: "video_vae"
        type: "model"
        label: "Video VAE"
        required: true
        configuration:
          model_type: "vae"
          placeholder: "minimax_h3_video_vae..."
          filter_tags: "@config:vae_tags"

      - name: "audio_vae"
        type: "model"
        label: "Audio VAE"
        required: true
        configuration:
          model_type: "vae"
          placeholder: "minimax_h3_audio_vae..."
          filter_tags: "@config:vae_tags"

      - name: "upscale_model"
        type: "model"
        label: "Latent Upscaler"
        required: true
        configuration:
          model_type: "upscaler"
          placeholder: "Select a MiniMax-H3 3D latent upscaler..."
          filter_tags: "@config:upscaler_tags"
          recommendations:
            - name: "minimax_h3_latent_upscaler_3d_bf16.safetensors"
              link: "https://huggingface.co/LBH-123-AI/Minimax_h3_latent_Upscaler/resolve/main/minimax_h3_latent_upscaler_3d_bf16.safetensors"
              size: "690.59 MB"
              sha256: "4f57821f5837f32f7142b67d815606dbd7550f194e5c769f7d6c3f83b146a5e6"
              description: "MiniMax-H3 3D latent upsampler (Apache-2.0, community-trained). Required for this mode and for the video mode's optional two-stage upscale."

      - name: preview_decoder
        type: model
        label: Preview decoder
        required: false
        ai_hint: Optional tiny decoder that turns the live preview into a true-colour frame from the middle of the clip. Leave empty to keep the fast latent colour projection.
        reactions:
        - when:
            field: preview
            equals: false
          then:
            set_visibility: false
        - when:
            field: preview
            equals: true
          then:
            set_visibility: true
        configuration:
          model_type: preview_decoder
          placeholder: Select taeh3.safetensors...
          recommendations:
          - name: taeh3.safetensors
            link: https://raw.githubusercontent.com/madebyollin/taehv/62f7591f59dfbb4c3c02b7a621d180a9eeaba26c/safetensors/taeh3.safetensors
            size: 21.66 MB
            sha256: 4fd022bfcab08772fe0536b17ea1a3bbb5625be11e397868d1c5d891863d4c13
            description: MiniMax-H3 true-colour live preview decoder (MIT).
