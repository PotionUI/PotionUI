# The two knobs that shape the alpha. Note that only Matte Feather's default
# is neutral -- Matte Strength at 50 is already a fairly aggressive clean-up;
# 0, not 50, is the model's raw alpha.
fields:
  - name: "matte_strength"
    type: "slider"
    label: "Matte Strength"
    audience: "advanced"
    default: 50
    ai_hint: "How hard the alpha is pushed toward a clean in-or-out decision. 0 is identity -- the model's raw alpha, completely unchanged. 100 is a hard step at alpha 128: every pixel ends up either fully opaque or fully transparent. In between it is a smoothstep centred on 128 whose transition band narrows as the value rises, so the default of 50 is already a fairly aggressive clean-up, not a neutral setting. This is the knob for 'background removal removed nothing'. The matting model emits a raw sigmoid probability and applies no threshold of its own, so every background pixel it was merely lukewarm about comes back at a mid-grey alpha and stays PARTLY OPAQUE -- the old background survives as a ghost across the whole frame rather than as a fringe at the edge. Raising this commits those undecided pixels. Concretely the transition band's half-width is 128 at strength 0, 64 at 50, and 0 at 100, so the interval of alpha values left partially transparent shrinks linearly toward a hard cut at 128. Direction trap, and it is the important one: the smoothstep is centred on 128, so it pushes anything ALREADY above 128 toward FULLY opaque. If the surviving background is sitting above 128, raising the strength cements it instead of removing it, and the fix is a better matte (a different checkpoint, a cleaner source) or a chroma key -- not more strength. Read the symptom before turning it: ghosted background still visible and getting fainter as you raise -> keep going (70-90); ghosted background getting more solid as you raise -> stop, the matte itself is wrong; hair, fur, motion blur or glass turned into a hard-edged blob -> come down (20-40), or to 0 to see exactly what the model actually produced."
    configuration:
      min: 0
      max: 100
      step: 1

  - name: "matte_feather"
    type: "slider"
    label: "Matte Feather"
    audience: "advanced"
    default: 0
    ai_hint: "Blur radius in pixels applied to the alpha edge after matting; 0 leaves the edge exactly as the model cut it. This softens the ALPHA, not the image -- it makes the transition from subject to transparent gradual instead of a hard step. Keep it at 0 for anything that will be keyed or composited precisely; a feathered edge is a blurry edge and no later stage can sharpen it back. 1-2px helps when the cutout looks stamped-on or aliased against its new background, typically on small subjects or low-resolution sources. Above ~4px the subject visibly dissolves at the border. Distinct from Matte Strength: strength remaps alpha VALUES around the 128 threshold (deciding which pixels count as subject at all), feather blurs the finished alpha SPATIALLY. Reach for strength when the background survives; reach for feather only when the edge geometry looks stepped."
    configuration:
      min: 0
      max: 16
      step: 0.5
