fields:
  - name: "start_image"
    type: "image"
    label: "Start picture"
    required: true
    description: "The first frame of the video. It is cropped to fill the chosen resolution."
    ai_hint: "The picture the video opens on, pinned to the first frame. It is cropped to fill the chosen resolution, so pick a resolution with the picture's aspect ratio. The prompt then says what happens, not what the picture already shows."
  - name: "end_image"
    type: "image"
    label: "End picture"
    required: true
    description: "The last frame of the video. It is cropped to fill the chosen resolution."
    ai_hint: "The picture the video arrives at, pinned to the last frame. The model invents the motion between the start and end pictures, so the prompt should describe that path, never re-describe either picture."
