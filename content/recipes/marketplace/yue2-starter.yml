schema_version: 1
id: "yue2-starter"
version: 2
name: "YuE2 Starter"
engine: "native"
category: "audio"
summary: "Get a working YuE2-3B setup on your local GPU and produce a first song."
description: >
  Installs the bundled YuE2 preset on the native (in-process) engine, makes
  sure its two model files are available, and proves the pipeline is wired
  up correctly before handing you a ready-to-use preset (see
  docs/models/yue2.md). YuE2-3B is a text-to-music family: an autoregressive
  stage samples codec tokens from style tags and lyrics -- with an optional
  chain-of-thought ABC-transcription pass -- and a flow-matching
  non-autoregressive stage turns those into a latent an Oobleck VAE decodes
  to a waveform. The two files together are a real download (~7.8 GB).

  LICENCE: both files are published under CC BY-NC 4.0
  (Attribution-NonCommercial) at `m-a-p/YuE2-3B` and `m-a-p/YuE2-Vae` on
  Hugging Face -- reuse and adaptation are permitted with attribution, but
  commercial use is not (see docs/models/yue2.md).

plugins:
  - id: "huggingface-provider"
    reason: >
      Resolves the AR/NAR backbone and the Oobleck VAE from HuggingFace by
      exact repo path. HuggingFace has no hash-lookup API, so each artifact
      below names its file explicitly; the sha256 in each artifact's
      checksum still verifies the download afterwards.

backend:
  engine: "native"

artifacts: []
presets:
  - preset_id: "01KX47YUE200000000000000YU"
    path_hint: "marketplace/YuE2"
    assign_to_owner: true


smoke:
  preset_id: "01KX47YUE200000000000000YU"
  mode: "song"
  prompt: "[Verse]\nrain on the window, slow and low\nnowhere to be, nowhere to go"
  seed: 12345
  # Matches content/presets/marketplace/YuE2/tests.yml's "yue2-song-fast"
  # case: no chain-of-thought pass, ten seconds of audio.
  form:
    style: "lo-fi hip hop, warm vinyl crackle, female alto vocals, breathy, electric piano, brushed drums, bpm 85"
    cot: "off"
    duration: 10

steps:
  - key: "plugins.ensure"
    kind: "plugins.ensure"
    title: "Enable required plugins"
    params:
      plugin_ids: ["huggingface-provider"]

  - key: "backend.ensure"
    kind: "backend.ensure"
    title: "Prepare the native backend"
    params:
      engine: "native"

  - key: "models.index"
    kind: "models.index"
    title: "Find models you already have"
    params:
      engine: "native"

  - key: "modes.plan"
    kind: "modes.plan"
    title: "Pick modes and review downloads"
    params:
      preset_id: "01KX47YUE200000000000000YU"
      modes: "all"
      selected: ["song"]
      locked: ["song"]
      extras: "offer"

  - key: "artifacts.fetch"
    kind: "artifacts.fetch"
    title: "Download the files"
    params:
      plan: "modes.plan"

  - key: "models.index.downloads"
    kind: "models.index"
    title: "Register downloaded models"
    params:
      engine: "native"

  - key: "preset.ensure"
    kind: "preset.ensure"
    title: "Install and assign the YuE2 preset"
    params:
      preset_id: "01KX47YUE200000000000000YU"

  - key: "preset.defaults"
    kind: "preset.defaults"
    title: "Use the downloaded files by default"
    params:
      plan: "modes.plan"

  - key: "pipeline.render"
    kind: "pipeline.render"
    title: "Validate the pipeline"
    params:
      preset_id: "01KX47YUE200000000000000YU"
      plan: "modes.plan"

  - key: "generation.smoke"
    kind: "generation.smoke"
    title: "Run a first real generation"
    params:
      preset_id: "01KX47YUE200000000000000YU"
      mode: "song"

  - key: "workspace.activate"
    kind: "workspace.activate"
    title: "Finish onboarding"
    onboarding_only: true
    params: {}
