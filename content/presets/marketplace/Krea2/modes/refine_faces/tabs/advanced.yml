fields:
  - type: "section"
    label: "Sampling"
    children:
      - name: "fix_steps"
        type: "slider"
        label: "Steps"
        audience: "advanced"
        default: 12
        configuration: { min: 1, max: 30, step: 1 }

      - name: "cfg"
        type: "slider"
        label: "CFG Scale"
        audience: "advanced"
        default: 1.0
        ai_hint: "1.0 suits the distilled turbo checkpoint. Raise to about 4 on the raw checkpoint."
        configuration: { min: 1.0, max: 15.0, step: 0.5 }

      - name: "fix_confidence"
        type: "slider"
        label: "Face detection confidence"
        audience: "advanced"
        default: 0.5
        configuration: { min: 0.1, max: 1.0, step: 0.05 }
