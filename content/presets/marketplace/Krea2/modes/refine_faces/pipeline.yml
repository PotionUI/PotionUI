pipeline:
  - name: "model_loader/krea2"
    enabled: true
    configuration:
      diffusion_model:
        file_path: "{{ form.diffusion_model }}"
        name: "{{ form.diffusion_model }}"
      text_encoder:
        file_path: "{{ form.text_encoder }}"
        name: "{{ form.text_encoder }}"
      vae:
        file_path: "{{ form.vae }}"
        name: "{{ form.vae }}"
      loras:
        "@loop":
          items: "{{ form.loras }}"
          template:
            file_path: "{{ item.model }}"
            weight: "{{ item.strength }}"
            step_start: "{{ item.step_start | default(none) }}"
            step_end: "{{ item.step_end | default(none) }}"

  - name: "media_loader"
    id: "media_loader"
    enabled: true
    configuration:
      media:
        - type: "image"
          path: "{{ form.source_image }}"

  - name: "prompt_encoder"
    input:
      - ["text_encoder", "model_loader/krea2", "text_encoder"]
    enabled: true
    configuration:
      p_prompt:
        input: &face_prompt "{{ generation.prompts.first.positive | text_or('a natural, detailed face with clear eyes') }}"
        output: *face_prompt
      n_prompt:
        input: "{{ generation.prompts.first.negative }}"
        output: "{{ generation.prompts.first.negative }}"
      quantity: 1
      guidance_scale: "{{ form.cfg }}"
      negative_applied: "{{ generation.negative_applied }}"

  - name: "seed_generator"
    enabled: true
    configuration:
      seed: "{{ form.seed }}"
      quantity: 1

  - name: "dynamic_prompts_renderer"
    id: "dynamic_prompts_renderer"
    enabled: true
    configuration:
      pairs: "{{ generation.prompts.pairs }}"
      quantity: 1

  - name: "from_iotype"
    id: "from_iotype"
    enabled: true
    input:
      - ["seed", "seed_generator", "seed"]
    configuration:
      from: "seed"

  - name: "param_emitter"
    id: "param_emitter"
    enabled: true
    input:
      - ["seed", "from_iotype", "seed"]
    configuration:
      quantity: 1
      parameters:
        - ["model", "{{ form.diffusion_model }}"]
        - ["model", "{{ form.text_encoder }}"]
        - ["model", "{{ form.vae }}"]
        - "@loop":
            items: "{{ form.loras | active_loras }}"
            template: ["model", "{{ item.model }}"]
        - ["positive_prompt", "{{ generation.prompts.positives }}"]
        - ["negative_prompt", "{{ generation.prompts.negatives }}"]
        - ["cfg", "{{ form.cfg }}"]
        - ["steps", "{{ form.fix_steps }}"]
        - ["fix_strength", "{{ form.fix_strength }}"]

  - name: "detailer/native"
    id: "face_detailer"
    enabled: true
    input:
      - ["model", "model_loader/krea2", "model"]
      - ["conditioning", "prompt_encoder", "conditioning"]
      - ["seed", "seed_generator", "seed"]
      - ["image", "media_loader", "image"]
    configuration:
      denoise: "{{ form.fix_strength }}"
      steps: "{{ form.fix_steps }}"
      guidance: "{{ form.cfg }}"
      sampler: "euler"
      max_faces: "{{ form.fix_max_faces }}"
      detection_confidence: "{{ form.fix_confidence }}"
      detection_backend: "{{ form.fix_backend }}"
      face_model: "{{ form.fix_mediapipe_model }}"
      yolo_model: "{{ form.fix_yolo_model }}"
      detect_hands: "{{ form.face_detailer_hands }}"
      hand_model: "{{ form.face_detailer_hand_model }}"
      run_loras:
        "@loop":
          items: "{{ form.loras }}"
          template:
            file_path: "{{ item.model }}"
            weight: "{{ item.strength }}"
            step_start: "{{ item.step_start | default(none) }}"
            step_end: "{{ item.step_end | default(none) }}"

  - name: "gallery"
    id: "gallery"
    enabled: true
    input:
      - ["image", "face_detailer", "image"]
      - ["seed", "seed_generator", "seed"]
