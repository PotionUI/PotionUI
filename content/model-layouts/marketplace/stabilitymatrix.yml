  - {path: DiffusionModels, model_type: diffusion_model, write: true, weight: 3}
  - {path: TextEncoders, model_type: text_encoder, write: true, weight: 2}
  - {path: Lora, model_type: lora, write: true}
  - {path: LyCORIS, model_type: lora}
  - {path: VAE, model_type: vae, write: true}
  - {path: Embeddings, model_type: embedding, write: true}
  - {path: ESRGAN, model_type: upscaler, write: true}
  - {path: RealESRGAN, model_type: upscaler}
  - {path: ControlNet, model_type: controlnet, write: true}
  - {path: T2IAdapter, model_type: controlnet}
  - {path: AfterDetailer, model_type: adetailer, write: true}
  - {path: Ultralytics/bbox, model_type: detection_bbox, write: true}
  - {path: Ultralytics/segm, model_type: detection_segm, write: true}
  - {path: CLIP, model_type: text_encoder, optional: true}
  - {path: Unet, model_type: diffusion_model, scan_headers: true, optional: true}
  - {path: TextualInversion, model_type: embedding, optional: true}
