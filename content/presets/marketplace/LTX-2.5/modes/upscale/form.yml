name: "custom"
mode_label: "Upscale"
short_description: "Increase the resolution of a video."
negative_prompt:
  applies_when:
    logic: "OR"
    conditions:
      - logic: "AND"
        conditions:
          - { field: "upscale_method", equals: "latent" }
          - { field: "refine_cfg", greater_than: 1 }
      - logic: "AND"
        conditions:
          - { field: "upscale_method", not_equals: "latent" }
          - { field: "cfg", greater_than: 1 }
requirements:
  - type: "model"
    field: "pixel_spatial_lora"
    hint: "Download the Generative 2x LoRA in this mode."
    optional: true
  - type: "model"
    field: "refine_details_lora"
    hint: "Download the Refine details LoRA in this mode."
    optional: true
fields:
  - type: "tabs"
    children:
      - type: "tab"
        label: "Generation"
        configuration:
          icon: "generation"
          icon_display: "icon_only"
        children: "{{ paths.preset }}/modes/upscale/tabs/generation.yml"
      - type: "tab"
        label: "References"
        configuration:
          icon: "image"
          icon_display: "icon_only"
        children: "{{ paths.preset }}/modes/upscale/tabs/references.yml"
      - type: "tab"
        label: "LoRA"
        configuration:
          icon: "lora"
          icon_display: "icon_only"
        children: "{{ paths.preset }}/modes/video/tabs/lora.yml"
      - type: "tab"
        label: "Enhance"
        configuration:
          icon: "sparkles"
          icon_display: "icon_only"
        children: "{{ paths.preset }}/modes/upscale/tabs/enhance.yml"
      - type: "tab"
        label: "Advanced"
        audience: "advanced"
        configuration:
          icon: "settings"
          icon_display: "icon_only"
        children: "{{ paths.preset }}/modes/upscale/tabs/advanced.yml"
