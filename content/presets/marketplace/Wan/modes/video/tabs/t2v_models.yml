# T2V checkpoint set + its BASE LoRA stacks. Wan 2.2 ships architecturally-
# separate t2v (in_dim=16) and i2v (in_dim=36) checkpoints; the Director loads
# only the set(s) a request actually needs (a pure-t2v document never loads the
# i2v pair). Wan 2.2 14B is a HIGH/LOW-noise expert PAIR -- supply both files and
# the generator's expert router switches at the sampling boundary; Wan 2.1 / the
# 5B ti2v are single-DiT, so leave the low-noise picker empty. The 5B TI2V
# checkpoint (in_dim=48, dense, no CLIP-vision img_emb) is TEXT-TO-VIDEO ONLY in
# this preset: its built-in image conditioning is not the 36-channel concat
# contract generator/img2vid_wan22 implements, so it must go in the T2V picker
# only -- never also in the I2V picker (i2v/flf modes and the Director's i2v/
# chain shots need an A14B i2v checkpoint, in_dim=36).
fields:
  - type: "section"
    label: "T2V Models"
    children:
      - name: "t2v_high_noise_model"
        type: "model"
        label: "t2v DiT (high-noise / single)"
        configuration:
          model_type: "diffusion_model"
          placeholder: "Wan t2v DiT — high-noise expert, or the only DiT..."
          filter_tags: "@config:checkpoint_tags"
          recommendations:
            - name: "wan2.2_t2v_high_noise_14B_fp8_scaled.safetensors"
              link: "https://huggingface.co/Comfy-Org/Wan_2.2_ComfyUI_Repackaged/resolve/main/split_files/diffusion_models/wan2.2_t2v_high_noise_14B_fp8_scaled.safetensors"
              size: "13.31 GB"
              sha256: "cad711ae211c8b23455ec68cd6a190a33a3d874234a77eb57266d73f8f0e6c9f"
              description: "Wan 2.2 14B t2v high-noise expert, fp8-scaled - half the bf16 footprint."
            - name: "wan2.2_t2v_high_noise_14B_fp16.safetensors"
              link: "https://huggingface.co/Comfy-Org/Wan_2.2_ComfyUI_Repackaged/resolve/main/split_files/diffusion_models/wan2.2_t2v_high_noise_14B_fp16.safetensors"
              size: "26.61 GB"
              sha256: "c793e1515320fc8883ac8f97e2a45270c35edd8c4e334a6d42d3e95455bd8da2"
              description: "Wan 2.2 14B t2v high-noise expert, full-precision reference."
            - name: "wan2.2_ti2v_5B_fp16.safetensors"
              link: "https://huggingface.co/Comfy-Org/Wan_2.2_ComfyUI_Repackaged/resolve/main/split_files/diffusion_models/wan2.2_ti2v_5B_fp16.safetensors"
              size: "9.31 GB"
              sha256: "456f901338bd9eadbded3828b819109a9b68e8a525ca5cf8d0049a69fcfeca1e"
              description: "Wan 2.2 5B TI2V - single DiT, text-to-video only in this preset (its built-in image conditioning needs a different i2v path than the A14B checkpoints' concat contract). Leave the low-noise picker empty and use wan2.2_vae; do not also pick it in the i2v/Director pickers."

      # Wan 2.2 14B dual-expert only; leave empty for 2.1 / 5B.
      - name: "t2v_low_noise_model"
        type: "model"
        label: "t2v DiT (low-noise expert)"
        configuration:
          model_type: "diffusion_model"
          placeholder: "Wan 2.2 t2v low-noise expert — leave empty for 2.1 / 5B..."
          filter_tags: "@config:checkpoint_tags"
          recommendations:
            - name: "wan2.2_t2v_low_noise_14B_fp8_scaled.safetensors"
              link: "https://huggingface.co/Comfy-Org/Wan_2.2_ComfyUI_Repackaged/resolve/main/split_files/diffusion_models/wan2.2_t2v_low_noise_14B_fp8_scaled.safetensors"
              size: "13.31 GB"
              sha256: "e71b96d7c82e638694c5e7fb98fac4bfb0e4ddc5fbbb4b1df40da8f0f1278a97"
              description: "Wan 2.2 14B t2v low-noise expert, fp8-scaled. Pair with the high-noise file above."
            - name: "wan2.2_t2v_low_noise_14B_fp16.safetensors"
              link: "https://huggingface.co/Comfy-Org/Wan_2.2_ComfyUI_Repackaged/resolve/main/split_files/diffusion_models/wan2.2_t2v_low_noise_14B_fp16.safetensors"
              size: "26.61 GB"
              sha256: "431d1613ffa809ae1f735b661a01788c6d74991f51efd01f45d5aee955ccd224"
              description: "Wan 2.2 14B t2v low-noise expert, full-precision reference."

  - type: "section"
    label: "T2V LoRAs"
    children:
      - name: "t2v_loras_high"
        type: "lora_picker"
        default: []
        label: "t2v LoRAs — high-noise expert"
        ai_hint: "LoRAs for the t2v high-noise expert (the HIGH file of a Wan 2.2 t2v pair, e.g. Lightning/lightx2v t2v HighNoise). 0.5-1.0 typical. Leave empty if not needed."
        configuration:
          model_type: "lora"
          placeholder: "Select a t2v high-noise LoRA..."
          filter_tags: "@config:lora_tags"
          allow_info_modal: true
          strength_min: -10.0
          strength_max: 10.0
          strength_step: 0.1
          strength_default: 1.0
          max_items: 10

      - name: "t2v_loras_low"
        type: "lora_picker"
        default: []
        label: "t2v LoRAs — low-noise expert"
        ai_hint: "LoRAs for the t2v low-noise expert (the LOW file of a Wan 2.2 t2v pair). Ignored when no t2v low-noise model is set."
        configuration:
          model_type: "lora"
          placeholder: "Select a t2v low-noise LoRA..."
          filter_tags: "@config:lora_tags"
          allow_info_modal: true
          strength_min: -10.0
          strength_max: 10.0
          strength_step: 0.1
          strength_default: 1.0
          max_items: 10
