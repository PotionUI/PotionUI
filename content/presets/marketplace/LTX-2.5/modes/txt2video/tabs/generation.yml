fields:
  - name: "speed_profile"
    type: "select"
    formula: "speed"
    label: "Speed profile"
    default: "distilled"
    configuration:
      options:
        - { label: "Distilled", value: "distilled", sub_label: "8 steps · CFG off · distilled sigma recipe" }
        - { label: "Balanced", value: "balanced", sub_label: "24 steps · CFG 4 · needs the dev checkpoint" }
        - { label: "Quality", value: "quality", sub_label: "30 steps · CFG 3 · multimodal guidance · needs the dev checkpoint" }
        - { label: "Custom", value: "custom", sub_label: "your own steps · sampler · CFG, left alone" }

  - type: "section"
    label: "Video"
    children:
      - name: "seed"
        type: "seed"
        label: "Seed"
        default: -1

      - name: "resolution"
        type: "resolution"
        formula: "size"
        label: "Resolution"
        configuration:
          files:
            - { path: "{{ paths._shared }}/resolutions/video.yml", group: "Video" }
            - { path: "{{ paths._shared }}/resolutions/social_media_video.yml", group: "Social Media" }
        default: "768x512"

      - name: "duration"
        type: "slider"
        formula: "size"
        label: "Length (seconds)"
        default: 5
        configuration: {min: 1, max: 20, step: 1}

      - name: "fps"
        type: "slider"
        formula: "size"
        label: "FPS"
        default: 25
        configuration: {min: 1, max: 50, step: 1}

      - name: "generate_audio"
        type: "checkbox"
        label: "Generate Audio"
        ai_hint: "Needs the Audio VAE picker (Models section) filled -- LTX-2.5 ships the audio VAE and vocoder as a separate file, so a request with this on and that picker empty is rejected before generation starts."
        default: false

  - type: "section"
    label: "Models"
    formula: "models"
    children: "{{ paths.preset }}/files/form/models_av.yml"
