name: "custom"
fields:
  - type: "tabs"
    children:
      - type: "tab"
        label: "Generation"
        configuration: {icon: "generation", icon_display: "icon_only"}
        children: "{{ paths.preset }}/modes/video/tabs/generation.yml"
      - type: "tab"
        label: "T2V Models"
        configuration: {icon: "video", icon_display: "icon_only"}
        children: "{{ paths.preset }}/modes/video/tabs/t2v_models.yml"
      - type: "tab"
        label: "I2V Models"
        configuration: {icon: "image", icon_display: "icon_only"}
        children: "{{ paths.preset }}/modes/video/tabs/i2v_models.yml"
      - type: "tab"
        label: "SVI Pro"
        configuration: {icon: "film", icon_display: "icon_only"}
        children: "{{ paths.preset }}/modes/video/tabs/svi_pro.yml"
      - type: "tab"
        label: "Advanced"
        audience: "advanced"
        configuration: {icon: "settings", icon_display: "icon_only"}
        children: "{{ paths.preset }}/modes/video/tabs/advanced.yml"
