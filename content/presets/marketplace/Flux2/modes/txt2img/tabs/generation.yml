fields:
  - type: "section"
    label: "Image"
    children:
      - type: "row"
        children:
          - name: "seed"
            type: "seed"
            label: "Seed"
            default: -1
            width: "3/5"

          - name: "quantity"
            type: "stepper"
            label: "Quantity"
            default: 1
            width: "2/5"
            full_width: true
            configuration: {min: 1, max: 10, step: 1}

      - name: "resolution"
        type: "resolution"
        label: "Resolution"
        configuration:
          files:
            - { path: "{{ paths._shared }}/resolutions/flux.yml", group: "Flux" }
            - { path: "{{ paths._shared }}/resolutions/flux_2k.yml", group: "2K" }
        default: "1024x1024"

  - type: "section"
    label: "Models"
    children:
      - name: "diffusion_model"
        type: "model"
        label: "Diffusion Model"
        required: true
        configuration:
          model_type: "diffusion_model"
          placeholder: "Select a Flux2-architecture DiT (Klein 9B, Flux2)..."
          filter_tags: "@config:checkpoint_tags"
          recommendations:
            - name: "flux-2-klein-9b-fp8.safetensors"
              provider: "huggingface"
              ref: '{"repo": "black-forest-labs/FLUX.2-klein-9b-fp8", "file": "flux-2-klein-9b-fp8.safetensors", "revision": "main"}'
              size: "8.79 GB"
              description: "Klein 9B, fp8 - the reference local checkpoint; pair with a Qwen3-8B encoder. Gated repo: accept the FLUX.2 license on Hugging Face and set a token in Admin - Plugins."
            - name: "flux-2-klein-4b.safetensors"
              link: "https://huggingface.co/Comfy-Org/vae-text-encorder-for-flux-klein-4b/resolve/main/split_files/diffusion_models/flux-2-klein-4b.safetensors"
              size: "7.22 GB"
              sha256: "ec3d4e733a771f61c052fb4856c48b336c55eaf2c65487c2a1faeb9bbda7a343"
              description: "Klein 4B, bf16 - the small-card path; needs the Qwen3-4B encoder, not the 8B."
            - name: "flux-2-klein-9b.safetensors"
              provider: "huggingface"
              ref: '{"repo": "black-forest-labs/FLUX.2-klein-9B", "file": "flux-2-klein-9b.safetensors", "revision": "main"}'
              size: "16.91 GB"
              description: "Klein 9B, bf16 reference. Gated repo: accept the FLUX.2 license on Hugging Face and set a token in Admin - Plugins."

      - name: "text_encoder"
        type: "model"
        label: "Text Encoder"
        required: true
        configuration:
          model_type: "text_encoder"
          placeholder: "Select the Qwen3 text encoder..."
          filter_tags: "@config:text_encoder_tags"
          recommendations:
            - name: "qwen_3_8b_fp8mixed.safetensors"
              link: "https://huggingface.co/Comfy-Org/vae-text-encorder-for-flux-klein-9b/resolve/main/split_files/text_encoders/qwen_3_8b_fp8mixed.safetensors"
              size: "8.07 GB"
              sha256: "abad16806e0cbabc54e0325d6565847443fe396d5f0be38bb3cd3fe75a1201d6"
              description: "Qwen3-8B for Klein 9B, fp8/nvfp4 mixed - about half of bf16."
            - name: "qwen_3_8b.safetensors"
              link: "https://huggingface.co/Comfy-Org/vae-text-encorder-for-flux-klein-9b/resolve/main/split_files/text_encoders/qwen_3_8b.safetensors"
              size: "15.26 GB"
              sha256: "f0ff9239d56269ca1d05e5f86da6a79fac111af464955681f11c7ab0ec5ef6c1"
              description: "Qwen3-8B for Klein 9B, full-precision reference."
            - name: "qwen_3_8b_fp4mixed.safetensors"
              link: "https://huggingface.co/Comfy-Org/vae-text-encorder-for-flux-klein-9b/resolve/main/split_files/text_encoders/qwen_3_8b_fp4mixed.safetensors"
              size: "6.34 GB"
              sha256: "bbf16f981d98e16d080c566134814c4e9f6aadd0d0e1383c60bc44ba939d760d"
              description: "Qwen3-8B for Klein 9B, fp4 mixed - smallest 8B tier."
            - name: "qwen_3_4b.safetensors"
              link: "https://huggingface.co/Comfy-Org/vae-text-encorder-for-flux-klein-4b/resolve/main/split_files/text_encoders/qwen_3_4b.safetensors"
              size: "7.49 GB"
              sha256: "6c671498573ac2f7a5501502ccce8d2b08ea6ca2f661c458e708f36b36edfc5a"
              description: "Qwen3-4B - the encoder Klein 4B expects; it will not drive the 9B DiT."

      - name: "vae"
        type: "model"
        label: "VAE"
        required: true
        configuration:
          model_type: "vae"
          placeholder: "Select Flux VAE..."
          filter_tags: "@config:vae_tags"
          recommendations:
            - name: "flux2-vae.safetensors"
              link: "https://huggingface.co/Comfy-Org/vae-text-encorder-for-flux-klein-9b/resolve/main/split_files/vae/flux2-vae.safetensors"
              size: "320.6 MB"
              sha256: "868fe7b343cc8f3a19dbcfcafbc3d5f888802be3f89bd81b65b3621a066ce8f3"
              description: "Flux2 VAE - the same file for every Flux2-architecture DiT."
