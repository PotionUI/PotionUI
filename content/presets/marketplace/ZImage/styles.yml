    description: "Candid, off-center, harsh daylight, a moment caught in passing."
    prepend: "A candid street photograph of "
    append: ". Taken quickly on a 28mm lens in hard midday sunlight, slightly off-center framing, deep crisp shadows, incidental everyday details at the edges of the frame and the unposed energy of a moment caught in passing."
