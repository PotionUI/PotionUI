########
## Setup recipe: Krea-2 on the native engine
##
## See src/features/recipes/schema.py for the schema this file is
## validated against (scripts/recipe_lint.py) and
## src/features/recipes/executors/ for what each step kind actually does.
########
schema_version: 1
id: "krea2-starter"
version: 1
name: "Krea-2 Starter"
engine: "native"
category: "image"
summary: "Get a working Krea-2 setup on your local GPU and produce a first image."
description: >
  Installs the bundled Krea-2 preset on the native (in-process) engine,
  makes sure its three model files are available, and proves the pipeline is
  wired up correctly before handing you a ready-to-use preset (see
  docs/models/krea2.md). Krea-2's own author repos (krea/Krea-2-Turbo,
  krea/Krea-2-Raw) sit behind the Krea 2 Community License Agreement, so
  this recipe fetches the same weights from Comfy-Org's ungated repack
  instead: the distilled turbo DiT, the Qwen3-VL-4B text encoder and the
  shared Qwen-Image VAE. The DiT and text encoder come in several precisions
  (bf16, fp8, int8, nvfp4); the setup picks the one that suits your GPU and
  lets you change it before anything downloads. At the default fp8 picks the
  three files together are a real download (~18.6 GB). The weights
  themselves remain under the Krea 2 Community License wherever they are
  fetched from.

plugins:
  - id: "huggingface-provider"
    reason: >
      Resolves the diffusion model, text encoder and VAE from HuggingFace
      by exact repo path. HuggingFace has no hash-lookup API, so each
      artifact below names its file explicitly; the sha256 in each
      artifact's checksum still verifies the download afterwards.

backend:
  engine: "native"

artifacts:
  - id: "krea2-diffusion-model"
    kind: "diffusion_model"
    model_type: "diffusion_model"
    display_name: "Krea-2 Turbo (DiT)"
    required: true
    capability: "model-lookup"
    variants:
      - id: "krea2_turbo_bf16"
        label: "Best quality"
        precision: "bf16"
        filename: "krea2_turbo_bf16.safetensors"
        size_bytes: 26283332608
        checksum:
          algorithm: "sha256"
          value: "78bbf8f4165eda19cea3cb06c78089221932a39e2eed8af9da741f942c47ffb3"
        provider_hint:
          source: "huggingface"
          model_id: "Comfy-Org/Krea-2"
          version_id: "main@diffusion_models/krea2_turbo_bf16.safetensors"
        uploader: "Comfy-Org"
        source_url: "https://huggingface.co/Comfy-Org/Krea-2"
        recommended_for:
          - min_vram_gb: 40
      - id: "krea2_turbo_fp8_scaled"
        label: "Balanced"
        precision: "fp8"
        filename: "krea2_turbo_fp8_scaled.safetensors"
        size_bytes: 13141730784
        checksum:
          algorithm: "sha256"
          value: "eb4dd8c612cfd10f64f25b057e6e6bbcb5737c94a7372177e456dbf7579502f1"
        provider_hint:
          source: "huggingface"
          model_id: "Comfy-Org/Krea-2"
          version_id: "main@diffusion_models/krea2_turbo_fp8_scaled.safetensors"
        uploader: "Comfy-Org"
        source_url: "https://huggingface.co/Comfy-Org/Krea-2"
        default: true
        recommended_for:
          - min_vram_gb: 20
            generations: ["ada", "hopper", "blackwell"]
      - id: "krea2_turbo_int8_convrot"
        label: "Standard"
        precision: "int8"
        filename: "krea2_turbo_int8_convrot.safetensors"
        size_bytes: 13492686496
        checksum:
          algorithm: "sha256"
          value: "8e4eeda70dd5037ab1ba2bef6b417f9f901e26093117cf397f741fc1fdaaf3f1"
        provider_hint:
          source: "huggingface"
          model_id: "Comfy-Org/Krea-2"
          version_id: "main@diffusion_models/krea2_turbo_int8_convrot.safetensors"
        uploader: "Comfy-Org"
        source_url: "https://huggingface.co/Comfy-Org/Krea-2"
        recommended_for:
          - min_vram_gb: 20
      - id: "krea2_turbo_nvfp4"
        label: "Low VRAM"
        precision: "nvfp4"
        filename: "krea2_turbo_nvfp4.safetensors"
        size_bytes: 7673668448
        checksum:
          algorithm: "sha256"
          value: "61527003b2d537055494d01bc8efe51d6e86e64192ba23e3721a5647231fe394"
        provider_hint:
          source: "huggingface"
          model_id: "Comfy-Org/Krea-2"
          version_id: "main@diffusion_models/krea2_turbo_nvfp4.safetensors"
        uploader: "Comfy-Org"
        source_url: "https://huggingface.co/Comfy-Org/Krea-2"
        recommended_for:
          - generations: ["blackwell"]

  - id: "krea2-text-encoder"
    kind: "text_encoder"
    model_type: "text_encoder"
    display_name: "Qwen3-VL-4B text encoder"
    required: true
    capability: "model-lookup"
    variants:
      - id: "qwen3vl_4b_bf16"
        label: "Best quality"
        precision: "bf16"
        filename: "qwen3vl_4b_bf16.safetensors"
        size_bytes: 8875719384
        checksum:
          algorithm: "sha256"
          value: "36f3ff447ef59201722e8f9ce6020c9819fdcfba6aa2608c4e09b1c0ce114e34"
        provider_hint:
          source: "huggingface"
          model_id: "Comfy-Org/Krea-2"
          version_id: "main@text_encoders/qwen3vl_4b_bf16.safetensors"
        uploader: "Comfy-Org"
        source_url: "https://huggingface.co/Comfy-Org/Krea-2"
        recommended_for:
          - min_vram_gb: 32
      - id: "qwen3vl_4b_fp8_scaled"
        label: "Balanced"
        precision: "fp8"
        filename: "qwen3vl_4b_fp8_scaled.safetensors"
        size_bytes: 5242467968
        checksum:
          algorithm: "sha256"
          value: "54bd5144df0bbc25dd6ccadfcb826b521445a1b06ae5a42570bdd2974ca87094"
        provider_hint:
          source: "huggingface"
          model_id: "Comfy-Org/Krea-2"
          version_id: "main@text_encoders/qwen3vl_4b_fp8_scaled.safetensors"
        uploader: "Comfy-Org"
        source_url: "https://huggingface.co/Comfy-Org/Krea-2"
        default: true

  - id: "krea2-vae"
    kind: "vae"
    model_type: "vae"
    filename: "qwen_image_vae.safetensors"
    display_name: "Krea-2 VAE (Wan 2.1 causal-3D, shared with Qwen-Image/Anima)"
    required: true
    size_bytes: 253806246
    checksum:
      algorithm: "sha256"
      value: "a70580f0213e67967ee9c95f05bb400e8fb08307e017a924bf3441223e023d1f"
    capability: "model-lookup"
    provider_hint:
      source: "huggingface"
      model_id: "Comfy-Org/Krea-2"
      version_id: "main@vae/qwen_image_vae.safetensors"

presets:
  - preset_id: "4TK1KBQZ2XMB8ME0PTMXS1YJQP"
    path_hint: "marketplace/Krea2"
    assign_to_owner: true

smoke:
  preset_id: "4TK1KBQZ2XMB8ME0PTMXS1YJQP"
  mode: "txt2img"
  prompt: "a red fox sitting in a sunlit forest clearing"
  seed: 12345
  # Matches content/presets/marketplace/Krea2/tests.yml's
  # "krea2-turbo-baseline-fast" case verbatim (a real maintainer txt2img
  # session): the Turbo speed profile's 8-step/euler operating point,
  # smallest square resolution.
  form:
    speed_profile: "turbo"
    steps: 8
    sampler: "euler"
    resolution: "1024x1024"

steps:
  - key: "plugins.ensure"
    kind: "plugins.ensure"
    title: "Enable required plugins"
    params:
      # huggingface-provider is needed so the download step can resolve each
      # artifact's exact repo file.
      plugin_ids: ["huggingface-provider"]

  - key: "backend.ensure"
    kind: "backend.ensure"
    title: "Prepare the native backend"
    params:
      engine: "native"

  # Index BEFORE planning downloads: on a fresh instance nothing is indexed
  # yet, so without this pass artifacts.plan cannot see files the user
  # already has and would ask to download them.
  - key: "models.index"
    kind: "models.index"
    title: "Find models you already have"
    params:
      engine: "native"

  - key: "artifacts.plan"
    kind: "artifacts.plan"
    title: "Plan required downloads"
    params:
      artifact_ids: ["krea2-diffusion-model", "krea2-text-encoder", "krea2-vae"]

  - key: "artifacts.fetch"
    kind: "artifacts.fetch"
    title: "Download the Krea-2 model files"
    params:
      artifact_ids: ["krea2-diffusion-model", "krea2-text-encoder", "krea2-vae"]

  - key: "models.index.downloads"
    kind: "models.index"
    title: "Register downloaded models"
    params:
      engine: "native"

  - key: "preset.ensure"
    kind: "preset.ensure"
    title: "Install and assign the Krea-2 preset"
    params:
      preset_id: "4TK1KBQZ2XMB8ME0PTMXS1YJQP"

  - key: "pipeline.render"
    kind: "pipeline.render"
    title: "Validate the pipeline"
    params:
      preset_id: "4TK1KBQZ2XMB8ME0PTMXS1YJQP"
      mode: "txt2img"

  - key: "generation.smoke"
    kind: "generation.smoke"
    title: "Run a first real generation"
    params:
      preset_id: "4TK1KBQZ2XMB8ME0PTMXS1YJQP"
      mode: "txt2img"

  - key: "workspace.activate"
    kind: "workspace.activate"
    title: "Finish onboarding"
    # Only meaningful during the first-run wizard - a run started from
    # Admin -> Recipes skips it.
    onboarding_only: true
    params: {}
