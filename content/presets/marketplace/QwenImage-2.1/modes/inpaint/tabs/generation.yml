fields:
  - name: "speed_profile"
    type: "select"
    formula: "speed"
    label: "Speed profile"
    default: "balanced"
    configuration:
      options:
        - { label: "Balanced", value: "balanced", sub_label: "40 steps" }
        - { label: "Turbo", value: "turbo", sub_label: "8 steps, Turbo8 LoRA" }
        - { label: "Custom", value: "custom", sub_label: "set steps/CFG freely" }

  - type: "section"
    label: "Image"
    children:
      - type: "row"
        children: "{{ paths._shared }}/native/seed_quantity.yml"

      - name: "denoise"
        type: "slider"
        formula: "speed"
        label: "Strength"
        default: 1.0
        ai_hint: "How far the painted area is redrawn. Full strength replaces it with something new; lower keeps more of its colours and shapes."
        configuration: {min: 0.2, max: 1.0, step: 0.05}

      - name: "mask_grow"
        type: "slider"
        label: "Grow"
        default: 4
        ai_hint: "Widens the painted area so no edge of the old content is left behind."
        configuration: {min: 0, max: 20, step: 1}

      - name: "mask_feather"
        type: "slider"
        label: "Feather"
        default: 8
        ai_hint: "Softens the seam where the new area meets the untouched picture, in percent of the area's size."
        configuration: {min: 0, max: 30, step: 1}

  - type: "section"
    label: "Models"
    formula: "models"
    children:
      - name: "diffusion_model"
        type: "model"
        label: "Diffusion Model"
        required: true
        configuration:
          model_type: "diffusion_model"
          placeholder: "Select Qwen-Image-2.1 MMDiT (e.g. qwen_image_2.1_bf16)..."
          filter_tags: "@config:checkpoint_tags"
          recommendations:
            - name: "qwen_image_2.1_bf16.safetensors"
              link: "https://huggingface.co/Comfy-Org/Qwen-Image-2.1/resolve/main/diffusion_models/qwen_image_2.1_bf16.safetensors"
              size: "14.23 GB"
              sha256: "89f4158d066cc33906a199fca85634f766892dd78f49b6698dabf187ac86c4bc"
              description: "Qwen-Image-2.1 MMDiT, bf16 - the validated local checkpoint. Same checkpoint as txt2img."

      - name: "text_encoder"
        type: "model"
        label: "Text Encoder (Qwen3-VL-8B)"
        required: true
        configuration:
          model_type: "text_encoder"
          placeholder: "Select Qwen3-VL-8B text encoder..."
          filter_tags: "@config:text_encoder_tags"
          recommendations:
            - name: "qwen3vl_8b_bf16.safetensors"
              link: "https://huggingface.co/Comfy-Org/Qwen-Image-2.1/resolve/main/text_encoders/qwen3vl_8b_bf16.safetensors"
              size: "17.53 GB"
              sha256: "68bdc82bc1b66851162ae656225e7e2068166b603db19bd5d5a3b90eb12669a9"
              description: "Qwen3-VL-8B encoder, bf16 - pairs with the bf16 MMDiT."

      - name: "vae"
        type: "model"
        label: "VAE"
        required: true
        configuration:
          model_type: "vae"
          placeholder: "Select Qwen-Image-2.1 VAE..."
          filter_tags: "@config:vae_tags"
          recommendations:
            - name: "qwen_image_2.1_vae_bf16.safetensors"
              link: "https://huggingface.co/Comfy-Org/Qwen-Image-2.1/resolve/main/vae/qwen_image_2.1_vae_bf16.safetensors"
              size: "0.68 GB"
              sha256: "bb21f7473051e1ac368515dd3f2e15cd44d7a11748ee8823e1ddca3e4876b7c9"
              description: "Qwen-Image-2.1 VAE (RGBA, 16x latent). Alpha is dropped on decode in this preset."

      - name: "turbo_lora"
        type: "model"
        label: "Turbo LoRA"
        required: false
        visible: false
        description: "For the Turbo speed profile."
        configuration:
          model_type: "lora"
          placeholder: "turbo8_lora_step2500..."
          recommendations:
            - name: "turbo8_lora_step2500.safetensors"
              link: "https://huggingface.co/chriswritescode/Turbo8-LoRA-Qwen-Image-2.1/resolve/main/turbo8_lora_step2500.safetensors"
              size: "1.36 GB"
              sha256: "a0b7a7634ff2f82ccbe209e16b0ba19b25e2d9e18624d89edc490503b6a75d39"
              description: "Turbo8, 8 steps and no CFG (Qwen Research License, non-commercial use only)."
        reactions:
          - when: { field: "speed_profile", equals: "turbo" }
            then: { set_visibility: true }
