fields:
  - type: "section"
    label: "Sampling"
    children:
      - name: "steps"
        type: "slider"
        label: "Steps"
        audience: "advanced"
        default: 20
        configuration: {min: 1, max: 100, step: 1}
        reactions:
          - when: { field: "speed_profile", equals: "balanced" }
            then: { set_value: 20, set_disabled: false }
          - when: { field: "speed_profile", equals: "turbo" }
            then: { set_value: 8, set_disabled: false }
          - when: { field: "speed_profile", equals: "turbo_4" }
            then: { set_value: 4, set_disabled: false }
          - when: { field: "speed_profile", equals: "custom" }
            then: { set_disabled: false }

      - name: "sampler"
        type: "select"
        label: "Sampler"
        audience: "advanced"
        default: "euler"
        configuration:
          options:
            - { label: "Euler", value: "euler" }
            - { label: "DPM++ 2M", value: "dpmpp_2m" }
            - { label: "UniPC", value: "unipc" }
        reactions:
          - when: { field: "speed_profile", equals: "balanced" }
            then: { set_value: "euler", set_disabled: false }
          - when: { field: "speed_profile", equals: "turbo" }
            then: { set_value: "euler", set_disabled: false }
          - when: { field: "speed_profile", equals: "turbo_4" }
            then: { set_value: "euler", set_disabled: false }
          - when: { field: "speed_profile", equals: "custom" }
            then: { set_disabled: false }

      - name: "cfg"
        type: "slider"
        label: "CFG Scale"
        audience: "advanced"
        default: 4.0
        configuration: {min: 1.0, max: 10.0, step: 0.5}
        reactions:
          - when: { field: "speed_profile", equals: "balanced" }
            then: { set_value: 4.0, set_disabled: false }
          - when: { field: "speed_profile", equals: "turbo" }
            then: { set_value: 1.0, set_disabled: false }
          - when: { field: "speed_profile", equals: "turbo_4" }
            then: { set_value: 1.0, set_disabled: false }
          - when: { field: "speed_profile", equals: "custom" }
            then: { set_disabled: false }

      # Optional sigma-shift override. Leave blank to use the model's built-in
      # default (ComfyUI Qwen-Image 1.15). Independent of the speed profile axis.
      - name: "shift"
        type: "number"
        label: "Shift (override)"
        audience: "advanced"
        configuration: {min: 0.1, max: 10.0, step: 0.05}

      # Trajectory warm-start: re-rendering the same seed with a tweaked
      # prompt reuses part of the previous run's sampling trajectory
      # (NativeGenerator._plan_warm_start gates eligibility; Euler only).
      - name: "iterate_mode"
        type: "checkbox"
        label: "Iterate mode"
        audience: "advanced"
        default: false
        ai_hint: "A speed knob for rapid iterative regeneration -- tweaking a prompt slightly and re-rendering the same seed. Suggest enabling it only for that repeated-tweak workflow, never for a single one-off render, and only when Sampler is Euler."
