# Pipeline for the 'interpolate' mode.
#
#   media_loader -> param_emitter -> interpolator/rife -> gallery
pipeline:
  #############
  ## Media Loader - Load the source video from the form file path
  #############
  - name: "media_loader"
    id: "media_loader"
    enabled: true
    configuration:
      validate_files: true
      max_file_size: 524288000  # 500MB
      auto_detect_type: true
      media:
        - type: "video"
          path: "{{ form.input_video }}"

  #############
  ## Parameter Emitter - record the run's settings on the generation
  #############
  - name: "param_emitter"
    id: "param_emitter"
    enabled: true
    configuration:
      quantity: 1
      parameters:
        - ["model", "{{ form.model }}"]
        - ["factor", "{{ form.factor }}"]
        - ["target_fps", "{{ form.target_fps }}"]
        - ["scene_detection", "{{ form.scene_detection }}"]
        - ["flow_scale", "{{ form.flow_scale }}"]
        - ["keep_audio", "{{ form.keep_audio }}"]

  #############
  ## Interpolator - RIFE 4.x frame interpolation (streaming, frame pair at a time)
  #############
  - name: "interpolator/rife"
    id: "interpolator"
    input:
      - ["video", "media_loader", "video"]
    enabled: true
    configuration:
      model:
        file_path: "{{ form.model }}"
        name: "{{ form.model }}"
      factor: "{{ form.factor }}"
      target_fps: "{{ form.target_fps }}"
      scene_detection: "{{ form.scene_detection }}"
      flow_scale: "{{ form.flow_scale }}"
      keep_audio: "{{ form.keep_audio }}"

  #############
  ## Gallery - Save the interpolated video
  #############
  - name: "gallery"
    id: "gallery"
    input:
      - ["video", "interpolator", "video"]
    enabled: true
