name: "custom"
short_description: "Generate an image from a text prompt."
fields:
  - type: "tabs"
    children:
      - type: "tab"
        anchor: "generation"
        label: "Generation"
        configuration:
          icon: "generation"
          icon_display: "icon_only"
        children: "{{ paths.preset }}/modes/txt2img/tabs/generation.yml"
      - type: "tab"
        anchor: "lora"
        label: "LoRA"
        configuration:
          icon: "lora"
          icon_display: "icon_only"
        children:
          file: "{{ paths._shared }}/native/lora.yml"
          vars:
            hint: 'LoRAs add specialized styles, concepts, or characters to MiniMax-H3-Image. Multiple LoRAs can be combined. 0.5-0.8 is recommended for most LoRAs, 1.0 = full effect. Use LoRAs trained for MiniMax-H3-Image: a MiniMax-H3 video LoRA loads, but its audio and video-only layers are skipped and the run log says how many keys did not match.'
            placeholder: Select a MiniMax-H3-Image LoRA...
            max_items: 10
            strength_min: -2.0
            strength_max: 2.0
            strength_step: 0.05
      - type: "tab"
        anchor: "advanced"
        label: "Advanced"
        audience: "advanced"
        configuration:
          icon: "settings"
          icon_display: "icon_only"
        children: "{{ paths.preset }}/modes/txt2img/tabs/advanced.yml"
