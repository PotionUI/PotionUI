fields:
  - type: "group"
    label: "Sampler Settings"
    children:
      - type: "row"
        children:
          - name: "steps"
            type: "slider"
            label: "Steps"
            configuration:
              min: 1
              max: 50
              step: 1
            default: 8

          - name: "cfg"
            type: "slider"
            label: "CFG Scale"
            configuration:
              min: 1.0
              max: 10.0
              step: 0.1
            default: 1.0

      - type: "row"
        children:
          - name: "sampler_name"
            type: "select"
            label: "Sampler"
            configuration:
              file: { path: "{{ paths._shared }}/comfyui/form/samplers/all.yml" }
            default: "euler"

          - name: "scheduler"
            type: "select"
            label: "Scheduler"
            configuration:
              file: { path: "{{ paths._shared }}/comfyui/form/schedulers/all.yml" }
            default: "simple"

      - name: "shift"
        type: "slider"
        label: "Shift (ModelSampling)"
        configuration:
          min: 0
          max: 10.0
          step: 0.1
        default: 3.1
