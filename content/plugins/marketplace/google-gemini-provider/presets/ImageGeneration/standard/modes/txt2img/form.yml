name: "custom"
short_description: "Generate an image from a text prompt."
fields:
  - type: "tabs"
    children:
      - type: "tab"
        anchor: "image"
        label: "Generation"
        configuration: {icon: "generation", icon_display: "icon_only"}
        children: "{{ paths._shared }}/cloud/tabs/image.yml"
      - type: "tab"
        anchor: "provider_options"
        label: "Provider options"
        configuration: {icon: "settings", icon_display: "icon_only"}
        children: "{{ paths._shared }}/cloud/tabs/provider_options.yml"
