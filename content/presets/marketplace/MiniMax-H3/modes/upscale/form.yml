prompt_label: "Scene"
prompt_placeholder: "a rainy street at night"
name: "custom"
short_description: "Increase the resolution of a video."
fields:
  - type: "tabs"
    children:
      - type: "tab"
        anchor: "generation"
        label: "Generation"
        configuration: {icon: "generation", icon_display: "icon_only"}
        children: "{{ paths.preset }}/modes/upscale/tabs/generation.yml"
      - type: "tab"
        anchor: "references"
        label: "References"
        configuration: {icon: "image", icon_display: "icon_only"}
        children: "{{ paths.preset }}/modes/upscale/tabs/references.yml"
      - type: "tab"
        anchor: "lora"
        label: "LoRA"
        configuration: {icon: "lora", icon_display: "icon_only"}
        children: "{{ paths.preset }}/modes/upscale/tabs/lora.yml"
      - type: "tab"
        anchor: "advanced"
        label: "Advanced"
        audience: "advanced"
        configuration: {icon: "settings", icon_display: "icon_only"}
        children: "{{ paths.preset }}/modes/upscale/tabs/advanced.yml"
