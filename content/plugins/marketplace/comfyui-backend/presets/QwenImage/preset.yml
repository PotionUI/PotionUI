########
## QwenImage Text-to-Image Preset Configuration
########
schema: 1
id: "01K4TDMABXKD1RR4CGBM51QWEN"
name: "QwenImage"
category: "image"
version: "1.0.1"
engine: "comfyui"

# Admin-set values (Admin -> Presets -> Configuration). Model pickers reference
# these via `filter_tags: "@config:<key>"`; unset = no filtering (all models shown).
configuration:
  checkpoint_tags:
    type: "model_tags"
    label: "Checkpoint tags"
    description: "Only models with any of these tags appear in the Checkpoint picker."
  clip_tags:
    type: "model_tags"
    label: "Text encoder tags"
    description: "Only models with any of these tags appear in the Text Encoder picker."
  vae_tags:
    type: "model_tags"
    label: "VAE tags"
    description: "Only models with any of these tags appear in the VAE picker."
  lora_tags:
    type: "model_tags"
    label: "LoRA tags"
    description: "Only LoRAs with any of these tags appear in the LoRA picker."

# QwenImage-specific variables
vars:
  # Model configuration
  model_base: "TRANSFORMER"

  # Generation defaults
  default_steps: 8
  default_cfg: 1.0
  default_shift: 3.1
  default_sampler: "euler"
  default_scheduler: "simple"

  # The workflow's base model-loader node the rebuilt LoRA chain (see
  # node_manipulations in each mode's pipeline.yml) starts from when no LoRA
  # is selected, or chains onto as node 0 when one is. Per-mode: txt2img and
  # img2img ship different workflow graphs with different node ids.
  lora_chain_base_node:
    txt2img: "37"
    img2img: "91:12"

modes:
  - txt2img
  - img2img
