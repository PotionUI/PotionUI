id: "system-monitor"
name: "System Monitor"
version: "1.0.0"
description: "Real-time system resource monitoring (GPU, RAM, CPU) in the sidebar"
author: "PotionUI Team"
type: "frontend-only"
category: "monitoring"

capabilities:
  - "system-monitoring"
  - "sidebar-widget-provider"

sidebar_widgets:
  - id: "system-monitor"
    position: "bottom"
    component: "SystemMonitorWidget.js"
    order: 10
    label: "System Monitor"
    require_role: "ADMIN"
    role_setting: "visible_to"

settings:
  - name: "visible_to"
    type: "select"
    label: "Visible to"
    description: "Who sees the sidebar monitor and may read live system statistics"
    default: "admins"
    options:
      - value: "admins"
        label: "Admins only"
      - value: "everyone"
        label: "Everyone"
