# media_loader (pictures) -> model_loader/minimax_h3_image -> prompt_encoder -> seed_generator
#   -> dynamic_prompts_renderer -> from_iotype -> param_emitter -> generator/minimax_h3_image -> gallery
#
# The pictures are read twice, in the same order: the text encoder sees each one
# as "Picture n: " plus its vision tokens at a 1024-pixel short edge, and the
# generator VAE-encodes each one at a 1024-2048 short edge into reference rows
# ahead of the image being generated. Picture 1 is the image being edited.
pipeline:
  - name: "media_loader"
    id: "references"
    enabled: "{{ (form.references | default([], true) | media_of_kind('image') | length) > 0 }}"
    configuration:
      media:
        "@loop":
          items: "{{ form.references | default([], true) | media_of_kind('image') }}"
          template:
            type: "image"
            path: "{{ item.path | default(item) }}"

  - name: "model_loader/minimax_h3_image"
    enabled: true
    configuration:
      diffusion_model: { file_path: "{{ form.diffusion_model }}", name: "{{ form.diffusion_model }}" }
      text_encoder: { file_path: "{{ form.text_encoder }}", name: "{{ form.text_encoder }}" }
      vae: { file_path: "{{ form.vae }}", name: "{{ form.vae }}" }

  - name: "prompt_encoder"
    input:
      - ["text_encoder", "model_loader/minimax_h3_image", "text_encoder"]
      - ["image", "references", "image"]
    enabled: true
    configuration:
      p_prompt:
        input: "{{ generation.prompts.first.positive }}"
        output: "{{ generation.prompts.first.positive }}"
      pairs: "{{ generation.prompts.pairs }}"
      quantity: "{{ form.quantity }}"
      guidance_scale: 1.0

  - name: "seed_generator"
    enabled: true
    configuration:
      seed: "{{ form.seed }}"
      quantity: "{{ form.quantity }}"

  - name: "dynamic_prompts_renderer"
    id: "dynamic_prompts_renderer"
    enabled: true
    configuration:
      pairs: "{{ generation.prompts.pairs }}"
      quantity: "{{ form.quantity }}"

  - name: "from_iotype"
    id: "from_iotype"
    enabled: true
    input:
      - ["seed", "seed_generator", "seed"]
    configuration:
      from: "seed"

  - name: "param_emitter"
    id: "param_emitter"
    enabled: true
    input:
      - ["seed", "from_iotype", "seed"]
    configuration:
      quantity: "{{ form.quantity }}"
      parameters:
        - ["model", "{{ form.diffusion_model }}"]
        - ["model", "{{ form.text_encoder }}"]
        - ["model", "{{ form.vae }}"]
        - ["positive_prompt", "{{ generation.prompts.positives }}"]
        - ["steps", "{{ preset.vars.steps }}"]
        - ["sampler", "euler"]
        - ["schedule", "h3_image_pdd"]
        - ["resolution", "{{ 'auto' if form.match_picture_1 else form.resolution }}"]

  - name: "generator/minimax_h3_image"
    input:
      - ["model", "model_loader/minimax_h3_image", "model"]
      - ["conditioning", "prompt_encoder", "conditioning"]
      - ["seed", "seed_generator", "seed"]
      - ["reference_images", "references", "image"]
    enabled: true
    configuration:
      mode: "edit"
      steps: "{{ preset.vars.steps }}"
      resolution: "{{ 'auto' if form.match_picture_1 else form.resolution }}"
      quantity: "{{ form.quantity }}"
      preview: "{{ form.preview }}"

  - name: "gallery"
    input:
      - ["image", "generator/minimax_h3_image", "image"]
      - ["seed", "seed_generator", "seed"]
    enabled: true
