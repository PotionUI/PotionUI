########
## Setup recipe: Z-Image on the native engine
##
## See src/features/recipes/schema.py for the schema this file is
## validated against (scripts/recipe_lint.py) and
## src/features/recipes/executors/ for what each step kind actually does.
########
schema_version: 1
id: "zimage-starter"
version: 2
name: "Z-Image Starter"
engine: "native"
category: "image"
summary: "Get a working Z-Image setup on your local GPU and produce a first image."
blurb: "Makes sharp, detailed pictures quickly."
first_run: true
description: >
  Installs the bundled Z-Image preset on the native (in-process) engine,
  makes sure its three model files are available, and proves the pipeline is
  wired up correctly before handing you a ready-to-use preset. Z-Image is
  the smallest native-engine diffusion transformer PotionUI ships (see
  docs/models/z_image.md) - its turbo checkpoint runs in 8 distilled steps,
  making it a fast first pick if you're short on VRAM. The three files
  together are a real download (~19 GB, mostly the full-precision text
  encoder), but the checkpoint itself is comfortably the smallest of the
  native DiT families.

plugins:
  - id: "huggingface-provider"
    reason: >
      Resolves the diffusion model, text encoder and VAE from HuggingFace
      (Comfy-Org's official split-file release of Z-Image Turbo) by exact
      repo path. HuggingFace has no hash-lookup API, so each artifact below
      names its file explicitly; the sha256 in each artifact's checksum
      still verifies the download afterwards.

backend:
  engine: "native"

artifacts: []
presets:
  - preset_id: "01KX5GS4P8HHCB63FY8SA7QSBH"
    path_hint: "marketplace/ZImage"
    assign_to_owner: true

smoke:
  preset_id: "01KX5GS4P8HHCB63FY8SA7QSBH"
  mode: "txt2img"
  prompt: "a small wooden sailboat on a calm blue lake"
  seed: 12345
  # Matches content/presets/marketplace/ZImage/tests.yml's own fast smoke
  # case verbatim (a real maintainer txt2img session): the distilled turbo
  # checkpoint's 8-step/cfg-1.0 operating point, smallest square resolution.
  form:
    speed_profile: "turbo"
    resolution: "1024x1024"
    steps: 8
    cfg: 1
    sampler: "euler"
    shift: 3.1

steps:
  - key: "plugins.ensure"
    kind: "plugins.ensure"
    title: "Enable required plugins"
    params:
      # huggingface-provider is needed so the download step can resolve each
      # artifact's exact repo file.
      plugin_ids: ["huggingface-provider"]

  - key: "backend.ensure"
    kind: "backend.ensure"
    title: "Prepare the native backend"
    params:
      engine: "native"

  # Index BEFORE planning downloads: on a fresh instance nothing is indexed
  # yet, so without this pass artifacts.plan cannot see files the user
  # already has and would ask to download them (caught live in the Docker
  # sandbox, where nothing pre-indexes the mounted models directory).
  - key: "models.index"
    kind: "models.index"
    title: "Find models you already have"
    params:
      engine: "native"

  - key: "modes.plan"
    kind: "modes.plan"
    title: "Pick modes and review downloads"
    params:
      preset_id: "01KX5GS4P8HHCB63FY8SA7QSBH"
      modes: "all"
      selected: ["txt2img"]
      locked: ["txt2img"]
      extras: "offer"

  - key: "artifacts.fetch"
    kind: "artifacts.fetch"
    title: "Download the files"
    params:
      plan: "modes.plan"

  - key: "models.index.downloads"
    kind: "models.index"
    title: "Register downloaded models"
    params:
      engine: "native"

  - key: "preset.ensure"
    kind: "preset.ensure"
    title: "Install and assign the Z-Image preset"
    params:
      preset_id: "01KX5GS4P8HHCB63FY8SA7QSBH"

  - key: "preset.defaults"
    kind: "preset.defaults"
    title: "Use the downloaded files by default"
    params:
      plan: "modes.plan"

  - key: "pipeline.render"
    kind: "pipeline.render"
    title: "Validate the pipeline"
    params:
      preset_id: "01KX5GS4P8HHCB63FY8SA7QSBH"
      plan: "modes.plan"

  - key: "generation.smoke"
    kind: "generation.smoke"
    title: "Run a first real generation"
    params:
      preset_id: "01KX5GS4P8HHCB63FY8SA7QSBH"
      mode: "txt2img"

  - key: "workspace.activate"
    kind: "workspace.activate"
    title: "Finish onboarding"
    # Only meaningful during the first-run wizard - a run started from
    # Admin -> Recipes skips it.
    onboarding_only: true
    params: {}
