fields:
  - type: "section"
    label: "Detection"
    formula: "detailer"
    children:
      - name: "fix_confidence"
        type: "slider"
        label: "Detection confidence"
        default: 0.3
        ai_hint: "How sure the finder must be before it repaints something. Lower finds more, including false hits."
        configuration: { min: 0.1, max: 1.0, step: 0.05 }

      - name: "fix_padding"
        type: "slider"
        label: "Area around it"
        default: 32
        ai_hint: "Pixels of surroundings repainted with each face or hand so the blend is smooth."
        configuration: { min: 0, max: 200, step: 8 }

      - name: "fix_mask_blur"
        type: "slider"
        label: "Edge blend"
        default: 4
        configuration: { min: 0, max: 20, step: 1 }

      - name: "hand_prompt"
        type: "string"
        label: "Hand description"
        default: "detailed hands, five fingers, best quality"
        ai_hint: "What the hands are repainted with, used instead of the main prompt, which describes the face."
        reactions:
          - when: { field: "fix_target", equals: "faces" }
            then: { set_visibility: false }
          - when: { field: "fix_target", not_equals: "faces" }
            then: { set_visibility: true }

  - type: "section"
    label: "Sampling"
    formula: "speed"
    children:
      - name: "steps"
        type: "slider"
        label: "Steps"
        default: 24
        configuration: { min: 1, max: 50, step: 1 }

      - name: "cfg"
        type: "slider"
        label: "CFG Scale"
        default: 5
        configuration: { min: 1, max: 30, step: 0.5 }

      - name: "clip_skip"
        type: "slider"
        label: "Clip Skip"
        default: 2
        configuration: { min: 0, max: 12, step: 1 }

      - type: "row"
        children:
          - name: "sampler"
            type: "select"
            label: "Sampler"
            default: "DPMPP_2M"
            configuration:
              options:
                - { label: "EULER", value: "EULER" }
                - { label: "EULER_A", value: "EULER_A" }
                - { label: "HEUN", value: "HEUN" }
                - { label: "DPM2", value: "DPM2" }
                - { label: "DPM2_A", value: "DPM2_A" }
                - { label: "LMS", value: "LMS" }
                - { label: "DPMPP_2S_A", value: "DPMPP_2S_A" }
                - { label: "DPMPP_SDE", value: "DPMPP_SDE" }
                - { label: "DPMPP_2M", value: "DPMPP_2M" }
                - { label: "DPMPP_2M_SDE", value: "DPMPP_2M_SDE" }
                - { label: "DPMPP_3M_SDE", value: "DPMPP_3M_SDE" }

          - name: "scheduler"
            type: "select"
            label: "Scheduler"
            default: "karras"
            configuration:
              options:
                - { label: "Normal", value: "normal" }
                - { label: "Karras", value: "karras" }
                - { label: "Exponential", value: "exponential" }
                - { label: "SGM Uniform", value: "sgm_uniform" }
                - { label: "Simple", value: "simple" }
                - { label: "DDIM Uniform", value: "ddim_uniform" }
