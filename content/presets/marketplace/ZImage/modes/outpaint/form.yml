name: "custom"
mode_label: "Outpaint"
short_description: "Extend a picture past its edges."
prompt: "optional"
prompt_label: "What continues beyond the edge"
prompt_placeholder: "more of the sandy beach and a pale sky"
fields:
  - type: "tabs"
    children:
      - type: "tab"
        label: "Generation"
        configuration:
          icon: "generation"
          icon_display: "icon_only"
        children: "{{ paths.preset }}/modes/outpaint/tabs/generation.yml"
      - type: "tab"
        label: "Image"
        configuration:
          icon: "image"
          icon_display: "icon_only"
        children: "{{ paths.preset }}/modes/outpaint/tabs/image.yml"
      - type: "tab"
        label: "LoRA"
        configuration:
          icon: "lora"
          icon_display: "icon_only"
        children: "{{ paths._shared }}/tabs/lora.yml"
      - type: "tab"
        label: "Advanced"
        audience: "advanced"
        configuration:
          icon: "settings"
          icon_display: "icon_only"
        children: "{{ paths.preset }}/modes/txt2img/tabs/advanced.yml"
