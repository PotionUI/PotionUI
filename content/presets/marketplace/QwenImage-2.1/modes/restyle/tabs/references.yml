fields:
  - type: "section"
    label: "Image"
    children:
      - name: "source_image"
        type: "image"
        label: "Image"
        required: true
        ai_hint: "The image to restyle. The result follows its size and aspect ratio at about 1 megapixel."

  - type: "section"
    label: "Task"
    children:
      - name: "restyle_task"
        type: "select"
        label: "Task"
        default: "style"
        ai_hint: "What to do with the image. Each task builds the instruction from the prompt: Style: 'Restyle the whole image as <prompt>. Keep the composition, subjects and layout unchanged.' Background: 'Replace the background with <prompt>. Keep the subject, its pose and its lighting unchanged.' Lighting: 'Change the lighting to <prompt>. Keep the composition, subjects and colours of objects unchanged.' Colourise: 'Colourise this black and white photo with natural, realistic colours.' Photo: 'Turn this image into a realistic photograph. It shows <prompt>. Keep the composition, subjects, layout and colours unchanged.' Restore: 'Restore this old photo: remove scratches, dust and fading, repair damage and sharpen detail, keeping the people and scene exactly as they are.' The prompt is required for Style, Background and Lighting: short and concrete, a style (watercolour painting, 1980s film still), a background (a white studio, a beach at sunset) or a light (golden hour, soft overcast). For Photo, Colourise and Restore it is optional and, when given, is added as 'Details: <prompt>.'"
        configuration:
          options:
            - { label: "Style", value: "style", sub_label: "Repaint the whole image in another look" }
            - { label: "Background", value: "background", sub_label: "Swap the background, keep the subject" }
            - { label: "Lighting", value: "lighting", sub_label: "Change the light or time of day" }
            - { label: "Colourise", value: "colourise", sub_label: "Add colour to a black and white photo" }
            - { label: "Photo", value: "photo", sub_label: "Turn a drawing or render into a photo" }
            - { label: "Restore", value: "restore", sub_label: "Repair an old or damaged photo" }
