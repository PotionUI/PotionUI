fields:
  - name: "speed_profile"
    type: "select"
    formula: "speed"
    label: "Speed profile"
    default: "distilled"
    ai_hint: >-
      FastH3 8-Step V2 is DMD2-distilled for exactly 8 steps -- there is no
      quality/turbo choice to make here the way the base MiniMax-H3 preset
      offers. The Steps slider on the Advanced tab reflects this and stays
      locked at 8.
    configuration:
      options:
        - { label: "Distilled", value: "distilled", sub_label: "8 steps · fixed by the checkpoint" }

  - type: "section"
    label: "Video"
    children:
      - type: "row"
        children:
          - name: "seed"
            type: "seed"
            label: "Seed"
            default: -1
            width: "3/5"

          - name: "quantity"
            type: "stepper"
            label: "Quantity"
            default: 1
            configuration: {min: 1, max: 4, step: 1}
            width: "2/5"
            full_width: true

      - name: "resolution"
        type: "resolution"
        formula: "size"
        label: "Resolution"
        ai_hint: "Both axes must be multiples of 32, aspect ratio between 1:4 and 4:1 -- the same sizes as the base MiniMax-H3 preset. The native canvas (768 short edge, 768x1344 max) is what FastVideo trained and released the FastH3 8-Step V2 recipe on; the faster sizes trade quality for speed. Area is the dominant cost."
        configuration:
          files:
            - { path: "{{ paths.preset }}/files/form/resolutions_canvas.yml", group: "Native canvas (768 short edge)" }
            - { path: "{{ paths._shared }}/resolutions/minimax_h3_fast.yml", group: "Faster (below native canvas)" }
        default: "1344x768"

  - type: "section"
    label: "Models"
    formula: "models"
    children:
      - name: "model"
        type: "model"
        label: "MiniMax-H3-Fast DiT"
        required: true
        ai_hint: "Must be the FastVideo FastH3 8-Step V2 repack (filenames start `fastvideo_fasth3_8step_v2_`), NOT the base MiniMax-H3 checkpoint -- both are the same 50-block architecture and key set, so nothing here can detect a mismatch; a base checkpoint loads without complaint and simply isn't distilled for 8 steps. Tag your FastH3 files distinctly from the base preset's (e.g. a 'minimax-h3-fast' model tag) so this preset's Checkpoint tags configuration can scope the picker to just them."
        configuration:
          model_type: "diffusion_model"
          placeholder: "fastvideo_fasth3_8step_v2_pruned..."
          filter_tags: "@config:checkpoint_tags"
          recommendations:
            - name: "fastvideo_fasth3_8step_v2_pruned_int8_convrot.safetensors"
              link: "https://huggingface.co/FastVideo/FastVideo-FastH3-Comfy/resolve/main/diffusion_models/fastvideo_fasth3_8step_v2_pruned_int8_convrot.safetensors"
              size: "20.61 GB"
              sha256: "0922785978dc9bfe1adf27d8b291b0ca763f9f165f882e6cb297c72fbb6deda8"
              description: "FastH3 8-Step V2, pruned + int8 ConvRot - the practical local checkpoint, no fp8 hardware needed."
            - name: "fastvideo_fasth3_8step_v2_pruned_bf16.safetensors"
              link: "https://huggingface.co/FastVideo/FastVideo-FastH3-Comfy/resolve/main/diffusion_models/fastvideo_fasth3_8step_v2_pruned_bf16.safetensors"
              size: "41.05 GB"
              sha256: "d44a963fc56784dc38696a40680e6aa17c6b221e80a32f01d33f9a3ccc3a2ebd"
              description: "FastH3 8-Step V2, pruned bf16 reference."

      - name: "text_encoder"
        type: "model"
        label: "Text Encoder (Qwen3-VL-32B)"
        required: true
        ai_hint: "Identical files to the base MiniMax-H3 preset's text encoder -- FastH3 reuses the same Qwen3-VL-32B conditioning stack unchanged."
        configuration:
          model_type: "text_encoder"
          placeholder: "Select the Qwen3-VL-32B encoder..."
          filter_tags: "@config:text_encoder_tags"
          recommendations:
            - name: "qwen3vl_32b_minimax_h3_nvfp4_awq.safetensors"
              link: "https://huggingface.co/Comfy-Org/MiniMax-H3/resolve/main/text_encoders/qwen3vl_32b_minimax_h3_nvfp4_awq.safetensors"
              size: "14.61 GB"
              sha256: "35a88d51044231fe332301d7a62aa81e3f2cba62febeb446e2c1e3e0ef76f2c6"
              description: "Qwen3-VL-32B encoder, nvfp4 AWQ - a third of bf16; the only tier that fits most cards."
            - name: "qwen3vl_32b_minimax_h3_int8_convrot.safetensors"
              link: "https://huggingface.co/Comfy-Org/MiniMax-H3/resolve/main/text_encoders/qwen3vl_32b_minimax_h3_int8_convrot.safetensors"
              size: "25.28 GB"
              sha256: "bc2ced0fbea64757fa9acddccfc0b3f4819d1dcf1da6c124d690d368be283923"
              description: "Qwen3-VL-32B encoder, int8 ConvRot - middle tier, no Blackwell requirement."
            - name: "qwen3vl_32b_minimax_h3_bf16.safetensors"
              link: "https://huggingface.co/Comfy-Org/MiniMax-H3/resolve/main/text_encoders/qwen3vl_32b_minimax_h3_bf16.safetensors"
              size: "47.97 GB"
              sha256: "600d567f6a9629c8574e8e7041b199bdd9c59a986afa7906910a81919610607d"
              description: "Qwen3-VL-32B encoder, full bf16 reference."

      - name: "video_vae"
        type: "model"
        label: "Video VAE"
        required: true
        ai_hint: "Identical file to the base MiniMax-H3 preset's video VAE."
        configuration:
          model_type: "vae"
          placeholder: "minimax_h3_video_vae..."
          filter_tags: "@config:vae_tags"
          recommendations:
            - name: "minimax_h3_video_vae_fp16.safetensors"
              link: "https://huggingface.co/Comfy-Org/MiniMax-H3/resolve/main/vae/minimax_h3_video_vae_fp16.safetensors"
              size: "4.85 GB"
              sha256: "7c1f131492e7eddacaac9069a61b81bdd39de5cc96561e677c5eab1cdce5e522"
              description: "MiniMax-H3 video VAE, fp16."

      - name: "audio_vae"
        type: "model"
        label: "Audio VAE"
        required: true
        ai_hint: "Identical file to the base MiniMax-H3 preset's audio VAE - required for the audio track."
        configuration:
          model_type: "vae"
          placeholder: "minimax_h3_audio_vae..."
          filter_tags: "@config:vae_tags"
          recommendations:
            - name: "minimax_h3_audio_vae_fp32.safetensors"
              link: "https://huggingface.co/Comfy-Org/MiniMax-H3/resolve/main/vae/minimax_h3_audio_vae_fp32.safetensors"
              size: "577.2 MB"
              sha256: "8e505d95dd1561d47abd43d4238fd40d9bb1ae9e147ed0a4cba778d76ae4db48"
              description: "MiniMax-H3 audio VAE, fp32 - required for the audio track."

      - name: "preview_decoder"
        type: "model"
        label: "Preview decoder"
        required: false
        ai_hint: "Optional tiny decoder that turns the live preview into a true-colour frame from the middle of the clip. Leave empty to keep the fast latent colour projection."
        reactions:
          - when: { field: "preview", equals: false }
            then: { set_visibility: false }
          - when: { field: "preview", equals: true }
            then: { set_visibility: true }
        configuration:
          model_type: "preview_decoder"
          placeholder: "Select taeh3.safetensors..."
          recommendations:
            - name: "taeh3.safetensors"
              link: "https://raw.githubusercontent.com/madebyollin/taehv/62f7591f59dfbb4c3c02b7a621d180a9eeaba26c/safetensors/taeh3.safetensors"
              size: "21.66 MB"
              sha256: "4fd022bfcab08772fe0536b17ea1a3bbb5625be11e397868d1c5d891863d4c13"
              description: "MiniMax-H3 true-colour live preview decoder (MIT)."
