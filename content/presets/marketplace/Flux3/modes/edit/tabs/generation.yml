            - name: "flux3-image-klein-base-int8-convrot.safetensors"
              provider: "huggingface"
              ref: '{"repo": "black-forest-labs/flux-3-image-klein-comfy", "file": "diffusion_models/flux3-image-klein-base-int8-convrot.safetensors", "revision": "main"}'
              size: "5.41 GB"
              size_bytes: 5807427339
              precision: "int8"
              sha256: "8949ecfc1bf3871b08be02cf43ec7276a4914e1a86eade6b5eb8f4204426bc92"
              gated: true
