pipeline:
  - name: "model_loader/flux"
    enabled: true
    configuration:
      diffusion_model:
        file_path: "{{ form.diffusion_model }}"
        name: "{{ form.diffusion_model }}"
      text_encoder:
        file_path: "{{ form.text_encoder }}"
        name: "{{ form.text_encoder }}"
      clip_l:
        file_path: "{{ form.clip_l }}"
        name: "{{ form.clip_l }}"
      vae:
        file_path: "{{ form.vae }}"
        name: "{{ form.vae }}"
      loras:
        "@loop":
          items: "{{ form.loras }}"
          template:
            file_path: "{{ item.model }}"
            weight: "{{ item.strength }}"

  - name: "media_loader"
    id: "media_loader"
    enabled: true
    configuration:
      media:
        - type: "image"
          path: "{{ form.source_image }}"

  - name: "prompt_encoder"
    input:
      - ["text_encoder", "model_loader/flux", "text_encoder"]
    enabled: true
    configuration:
      p_prompt:
        input: "{{ generation.prompts.first.positive }}"
        output: "{% set p = generation.prompts.first.positive | text_or('') %}{% if p %}{{ p }}, {% endif %}detailed face, detailed eyes, best quality"
      n_prompt:
        input: "{{ generation.prompts.first.negative }}"
        output: "{{ generation.prompts.first.negative }}"
      quantity: 1
      guidance_scale: 1.0
      negative_applied: "{{ generation.negative_applied }}"

  - name: "seed_generator"
    enabled: true
    configuration:
      seed: "{{ form.seed }}"
      quantity: 1

  - name: "dynamic_prompts_renderer"
    id: "dynamic_prompts_renderer"
    enabled: true
    configuration:
      pairs: "{{ generation.prompts.pairs }}"
      quantity: 1

  - name: "from_iotype"
    id: "from_iotype"
    enabled: true
    input:
      - ["seed", "seed_generator", "seed"]
    configuration:
      from: "seed"

  - name: "param_emitter"
    id: "param_emitter"
    enabled: true
    input:
      - ["seed", "from_iotype", "seed"]
    configuration:
      quantity: 1
      parameters:
        - ["model", "{{ form.diffusion_model }}"]
        - ["model", "{{ form.text_encoder }}"]
        - ["model", "{{ form.vae }}"]
        - ["model", "{{ form.clip_l }}"]
        - "@loop":
            items: "{{ form.loras | active_loras }}"
            template: ["model", "{{ item.model }}"]
        - ["positive_prompt", "{{ generation.prompts.positives }}"]
        - ["negative_prompt", "{{ generation.prompts.negatives }}"]
        - ["cfg", "{{ form.guidance }}"]
        - ["steps", "{{ form.fix_steps }}"]
        - ["fix_strength", "{{ form.fix_strength }}"]
        - ["fix_hands", "{{ form.face_detailer_hands }}"]

  - name: "detailer/native"
    id: "face_detailer"
    enabled: true
    input:
      - ["model", "model_loader/flux", "model"]
      - ["conditioning", "prompt_encoder", "conditioning"]
      - ["seed", "seed_generator", "seed"]
      - ["image", "media_loader", "image"]
    configuration:
      denoise: "{{ form.fix_strength }}"
      steps: "{{ form.fix_steps }}"
      guidance: "{{ form.guidance }}"
      sampler: "euler"
      max_faces: "{{ form.fix_max_faces }}"
      detection_confidence: "{{ form.fix_confidence }}"
      detection_backend: "mediapipe"
      face_model: "{{ form.face_model }}"
      detect_hands: "{{ form.face_detailer_hands }}"
      hand_model: "{{ form.face_detailer_hand_model }}"
      loras_mode: "keep"
      run_loras:
        "@loop":
          items: "{{ form.loras }}"
          template:
            file_path: "{{ item.model }}"
            weight: "{{ item.strength }}"

  - name: "gallery"
    input:
      - ["image", "face_detailer", "image"]
      - ["seed", "seed_generator", "seed"]
    enabled: true
