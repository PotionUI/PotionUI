# Pipeline for the 'interpolate' mode.
#
#   media_loader -> param_emitter -> interpolator/rife -> gallery
#
# RIFE is deterministic frame synthesis: no text encoder, no denoise loop, no
# seed -- so there is no prompt_encoder or seed_generator pipe. Output fps =
# source fps * factor (N source frames -> N*factor output frames), the duration
# is preserved, and the source audio is muxed back when keep_audio.
pipeline:
  #############
  ## Media Loader - Load the source video from the form file path
  #############
  - name: "media_loader"
    id: "media_loader"
    enabled: true
    configuration:
      validate_files: true
      max_file_size: 524288000  # 500MB
      auto_detect_type: true
      media:
        - type: "video"
          path: "{{ form.input_video }}"

  #############
  ## Parameter Emitter - record the run's settings on the generation
  #############
  - name: "param_emitter"
    id: "param_emitter"
    enabled: true
    configuration:
      quantity: 1
      parameters:
        - ["model", "{{ form.model }}"]
        - ["factor", "{{ form.factor | default(2) }}"]
        - ["flow_scale", "{{ form.flow_scale | default(1.0) }}"]
        - ["keep_audio", "{{ form.keep_audio | default(true) }}"]

  #############
  ## Interpolator - RIFE 4.x frame interpolation (streaming, frame pair at a time)
  #############
  - name: "interpolator/rife"
    id: "interpolator"
    input:
      - ["video", "media_loader", "video"]
    enabled: true
    configuration:
      model:
        file_path: "{{ form.model }}"
        name: "{{ form.model }}"
      factor: "{{ form.factor | default(2) }}"
      flow_scale: "{{ form.flow_scale | default(1.0) }}"
      keep_audio: "{{ form.keep_audio | default(true) }}"

  #############
  ## Gallery - Save the interpolated video
  #############
  - name: "gallery"
    id: "gallery"
    input:
      - ["video", "interpolator", "video"]
    enabled: true
    configuration:
      support_video: true
