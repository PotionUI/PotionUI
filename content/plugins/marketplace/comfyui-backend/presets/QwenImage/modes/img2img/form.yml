name: "custom"
fields:
  - type: "tabs"
    children:
      - type: "tab"
        label: "Generation"
        configuration:
          icon: "model"
          icon_display: "icon_only"
        children: "{{ paths.preset }}/modes/img2img/tabs/generation.yml"

      - type: "tab"
        label: "References"
        configuration:
          icon: "image"
          icon_display: "icon_only"
        children: "{{ paths.preset }}/modes/img2img/tabs/reference_images.yml"

      - type: "tab"
        label: "LoRA"
        configuration:
          icon: "lora"
          icon_display: "icon_only"
        children: "{{ paths.preset }}/modes/img2img/tabs/lora.yml"

      - type: "tab"
        label: "Advanced"
        configuration:
          icon: "settings"
          icon_display: "icon_only"
        children: "{{ paths.preset }}/modes/img2img/tabs/advanced.yml"

      - type: "tab"
        label: "About"
        configuration:
          icon: "information-circle"
          icon_display: "icon_only"
        children: "{{ paths.preset }}/modes/img2img/tabs/about.yml"
