prompt_label: "New scene"
prompt_placeholder: "a snowy mountain village at dawn, soft light"
name: "custom"
mode_label: "Follow motion"
short_description: "Put a new scene through the camera moves and layout of a video."
negative_prompt:
  applies_when:
    logic: "OR"
    conditions:
      - { field: "cfg", greater_than: 1 }
      - { field: "refine_cfg", greater_than: 1 }
requirements:
  - type: "model"
    filename: "ltx-2.3-22b-ic-lora-union-control-ref0.5.safetensors"
    hint: "Download the Union-Control LoRA in this mode."
fields:
  - type: "tabs"
    children:
      - type: "tab"
        label: "Generation"
        configuration:
          icon: "generation"
          icon_display: "icon_only"
        children: "{{ paths.preset }}/modes/motion_transfer/tabs/generation.yml"
      - type: "tab"
        label: "References"
        configuration:
          icon: "image"
          icon_display: "icon_only"
        children: "{{ paths.preset }}/modes/follow_motion/tabs/references.yml"
      - type: "tab"
        label: "LoRA"
        configuration:
          icon: "lora"
          icon_display: "icon_only"
        children: "{{ paths.preset }}/modes/video/tabs/lora.yml"
      - type: "tab"
        label: "Advanced"
        audience: "advanced"
        configuration:
          icon: "settings"
          icon_display: "icon_only"
        children: "{{ paths.preset }}/modes/follow_motion/tabs/advanced.yml"
