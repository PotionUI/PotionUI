fields:
  - name: "photo_trigger"
    type: "textbox"
    label: "Trigger phrase"
    audience: "advanced"
    default: "transform the image to realistic photograph"
    ai_hint: "Placed at the start of the instruction. The LoRA was trained on this exact phrase; change it only for a LoRA that documents another."

  - name: "steps"
    type: "slider"
    label: "Steps"
    audience: "advanced"
    default: 8
    configuration: {min: 1, max: 30, step: 1}
    ai_hint: "The LoRA is tuned for Krea-2 Turbo at 8 to 10 steps and CFG 1."
