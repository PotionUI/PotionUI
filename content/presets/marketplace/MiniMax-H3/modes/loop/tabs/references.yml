fields:
  - name: "start_picture"
    type: "image"
    label: "Start picture"
    description: "Optional. Water, waves, rain, snow or swaying grass loop best; clouds drifting one way may snap back."
    ai_hint: "The picture the loop is made from; its look, colours and framing are kept. The loop begins a moment after the picture, once it is moving, so the wrap never eases into a still. Leave it empty to make the scene from the prompt alone. Pictures whose motion renews or stays in place loop cleanly (flowing or falling water, waves, rain, snow, fire, steam, grass or leaves swaying); something large that slowly travels one way (drifting clouds, a moving shadow or patch of light, a boat crossing) has to be pulled back for the loop to close and can visibly snap back."
