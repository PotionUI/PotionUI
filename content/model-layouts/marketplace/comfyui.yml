schema: 1
id: comfyui
label: ComfyUI
priority: 60
sources:
  - {title: "folder_paths.py:15-43 model folders, :111-114 map_legacy", url: "https://github.com/comfyanonymous/ComfyUI/blob/fb2315f11db0ebfaafa9099a5df5227dc6bb42bc/folder_paths.py"}
  - {title: "main.py:142-148 loads extra_model_paths.yaml next to main.py", url: "https://github.com/comfyanonymous/ComfyUI/blob/fb2315f11db0ebfaafa9099a5df5227dc6bb42bc/main.py"}
  - {title: "utils/extra_config.py:6-34 base_path, is_default and multi-line values", url: "https://github.com/comfyanonymous/ComfyUI/blob/fb2315f11db0ebfaafa9099a5df5227dc6bb42bc/utils/extra_config.py"}
  - {title: "Impact Subpack ultralytics/bbox and ultralytics/segm", url: "https://github.com/ltdrdata/ComfyUI-Impact-Subpack/blob/main/modules/subpack_nodes.py"}
install_dirs: [".", "ComfyUI"]
markers:
  - {path: folder_paths.py, kind: file, weight: 4}
  - {path: main.py, kind: file, weight: 1}
  - {path: comfy, kind: dir, weight: 2}
  - {path: comfy_extras, kind: dir, weight: 2}
  - {path: custom_nodes, kind: dir, weight: 1}
min_marker_score: 4
min_folder_evidence: 4
models_root: ["models"]
config_readers:
  - {kind: comfyui_extra_model_paths, file: extra_model_paths.yaml}
folders:
  - {path: checkpoints, model_type: checkpoint, key: checkpoints, write: true}
  - {path: diffusion_models, model_type: diffusion_model, key: diffusion_models, write: true, weight: 2}
  - {path: unet, model_type: diffusion_model, key: unet, scan_headers: true}
  - {path: text_encoders, model_type: text_encoder, key: text_encoders, write: true, weight: 2}
  - {path: clip, model_type: text_encoder, key: clip}
  - {path: loras, model_type: lora, key: loras, write: true}
  - {path: vae, model_type: vae, key: vae, write: true}
  - {path: embeddings, model_type: embedding, key: embeddings, write: true}
  - {path: upscale_models, model_type: upscaler, key: upscale_models, write: true, weight: 2}
  - {path: latent_upscale_models, model_type: upscaler, key: latent_upscale_models}
  - {path: controlnet, model_type: controlnet, key: controlnet, write: true}
  - {path: t2i_adapter, model_type: controlnet, key: t2i_adapter}
  - {path: ultralytics/bbox, model_type: detection_bbox, key: ultralytics_bbox, write: true, optional: true}
  - {path: ultralytics/segm, model_type: detection_segm, key: ultralytics_segm, write: true, optional: true}
