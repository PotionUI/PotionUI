pipeline:
  - name: "model_loader/z_image"
    enabled: true
    configuration:
      diffusion_model:
        file_path: "{{ form.diffusion_model }}"
        name: "{{ form.diffusion_model }}"
      text_encoder:
        file_path: "{{ form.text_encoder }}"
        name: "{{ form.text_encoder }}"
      vae:
        file_path: "{{ form.vae }}"
        name: "{{ form.vae }}"
      loras:
        "@loop":
          items: "{{ form.loras }}"
          template:
            file_path: "{{ item.model }}"
            weight: "{{ item.strength }}"

  - name: "media_loader"
    id: "media_loader"
    enabled: true
    configuration:
      media:
        - type: "image"
          path: "{{ form.source_image }}"

  - name: "media_loader"
    id: "mask_loader"
    enabled: "{{ (form.source_image_inpaint_mask | default('', true)) != '' }}"
    configuration:
      media:
        - type: "image"
          path: "{{ form.source_image_inpaint_mask | default('', true) }}"

  - name: "mask_preprocessor"
    id: "mask_preprocessor"
    enabled: "{{ (form.source_image_inpaint_mask | default('', true)) != '' }}"
    input:
      - ["mask", "mask_loader", "image"]
    configuration:
      dilate_iterations: "{{ form.mask_grow | default(4) }}"
      blur_radius: 0

  - name: "inpaint_region_crop"
    id: "inpaint_region_crop"
    enabled: "{{ (form.source_image_inpaint_mask | default('', true)) != '' }}"
    input:
      - ["image", "media_loader", "image"]
      - ["mask", "mask_preprocessor", "mask"]
    configuration:
      strategy: "scaled"
      context: "{{ form.region_context }}"
      multiple: 16
      whole_image_up_to: 2097152
      max_upscale: 1.5

  - name: "prompt_encoder"
    input:
      - ["text_encoder", "model_loader/z_image", "text_encoder"]
    enabled: true
    configuration:
      p_prompt:
        input: &inpaint_prompt "{{ (item.positive if item is defined else generation.prompts.first.positive) | text_or('the surroundings continued naturally, nothing added') }}"
        output: *inpaint_prompt
      n_prompt:
        input: "{{ generation.prompts.first.negative }}"
        output: "{{ generation.prompts.first.negative }}"
      pairs:
        "@loop":
          items: "{{ generation.prompts.pairs }}"
          template:
            positive: *inpaint_prompt
            negative: "{{ item.negative }}"
      quantity: "{{ form.quantity }}"
      guidance_scale: "{{ form.cfg | default(generation.profile.guidance) }}"
      negative_applied: "{{ generation.negative_applied }}"

  - name: "seed_generator"
    enabled: true
    configuration:
      seed: "{{ form.seed }}"
      quantity: "{{ form.quantity }}"

  - name: "dynamic_prompts_renderer"
    id: "dynamic_prompts_renderer"
    enabled: true
    configuration:
      pairs: "{{ generation.prompts.pairs }}"
      quantity: "{{ form.quantity }}"

  - name: "from_iotype"
    id: "from_iotype"
    enabled: true
    input:
      - ["seed", "seed_generator", "seed"]
    configuration:
      from: "seed"

  - name: "param_emitter"
    id: "param_emitter"
    enabled: true
    input:
      - ["seed", "from_iotype", "seed"]
    configuration:
      quantity: "{{ form.quantity }}"
      parameters:
        - ["model", "{{ form.diffusion_model }}"]
        - ["model", "{{ form.text_encoder }}"]
        - ["model", "{{ form.vae }}"]
        - "@loop":
            items: "{{ form.loras | active_loras }}"
            template: ["model", "{{ item.model }}"]
        - "@loop":
            items: "{{ generation.prompts.pairs }}"
            template: ["positive_prompt", *inpaint_prompt]
        - ["negative_prompt", "{{ generation.prompts.negatives }}"]
        - ["cfg", "{{ form.cfg | default(generation.profile.guidance) }}"]
        - ["steps", "{{ form.steps | default(generation.profile.steps) }}"]
        - ["sampler", "{{ form.sampler | default(generation.profile.sampler) }}"]
        - ["schedule", "{{ form.schedule }}"]
        - ["denoise", "{{ form.denoise }}"]

  - name: "generator/z_image"
    input:
      - ["model", "model_loader/z_image", "model"]
      - ["conditioning", "prompt_encoder", "conditioning"]
      - ["seed", "seed_generator", "seed"]
      - ["image", "{% if (form.source_image_inpaint_mask | default('', true)) != '' %}inpaint_region_crop{% else %}media_loader{% endif %}", "{% if (form.source_image_inpaint_mask | default('', true)) != '' %}images{% else %}image{% endif %}"]
      - ["mask", "inpaint_region_crop", "masks"]
    enabled: true
    configuration:
      mode: "inpaint"
      mask_feather: "{{ (form.mask_feather | default(12) | float) / 100 }}"
      denoise: "{{ form.denoise }}"
      steps: "{{ form.steps | default(generation.profile.steps) }}"
      guidance: "{{ form.cfg | default(generation.profile.guidance) }}"
      shift: "{% set s = form.shift | default('') %}{% if s is not none and s != '' %}{{ s }}{% endif %}"
      sampler: "{{ form.sampler | default(generation.profile.sampler) }}"
      schedule: "{{ form.schedule }}"
      quantity: "{{ form.quantity }}"
      step_cache:
        rel_threshold: "{{ form.step_cache_threshold }}"
        warmup_steps: "{{ form.step_cache_warmup_steps }}"
        max_consecutive_skips: "{{ form.step_cache_max_skips }}"

  - name: "inpaint_region_restore"
    id: "inpaint_region_restore"
    enabled: "{{ (form.source_image_inpaint_mask | default('', true)) != '' }}"
    input:
      - ["inpainted_image", "generator/z_image", "image"]
      - ["crop_region", "inpaint_region_crop", "crop_region"]
      - ["original_image", "inpaint_region_crop", "original_image"]
      - ["original_mask", "inpaint_region_crop", "original_mask"]
    configuration:
      strategy: "inpaint"
      feather: "{{ (form.mask_feather | default(12) | float) / 100 }}"

  - name: "gallery"
    input:
      - ["image", "{% if (form.source_image_inpaint_mask | default('', true)) != '' %}inpaint_region_restore{% else %}generator/z_image{% endif %}", "image"]
      - ["seed", "seed_generator", "seed"]
    enabled: true
