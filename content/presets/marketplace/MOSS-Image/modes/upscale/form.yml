name: "custom"
mode_label: "Upscale"
short_description: "Enlarge a picture and rebuild its detail, tile by tile."
prompt: "optional"
prompt_label: "What is in the picture"
prompt_placeholder: "a close-up portrait of an old fisherman, weathered skin"
fields:
  - type: "tabs"
    children:
      - type: "tab"
        anchor: "generation"
        label: "Upscale"
        configuration:
          icon: "generation"
          icon_display: "icon_only"
        children: "{{ paths.preset }}/modes/upscale/tabs/generation.yml"
      - type: "tab"
        anchor: "lora"
        label: "LoRA"
        configuration:
          icon: "lora"
          icon_display: "icon_only"
        children:
          file: "{{ paths._shared }}/native/lora.yml"
          vars:
            hint: LoRAs add specialized styles, concepts, or characters to MOSS-Image. Multiple LoRAs can be combined. 0.5-0.8 is recommended for most LoRAs, 1.0 = full effect. LoRAs trained for MOSS-Image in the OpenMOSS, diffusers/PEFT, ai-toolkit or ComfyUI layouts all work on both the SFT and Base checkpoints; the run log reports any LoRA keys that did not match.
            placeholder: Select a MOSS-Image LoRA...
            max_items: 10
            strength_min: -10.0
            strength_max: 10.0
            strength_step: 0.1
      - type: "tab"
        anchor: "advanced"
        label: "Advanced"
        audience: "advanced"
        configuration:
          icon: "settings"
          icon_display: "icon_only"
        children: "{{ paths.preset }}/modes/upscale/tabs/advanced.yml"
