fields:
  - type: "section"
    label: "Image"
    children:
      - type: "row"
        children:
          - name: "seed"
            type: "seed"
            label: "Seed"
            default: -1
            width: "3/5"

          - name: "quantity"
            type: "stepper"
            label: "Quantity"
            width: "2/5"
            full_width: true
            configuration:
              min: 1
              max: 4
              step: 1
            default: 1

      - name: "resolution"
        type: "resolution"
        label: "Image Resolution"
        configuration:
          files:
            - { path: "{{ paths._shared }}/resolutions/sdxl.yml", group: "SDXL" }
            - { path: "{{ paths._shared }}/resolutions/social_media.yml", group: "Social Media" }
        default: "832x1216"

  - type: "section"
    label: "Models"
    children:
      - name: "checkpoint"
        type: "model"
        label: "Checkpoint"
        required: true
        configuration:
          model_type: "checkpoint"
          allow_info_modal: true
          placeholder: "Select an Illustrious / SDXL checkpoint..."
          filter_tags: "@config:checkpoint_tags"
