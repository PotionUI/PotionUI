fields:
  - name: "speed_profile"
    type: "select"
    label: "Speed profile"
    default: "balanced"
    configuration:
      options:
        - { label: "Balanced", value: "balanced", sub_label: "20 steps" }
        - { label: "Turbo", value: "turbo", sub_label: "8 steps, pair with a Qwen Lightning LoRA" }
        - { label: "Turbo 4-step", value: "turbo_4", sub_label: "4-step Lightning LoRA" }
        - { label: "Custom", value: "custom", sub_label: "set steps/CFG freely" }

  - type: "section"
    label: "Image"
    children:
      - type: "row"
        children:
          - name: "seed"
            type: "seed"
            label: "Seed"
            default: -1
            width: "3/5"

          - name: "quantity"
            type: "stepper"
            label: "Quantity"
            default: 1
            width: "2/5"
            full_width: true
            configuration: {min: 1, max: 10, step: 1}

      - name: "resolution"
        type: "resolution"
        label: "Resolution"
        configuration:
          files:
            - { path: "{{ paths._shared }}/resolutions/sdxl.yml", group: "Qwen" }
            - { path: "{{ paths._shared }}/resolutions/social_media.yml", group: "Social Media" }
            - { path: "{{ paths._shared }}/resolutions/2k.yml", group: "2K" }
        default: "1024x1024"

  - type: "section"
    label: "Models"
    children:
      - name: "diffusion_model"
        type: "model"
        label: "Diffusion Model"
        required: true
        configuration:
          model_type: "diffusion_model"
          placeholder: "Select Qwen-Image MMDiT (e.g. qwen_image_2512_fp8)..."
          filter_tags: "@config:checkpoint_tags"
          recommendations:
            - name: "qwen_image_2512_fp8_e4m3fn.safetensors"
              link: "https://huggingface.co/Comfy-Org/Qwen-Image_ComfyUI/resolve/main/split_files/diffusion_models/qwen_image_2512_fp8_e4m3fn.safetensors"
              size: "19.03 GB"
              sha256: "5dc80554d5d83390046a2f4a94ece06afb7700bf7b0aaf8bde9769793875876b"
              description: "Qwen-Image 2512 MMDiT, fp8 - the validated local checkpoint; 16 GB VRAM is the realistic floor."
            - name: "qwen_image_2512_bf16.safetensors"
              link: "https://huggingface.co/Comfy-Org/Qwen-Image_ComfyUI/resolve/main/split_files/diffusion_models/qwen_image_2512_bf16.safetensors"
              size: "38.05 GB"
              sha256: "cbf55390fff27dbc785046d7007b04e0c5dd7421e7ef128f2831eacb53a8e075"
              description: "Qwen-Image 2512 MMDiT, full bf16 reference."
            - name: "qwen_image_fp8_e4m3fn.safetensors"
              link: "https://huggingface.co/Comfy-Org/Qwen-Image_ComfyUI/resolve/main/split_files/diffusion_models/qwen_image_fp8_e4m3fn.safetensors"
              size: "19.03 GB"
              sha256: "98763a127701eb6fb59096f7742cb3aa7d64ed510b9f4e882d8351f8176e3ce3"
              description: "Original (pre-2512) Qwen-Image MMDiT, fp8."

      # Single text encoder: Qwen2.5-VL. No CLIP-L for Qwen-Image.
      - name: "text_encoder"
        type: "model"
        label: "Text Encoder (Qwen2.5-VL)"
        required: true
        configuration:
          model_type: "text_encoder"
          placeholder: "Select Qwen2.5-VL text encoder..."
          filter_tags: "@config:text_encoder_tags"
          recommendations:
            - name: "qwen_2.5_vl_7b_fp8_scaled.safetensors"
              link: "https://huggingface.co/Comfy-Org/Qwen-Image_ComfyUI/resolve/main/split_files/text_encoders/qwen_2.5_vl_7b_fp8_scaled.safetensors"
              size: "8.74 GB"
              sha256: "cb5636d852a0ea6a9075ab1bef496c0db7aef13c02350571e388aea959c5c0b4"
              description: "Qwen2.5-VL-7B encoder, fp8-scaled - pairs with the fp8 MMDiT."
            - name: "qwen_2.5_vl_7b.safetensors"
              link: "https://huggingface.co/Comfy-Org/Qwen-Image_ComfyUI/resolve/main/split_files/text_encoders/qwen_2.5_vl_7b.safetensors"
              size: "15.45 GB"
              sha256: "cfafd739459bc86257397259f612a9aee88e5b98e85b5c0d0d1717e898b3463a"
              description: "Qwen2.5-VL-7B encoder, full-precision reference."
            - name: "qwen_2.5_vl_7b_nvfp4.safetensors"
              link: "https://huggingface.co/Comfy-Org/Qwen-Image_ComfyUI/resolve/main/split_files/text_encoders/qwen_2.5_vl_7b_nvfp4.safetensors"
              size: "5.69 GB"
              sha256: "c7bb24d331f5df991bab2ce76a15195b12652e86a69a79823183c6a047407463"
              description: "Qwen2.5-VL-7B encoder, nvfp4 - smallest tier, fastest on Blackwell."

      - name: "vae"
        type: "model"
        label: "VAE"
        required: true
        configuration:
          model_type: "vae"
          placeholder: "Select Qwen-Image VAE..."
          filter_tags: "@config:vae_tags"
          recommendations:
            - name: "qwen_image_vae.safetensors"
              link: "https://huggingface.co/Comfy-Org/Qwen-Image_ComfyUI/resolve/main/split_files/vae/qwen_image_vae.safetensors"
              size: "242.0 MB"
              sha256: "a70580f0213e67967ee9c95f05bb400e8fb08307e017a924bf3441223e023d1f"
              description: "Qwen-Image VAE (Wan 2.1 causal-3D). One file for every mode."
