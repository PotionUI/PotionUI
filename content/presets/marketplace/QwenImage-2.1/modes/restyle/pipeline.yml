pipeline:
  - name: "model_loader/qwen_image21"
    enabled: true
    configuration:
      diffusion_model:
        file_path: "{{ form.diffusion_model }}"
        name: "{{ form.diffusion_model }}"
      text_encoder:
        file_path: "{{ form.text_encoder }}"
        name: "{{ form.text_encoder }}"
      vae:
        file_path: "{{ form.vae }}"
        name: "{{ form.vae }}"
      loras:
        "@loop":
          items: "{{ form.loras }}"
          template:
            file_path: "{{ item.model }}"
            weight: "{{ item.strength }}"
      vision: true

  - name: "media_loader"
    id: "media_loader"
    enabled: true
    configuration:
      media:
        - type: "image"
          path: "{{ form.source_image }}"

  - name: "prompt_encoder"
    input:
      - ["text_encoder", "model_loader/qwen_image21", "text_encoder"]
      - ["image", "media_loader", "image"]
    enabled: true
    configuration:
      p_prompt:
        input: &restyle_prompt "{% set t = form.restyle_task %}{% set d = ((item.positive if item is defined else generation.prompts.first.positive) | default('', true)) | trim %}{% if t == 'background' %}Replace the background with {{ d }}. Keep the subject, its pose and its lighting unchanged.{% elif t == 'lighting' %}Change the lighting to {{ d }}. Keep the composition, subjects and colours of objects unchanged.{% elif t == 'colourise' %}Colourise this black and white photo with natural, realistic colours.{% if d %} Details: {{ d }}.{% endif %}{% elif t == 'photo' %}Turn this image into a realistic photograph.{% if d %} It shows {{ d }}.{% endif %} Keep the composition, subjects, layout and colours unchanged.{% elif t == 'restore' %}Restore this old photo: remove scratches, dust and fading, repair damage and sharpen detail, keeping the people and scene exactly as they are.{% if d %} Details: {{ d }}.{% endif %}{% else %}Restyle the whole image as {{ d }}. Keep the composition, subjects and layout unchanged.{% endif %}"
        output: *restyle_prompt
      n_prompt:
        input: "{{ generation.prompts.first.negative }}"
        output: "{{ generation.prompts.first.negative }}"
      pairs:
        "@loop":
          items: "{{ generation.prompts.pairs }}"
          template:
            positive: *restyle_prompt
            negative: "{{ item.negative }}"
      quantity: "{{ form.quantity }}"
      guidance_scale: "{{ form.cfg | default(generation.profile.guidance) }}"
      negative_applied: "{{ generation.negative_applied }}"

  - name: "seed_generator"
    enabled: true
    configuration:
      seed: "{{ form.seed }}"
      quantity: "{{ form.quantity }}"

  - name: "dynamic_prompts_renderer"
    id: "dynamic_prompts_renderer"
    enabled: true
    configuration:
      pairs: "{{ generation.prompts.pairs }}"
      quantity: "{{ form.quantity }}"

  - name: "from_iotype"
    id: "from_iotype"
    enabled: true
    input:
      - ["seed", "seed_generator", "seed"]
    configuration:
      from: "seed"

  - name: "param_emitter"
    id: "param_emitter"
    enabled: true
    input:
      - ["seed", "from_iotype", "seed"]
    configuration:
      quantity: "{{ form.quantity }}"
      parameters:
        - ["model", "{{ form.diffusion_model }}"]
        - ["model", "{{ form.text_encoder }}"]
        - ["model", "{{ form.vae }}"]
        - "@loop":
            items: "{{ form.loras | active_loras }}"
            template: ["model", "{{ item.model }}"]
        - "@loop":
            items: "{{ generation.prompts.pairs }}"
            template: ["positive_prompt", *restyle_prompt]
        - ["negative_prompt", "{{ generation.prompts.negatives }}"]
        - ["cfg", "{{ form.cfg | default(generation.profile.guidance) }}"]
        - ["steps", "{{ form.steps | default(generation.profile.steps) }}"]
        - ["sampler", "{{ form.sampler | default(generation.profile.sampler) }}"]
        - ["schedule", "{{ form.schedule }}"]

  - name: "generator/qwen_image21"
    input:
      - ["model", "model_loader/qwen_image21", "model"]
      - ["conditioning", "prompt_encoder", "conditioning"]
      - ["seed", "seed_generator", "seed"]
      - ["image", "media_loader", "image"]
    enabled: true
    configuration:
      mode: "edit"
      steps: "{{ form.steps | default(generation.profile.steps) }}"
      guidance: "{{ form.cfg | default(generation.profile.guidance) }}"
      shift: "{% set s = form.shift | default('') %}{% if s is not none and s != '' %}{{ s }}{% endif %}"
      sampler: "{{ form.sampler | default(generation.profile.sampler) }}"
      schedule: "{{ form.schedule }}"
      quantity: "{{ form.quantity }}"
      step_cache:
        rel_threshold: "{{ form.step_cache_threshold }}"
        warmup_steps: "{{ form.step_cache_warmup_steps }}"
        max_consecutive_skips: "{{ form.step_cache_max_skips }}"

  - name: "gallery"
    input:
      - ["image", "generator/qwen_image21", "image"]
      - ["seed", "seed_generator", "seed"]
    enabled: true
