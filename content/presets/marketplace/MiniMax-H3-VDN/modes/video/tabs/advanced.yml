# No Sparse attention section here, and that is not an omission: Sol-Attn and
# SLA decide which key blocks a query may see, which is exactly what the VDN
# window already decides. The two cannot both be in charge, so this preset
# offers neither. Low-VRAM sequence chunking is out for the same class of
# reason — the linear branch reads every video row of the clip at once and
# cannot be split into row chunks — and it has no form field on this family
# anyway.
fields:
  - type: "section"
    label: "Sampling"
    children:
      - name: "steps"
        type: "slider"
        label: "Steps"
        audience: "advanced"
        default: 8
        ai_hint: "Denoising steps; video and audio share the count but step their own sigma schedules. The two trained tiers are 8 (with the turbo adapter) and 50 (without it). Anything between them is untested on these weights."
        configuration: {min: 2, max: 100, step: 1}
        reactions:
          - when: { field: "speed_profile", equals: "quality" }
            then: { set_value: 50, set_disabled: false }
          - when: { field: "speed_profile", equals: "turbo" }
            then: { set_value: 8, set_disabled: false }
          - when: { field: "speed_profile", equals: "custom" }
            then: { set_disabled: false }
      - type: "row"
        children:
          - name: "sampler"
            type: "select"
            label: "Sampler"
            audience: "advanced"
            default: "euler"
            ai_hint: >-
              How each step advances between two sigmas. Euler is the reference
              solver and the one OpenVDN distilled against — leave it there for
              an ordinary request, and especially on the 8-step Turbo tier, where
              the adapter is only valid on the schedule it was trained for. Res
              multistep, DPM++ 2M and SA-Solver are deterministic second-order
              solvers: they reuse the previous step's estimate, so they cost no
              extra time and mostly buy sharpness at low step counts. ER-SDE is
              stochastic instead — it injects noise every step, seeded like the
              rest of the request, trading exact reproducibility for more
              variety. Suggest a non-default one only when the user is
              experimenting on the 50-step tier.
            configuration:
              options:
                - { label: "Euler (reference)", value: "euler" }
                - { label: "Res multistep", value: "res_multistep" }
                - { label: "DPM++ 2M", value: "dpmpp_2m" }
                - { label: "ER-SDE (stochastic)", value: "er_sde" }
                - { label: "SA-Solver", value: "sa_solver" }

          - name: "scheduler"
            type: "select"
            label: "Scheduler"
            audience: "advanced"
            default: "simple"
            ai_hint: >-
              Where the steps land on the noise curve. Simple is the model's own
              uniform grid and the right answer unless asked otherwise. Beta
              pulls knots toward both ends — more steps on early composition and
              on the final detail, fewer in the middle. Both video and audio are
              derived from the same knots either way. Cannot be combined with
              this tab's manual sigmas; that combination is refused rather than
              silently ignored.
            configuration:
              options:
                - { label: "Simple (reference)", value: "simple" }
                - { label: "Beta", value: "beta" }
          - name: "manual_sigmas"
            type: "textbox"
            label: "Manual sigmas (video)"
            default: ""
            ai_hint: "An expert escape hatch for reshaping where the model spends its steps -- front-load values near 1.0 for more composition work, cluster them low for more detail refinement. Do not offer it for ordinary requests; Steps and the speed profile cover those, and on the 8-step tier a hand-written grid puts the run off the schedule the turbo adapter was distilled for. Only reach for it when the user explicitly asks for a custom or non-uniform sigma schedule, or is transplanting a schedule from another tool. Always end the list at 0.0 or the render is refused. The list is the grid, not the step count: N values run N-1 steps. The computed default is shift 12 (video) / shift 3 (audio)."
            configuration:
              placeholder: "e.g. 1.0, 0.93, 0.8, 0.55, 0.0"
          - name: "manual_audio_sigmas"
            type: "textbox"
            label: "Manual sigmas (audio)"
            default: ""
            ai_hint: "Rarely needed on its own. Leave blank even when Manual sigmas (video) is set, unless the user specifically wants a different noise curve for the soundtrack than for the picture. If both lists are filled they must have the same number of values."
            configuration:
              placeholder: "blank = matched to the video schedule"

  - type: "section"
    label: "Keyframe encoding"
    audience: "advanced"
    children:
      - name: "keyframe_pixel_budget"
        type: "select"
        label: "Keyframe detail budget"
        default: "0"
        ai_hint: "Only has any effect when the Video Director attaches a first/last frame — and on this preset a keyframe is itself experimental, because OpenVDN's released renders carry none. The keyframe reaches the model twice, as condition frames (always at the picked Resolution) and as a picture the text encoder reads for style and content; only the second read is capped here. Uncapped reads up to 16MP and is paid for by area. '0' (uncapped) is the safest answer when the user cares about keyframe fidelity. Suggest 2x as the speed/fidelity compromise, or 1x when keyframe encoding is slow and the keyframe is a large photo. Values are multiples of the output canvas AREA, not edge length."
        configuration:
          options:
            - { label: "Uncapped (model default)", value: "0" }
            - { label: "1x output area (fastest)", value: "1" }
            - { label: "2x output area", value: "2" }
            - { label: "4x output area", value: "4" }

  - type: "section"
    label: "Step cache (FBCache)"
    audience: "advanced"
    children:
      - type: "row"
        children:
          - name: "step_cache_threshold"
            type: "slider"
            label: "Cache threshold"
            default: 0.0
            ai_hint: "A speed-for-fidelity trade, never a quality improvement -- it only removes work. Suggest 0.08 when the user explicitly wants a long run faster and can accept some softening, smoothed motion and a slightly duller soundtrack. 0.15 only if they ask for aggressive speed. Keep it at 0.0 for final renders, and on the 8-step Turbo tier, where the warmup steps already cover most of the trajectory and there is almost nothing left to skip. Be more conservative again when the Sampler is Res multistep or DPM++ 2M: a skipped step replays the previous velocity, and a second-order sampler takes that replayed estimate into its history, so one skip biases the steps after it as well. Halve whatever threshold you would suggest under Euler."
            configuration: {min: 0.0, max: 0.3, step: 0.01}
          - name: "step_cache_warmup_steps"
            type: "slider"
            label: "Warmup steps"
            default: 4
            ai_hint: "Only has an effect when Cache threshold is above 0. Raise toward 6-8 if a cached run loses composition or motion -- it gives back some of the speed."
            configuration: {min: 0, max: 12, step: 1}
          - name: "step_cache_max_skips"
            type: "slider"
            label: "Max consecutive skips"
            default: 3
            ai_hint: "Only has an effect when Cache threshold is above 0. Lower to 1-2 if a cached run drifts or loses detail late in the trajectory. Cap it at 1-2 whenever the Sampler is Res multistep or DPM++ 2M even if the run looks fine: consecutive skips feed the same replayed velocity into the sampler's two-step history, which is the case second-order solvers degrade on fastest."
            configuration: {min: 0, max: 10, step: 1}

  - name: "preview"
    type: "checkbox"
    label: "Live preview"
    default: true
