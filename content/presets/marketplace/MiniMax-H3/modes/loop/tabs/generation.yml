fields:
  - name: "speed_profile"
    type: "select"
    formula: "speed"
    label: "Speed profile"
    default: "quality"
    ai_hint: "Quality runs 24 steps for each of the loop's two passes and is the setting that closes the loop. Turbo (4 steps) and Flex (6 steps, needs the Flex adapter model) are quick drafts: at so few steps the loop may not come back to its start, and a 4-step run was seen to drift and cut at the end. Custom hands the Steps slider on the Advanced tab to the user; keep it at 20 or more for a loop."
    configuration:
      options:
        - { label: "Quality", value: "quality", sub_label: "24 steps" }
        - { label: "Turbo", value: "turbo", sub_label: "4 steps · draft, may not close" }
        - { label: "Flex", value: "flex", sub_label: "6 steps · draft, may not close" }
        - { label: "Custom", value: "custom", sub_label: "your own steps, left alone" }

  - type: "section"
    label: "Loop"
    children:
      - type: "row"
        children:
          - name: "seed"
            type: "seed"
            label: "Seed"
            default: -1
            width: "3/5"
          - name: "quantity"
            type: "stepper"
            label: "Quantity"
            default: 1
            configuration: {min: 1, max: 4, step: 1}
            width: "2/5"
            full_width: true

      - name: "start_picture"
        type: "image"
        label: "Start picture"
        description: "Optional. The picture that comes to life."
        ai_hint: "The still the loop starts from and returns to; its look, colours and framing are kept. Leave it empty to make the scene from the prompt alone."

      - name: "loop_seconds"
        type: "select"
        formula: "size"
        label: "Length"
        default: 4
        description: "Cut on whole 0.7 s steps, 2.1 s with sound."
        ai_hint: "How long one pass of the loop lasts: 2, 3, 4, 5, 6, 8 or 10 seconds, and nothing else. 2 to 4 seconds suits a wallpaper. The loop is cut on the model's own 17-frame steps, so it can run a fraction of a second longer or shorter than picked (4 s gives 4.25 s); with sound it moves in 2.1 s steps, so 3 s gives 2.1 s and 5 s gives 4.25 s. It is made in two passes: one as long as the loop and one about half that."
        configuration:
          options:
            - { label: "2 s", value: 2 }
            - { label: "3 s", value: 3 }
            - { label: "4 s", value: 4 }
            - { label: "5 s", value: 5 }
            - { label: "6 s", value: 6 }
            - { label: "8 s", value: 8 }
            - { label: "10 s", value: 10 }

      - name: "movement"
        type: "select"
        label: "Movement"
        default: "subtle"
        ai_hint: "Subtle asks for slight, slow movement, the kind that gives a still picture life on a wallpaper. Lively asks for steadier, more visible movement."
        configuration:
          options:
            - { label: "Subtle", value: "subtle" }
            - { label: "Lively", value: "lively" }

      - name: "resolution"
        type: "resolution"
        formula: "size"
        label: "Resolution"
        ai_hint: "Both axes must be multiples of 32, aspect ratio between 1:4 and 4:1 — the offered sizes are what MiniMax-H3's own canvas math produces. Area is the dominant cost. The start picture is fitted to the picked size once, keeping its aspect ratio, so pick the shape the finished loop should have."
        configuration:
          files:
            - { path: "{{ paths._shared }}/resolutions/minimax_h3_canvas.yml", group: "Native canvas (768 short edge)" }
            - { path: "{{ paths._shared }}/resolutions/minimax_h3_fast.yml", group: "Faster (below native canvas)" }
            - { path: "{{ paths._shared }}/resolutions/minimax_h3_480p.yml", group: "480p (Flex-trained)" }
        default: "1344x768"

      - name: "sound"
        type: "checkbox"
        label: "Sound"
        default: false
        ai_hint: "Off writes a silent loop, which suits a wallpaper. On adds quiet ambient sound that loops with the picture; the length then moves in 2.1-second steps so the sound wraps cleanly."

  - type: "section"
    label: "Models"
    formula: "models"
    children: "{{ paths.preset }}/files/form/models_fl2va.yml"
