fields:
  - name: "speed_profile"
    type: "select"
    formula: "speed"
    label: "Speed profile"
    default: "distilled"
    configuration:
      options:
        - { label: "Distilled", value: "distilled", sub_label: "8 steps · Euler CFG++ · CFG off · distilled sigma recipe" }
        - { label: "Balanced", value: "balanced", sub_label: "24 steps · Euler · CFG 4 · needs the dev checkpoint" }
        - { label: "Quality", value: "quality", sub_label: "30 steps · Euler · CFG 3 · multimodal guidance · needs the dev checkpoint" }
        - { label: "Custom", value: "custom", sub_label: "your own steps · sampler · CFG, left alone" }

  - type: "section"
    label: "Video"
    children:
      - name: "seed"
        type: "seed"
        label: "Seed"
        default: -1

      - name: "resolution"
        type: "resolution"
        formula: "size"
        label: "Resolution"
        configuration:
          files:
            - { path: "{{ paths._shared }}/resolutions/video.yml", group: "Video" }
            - { path: "{{ paths._shared }}/resolutions/social_media_video.yml", group: "Social Media" }
        default: "768x512"

      - name: "fps"
        type: "slider"
        formula: "size"
        label: "FPS"
        default: 25
        configuration: {min: 1, max: 60, step: 1}

      - name: "generate_audio"
        type: "checkbox"
        label: "Generate Audio"
        default: false

  - type: "section"
    label: "Models"
    formula: "models"
    children:
      - name: "model"
        type: "model"
        label: "LTX checkpoint (all-in-one)"
        required: true
        configuration:
          model_type: "checkpoint"
          placeholder: "ltx-2-19b-dev / ltx-2.3-22b-dev..."
          filter_tags: "@config:checkpoint_tags"
          recommendations:
            - name: "ltx-2.3-22b-distilled-fp8.safetensors"
              link: "https://huggingface.co/Lightricks/LTX-2.3-fp8/resolve/main/ltx-2.3-22b-distilled-fp8.safetensors"
              size: "27.50 GB"
              sha256: "d9646b6f2d5c42d337b23671634c43bfeece6989644f51b4a3aa088465ccd3b2"
              description: "LTX-2.3 22B distilled, fp8 all-in-one - pairs with the Distilled speed profile."
            - name: "ltx-2.3-22b-dev-fp8.safetensors"
              link: "https://huggingface.co/Lightricks/LTX-2.3-fp8/resolve/main/ltx-2.3-22b-dev-fp8.safetensors"
              size: "27.14 GB"
              sha256: "28606c5b5a06ce56f896d4dfcb20f212739e07a68fbe48e53638188449d26450"
              description: "LTX-2.3 22B dev, fp8 all-in-one - the non-distilled checkpoint at Balanced/Quality steps."
            - name: "ltx-2.3-22b-distilled-1.1.safetensors"
              link: "https://huggingface.co/Lightricks/LTX-2.3/resolve/main/ltx-2.3-22b-distilled-1.1.safetensors"
              size: "42.98 GB"
              sha256: "b33b7fe4bbfe084f484be4aaf90b0f1d95dca20d403ac4c0e037eb8c4f0af7cc"
              description: "LTX-2.3 22B distilled 1.1, bf16 all-in-one reference."
            - name: "ltx-2.3-22b-dev.safetensors"
              link: "https://huggingface.co/Lightricks/LTX-2.3/resolve/main/ltx-2.3-22b-dev.safetensors"
              size: "42.98 GB"
              sha256: "7ab7225325bc403448ea84b6db2269811a880e5118cd2ee2b6282a93d585016f"
              description: "LTX-2.3 22B dev, bf16 all-in-one reference."

      - name: "text_encoder"
        type: "model"
        label: "Text Encoder (Gemma3-12B)"
        required: true
        configuration:
          model_type: "text_encoder"
          placeholder: "Select Gemma3-12B (gemma_3_12B_it)..."
          filter_tags: "@config:text_encoder_tags"
          recommendations:
            - name: "gemma_3_12B_it_fp8_scaled.safetensors"
              link: "https://huggingface.co/Comfy-Org/ltx-2/resolve/main/split_files/text_encoders/gemma_3_12B_it_fp8_scaled.safetensors"
              size: "12.30 GB"
              sha256: "60216ce97c01c3a8753c2dfd0a89fc76e16fbe446d1a32ef8f1b528ac8bae466"
              description: "Gemma3-12B encoder, fp8-scaled - the practical default."
            - name: "gemma_3_12B_it.safetensors"
              link: "https://huggingface.co/Comfy-Org/ltx-2/resolve/main/split_files/text_encoders/gemma_3_12B_it.safetensors"
              size: "22.71 GB"
              sha256: "56eaa964a0d9325d2dc9ecaf7759bfaf0fac78ae36c789bed6e03e275a3729ec"
              description: "Gemma3-12B encoder, full-precision reference."
            - name: "gemma_3_12B_it_fp4_mixed.safetensors"
              link: "https://huggingface.co/Comfy-Org/ltx-2/resolve/main/split_files/text_encoders/gemma_3_12B_it_fp4_mixed.safetensors"
              size: "8.80 GB"
              sha256: "aaca463d11e6d8d2a4bdb0d6299214c15ef78a3f73e0ef8113d5a9d0219b3f6d"
              description: "Gemma3-12B encoder, fp4 mixed - smallest tier."

      - name: "upscale_model"
        type: "model"
        label: "Spatial Upscaler (optional)"
        ai_hint: "Only used when Upscale (Enhance tab) is on; required then."
        configuration:
          model_type: "upscaler"
          placeholder: "Select an LTX-2.3 spatial upscaler..."
          filter_tags: "@config:upscaler_tags"
          recommendations:
            - name: "ltx-2.3-spatial-upscaler-x2-1.1.safetensors"
              link: "https://huggingface.co/Lightricks/LTX-2.3/resolve/main/ltx-2.3-spatial-upscaler-x2-1.1.safetensors"
              size: "949.6 MB"
              sha256: "5f416311fa8172b65af67530758964708d29a317b830d689a51143b7f91913ed"
              description: "LTX-2.3 latent spatial upscaler, x2."
            - name: "ltx-2.3-spatial-upscaler-x1.5-1.0.safetensors"
              link: "https://huggingface.co/Lightricks/LTX-2.3/resolve/main/ltx-2.3-spatial-upscaler-x1.5-1.0.safetensors"
              size: "1.02 GB"
              sha256: "b2b3193e68cb04b4701e1d59bec4ed5d5e3e84506d9a42d5a129d37d39823df7"
              description: "LTX-2.3 latent spatial upscaler, x1.5 - gentler step for tight VRAM."

      - name: "preview_decoder"
        type: "model"
        label: "Preview decoder"
        required: false
        ai_hint: "Optional tiny decoder that turns the live preview into a true-colour frame from the middle of the clip. Leave empty to keep the fast latent colour projection."
        configuration:
          model_type: "preview_decoder"
          placeholder: "Select taeltx_2.safetensors..."
          recommendations:
            - name: "taeltx_2.safetensors"
              link: "https://raw.githubusercontent.com/madebyollin/taehv/62f7591f59dfbb4c3c02b7a621d180a9eeaba26c/safetensors/taeltx_2.safetensors"
              size: "22.44 MB"
              sha256: "6e4cc0469134213d0101a46877ea2bce1dc7cf06ff5f5aefb9e4076c03542f7b"
              description: "LTX-2 true-colour live preview decoder (MIT)."
            - name: "taeltx2_3.safetensors"
              link: "https://raw.githubusercontent.com/madebyollin/taehv/62f7591f59dfbb4c3c02b7a621d180a9eeaba26c/safetensors/taeltx2_3.safetensors"
              size: "22.44 MB"
              sha256: "f0773b4e3e57318e6aa4dd4a35e1d16213a5f160fbc0376163f06888bbcbe246"
              description: "LTX-2.3 and 2.5 true-colour live preview decoder (MIT)."
