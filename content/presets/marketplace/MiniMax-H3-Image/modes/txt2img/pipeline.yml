# model_loader/minimax_h3_image -> prompt_encoder -> seed_generator -> dynamic_prompts_renderer
#   -> from_iotype -> param_emitter -> generator/minimax_h3_image -> gallery
#
# MiniMax-H3-Image is distilled to six steps with one output head per step, so
# the prompt encoder runs with guidance 1.0 and no negative prompt, and the
# generator always samples with Euler on the checkpoint's own step grid.
pipeline:
  - name: "model_loader/minimax_h3_image"
    enabled: true
    configuration:
      diffusion_model: { file_path: "{{ form.diffusion_model }}", name: "{{ form.diffusion_model }}" }
      text_encoder: { file_path: "{{ form.text_encoder }}", name: "{{ form.text_encoder }}" }
      vae: { file_path: "{{ form.vae }}", name: "{{ form.vae }}" }
      loras:
        "@loop":
          items: "{{ form.loras | default([], true) }}"
          template:
            file_path: "{{ item.model }}"
            weight: "{{ item.strength }}"

  - name: "prompt_encoder"
    input:
      - ["text_encoder", "model_loader/minimax_h3_image", "text_encoder"]
    enabled: true
    configuration:
      p_prompt:
        input: "{{ generation.prompts.first.positive }}"
        output: "{{ generation.prompts.first.positive }}"
      pairs: "{{ generation.prompts.pairs }}"
      quantity: "{{ form.quantity }}"
      guidance_scale: 1.0

  - name: "seed_generator"
    enabled: true
    configuration:
      seed: "{{ form.seed }}"
      quantity: "{{ form.quantity }}"

  - name: "dynamic_prompts_renderer"
    id: "dynamic_prompts_renderer"
    enabled: true
    configuration:
      pairs: "{{ generation.prompts.pairs }}"
      quantity: "{{ form.quantity }}"

  - name: "from_iotype"
    id: "from_iotype"
    enabled: true
    input:
      - ["seed", "seed_generator", "seed"]
    configuration:
      from: "seed"

  - name: "param_emitter"
    id: "param_emitter"
    enabled: true
    input:
      - ["seed", "from_iotype", "seed"]
    configuration:
      quantity: "{{ form.quantity }}"
      parameters:
        - ["model", "{{ form.diffusion_model }}"]
        - ["model", "{{ form.text_encoder }}"]
        - ["model", "{{ form.vae }}"]
        - "@loop":
            items: "{{ form.loras | default([], true) | active_loras }}"
            template: ["model", "{{ item.model }}"]
        - ["positive_prompt", "{{ generation.prompts.positives }}"]
        - ["steps", "{{ preset.vars.steps }}"]
        - ["sampler", "euler"]
        - ["schedule", "h3_image_pdd"]
        - ["resolution", "{{ form.resolution }}"]

  - name: "generator/minimax_h3_image"
    input:
      - ["model", "model_loader/minimax_h3_image", "model"]
      - ["conditioning", "prompt_encoder", "conditioning"]
      - ["seed", "seed_generator", "seed"]
    enabled: true
    configuration:
      mode: "txt2img"
      steps: "{{ preset.vars.steps }}"
      resolution: "{{ form.resolution }}"
      quantity: "{{ form.quantity }}"
      preview: "{{ form.preview }}"

  - name: "gallery"
    input:
      - ["image", "generator/minimax_h3_image", "image"]
      - ["seed", "seed_generator", "seed"]
    enabled: true
