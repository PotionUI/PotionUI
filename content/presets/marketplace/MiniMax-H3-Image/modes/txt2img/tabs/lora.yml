fields:
  - name: "loras"
    type: "lora_picker"
    formula: "loras"
    default: []
    label: "LoRAs"
    ai_hint: "LoRAs add specialized styles, concepts, or characters to MiniMax-H3-Image. Multiple LoRAs can be combined. 0.5-0.8 is recommended for most LoRAs, 1.0 = full effect. Use LoRAs trained for MiniMax-H3-Image: a MiniMax-H3 video LoRA loads, but its audio and video-only layers are skipped and the run log says how many keys did not match."
    configuration:
      model_type: "lora"
      placeholder: "Select a MiniMax-H3-Image LoRA..."
      allow_info_modal: true
      strength_min: -2.0
      strength_max: 2.0
      strength_step: 0.05
      strength_default: 1.0
      max_items: 6
      filter_tags: "@config:lora_tags"
