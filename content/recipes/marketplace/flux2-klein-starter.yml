########
## Setup recipe: Flux2 (Klein-4B) on the native engine
##
## See src/features/recipes/schema.py for the schema this file is
## validated against (scripts/recipe_lint.py) and
## src/features/recipes/executors/ for what each step kind actually does.
########
schema_version: 1
id: "flux2-klein-starter"
version: 1
name: "Flux2 Klein-4B Starter"
engine: "native"
category: "image"
summary: "Get a working Flux2 setup on your local GPU and produce a first image."
description: >
  Installs the bundled Flux2 preset on the native (in-process) engine, makes
  sure its three model files are available, and proves the pipeline is wired
  up correctly before handing you a ready-to-use preset (see docs/models/flux.md).
  Flux2's preset default points at the gated Klein-9B checkpoint, which needs
  an accepted Hugging Face licence before it can be fetched; this recipe
  instead pins the smaller Klein-4B DiT straight from the author's own
  black-forest-labs/FLUX.2-klein-4B repository (Apache-2.0, no licence
  gate), paired with the matching Qwen3-4B text encoder and the shared
  Flux2 VAE. The three files together are a real download (~16 GB).

plugins:
  - id: "huggingface-provider"
    reason: >
      Resolves the diffusion model, text encoder and VAE from HuggingFace
      by exact repo path. HuggingFace has no hash-lookup API, so each
      artifact below names its file explicitly; the sha256 in each
      artifact's checksum still verifies the download afterwards.

backend:
  engine: "native"

artifacts:
  - id: "flux2-diffusion-model"
    kind: "diffusion_model"
    model_type: "diffusion_model"
    filename: "flux-2-klein-4b.safetensors"
    display_name: "Flux2 Klein-4B (DiT, bf16)"
    required: true
    size_bytes: 7751105712
    checksum:
      algorithm: "sha256"
      value: "ec3d4e733a771f61c052fb4856c48b336c55eaf2c65487c2a1faeb9bbda7a343"
    # Declared by capability, never by a concrete plugin id - core resolves a
    # download source through whichever enabled plugin advertises this
    # capability (see plugin manifest `capabilities:`).
    capability: "model-lookup"
    provider_hint:
      source: "huggingface"
      model_id: "black-forest-labs/FLUX.2-klein-4B"
      version_id: "main@flux-2-klein-4b.safetensors"

  - id: "flux2-text-encoder"
    kind: "text_encoder"
    model_type: "text_encoder"
    filename: "qwen_3_4b.safetensors"
    display_name: "Qwen3-4B text encoder"
    required: true
    size_bytes: 8044982048
    checksum:
      algorithm: "sha256"
      value: "6c671498573ac2f7a5501502ccce8d2b08ea6ca2f661c458e708f36b36edfc5a"
    capability: "model-lookup"
    provider_hint:
      source: "huggingface"
      model_id: "Comfy-Org/vae-text-encorder-for-flux-klein-4b"
      version_id: "main@split_files/text_encoders/qwen_3_4b.safetensors"

  - id: "flux2-vae"
    kind: "vae"
    model_type: "vae"
    filename: "flux2-vae.safetensors"
    display_name: "Flux2 VAE"
    required: true
    size_bytes: 336211292
    checksum:
      algorithm: "sha256"
      value: "868fe7b343cc8f3a19dbcfcafbc3d5f888802be3f89bd81b65b3621a066ce8f3"
    capability: "model-lookup"
    provider_hint:
      source: "huggingface"
      model_id: "Comfy-Org/vae-text-encorder-for-flux-klein-9b"
      version_id: "main@split_files/vae/flux2-vae.safetensors"

presets:
  - preset_id: "01KX46YCC5RB5EGYY38SBMVKR5"
    path_hint: "marketplace/Flux2"
    assign_to_owner: true

smoke:
  preset_id: "01KX46YCC5RB5EGYY38SBMVKR5"
  mode: "txt2img"
  prompt: "a small red boat on a calm lake at sunset, photograph"
  seed: 12345
  # Matches content/presets/marketplace/Flux2/tests.yml's "flux-klein-baseline-fast"
  # case (the preset's generic fast smoke, not tied to a specific DiT size):
  # low steps, guidance at the preset's own default, smallest square resolution.
  form:
    steps: 10
    guidance: 3.5
    sampler: "euler"
    resolution: "1024x1024"

steps:
  - key: "plugins.ensure"
    kind: "plugins.ensure"
    title: "Enable required plugins"
    params:
      # huggingface-provider is needed so the download step can resolve each
      # artifact's exact repo file.
      plugin_ids: ["huggingface-provider"]

  - key: "backend.ensure"
    kind: "backend.ensure"
    title: "Prepare the native backend"
    params:
      engine: "native"

  # Index BEFORE planning downloads: on a fresh instance nothing is indexed
  # yet, so without this pass artifacts.plan cannot see files the user
  # already has and would ask to download them.
  - key: "models.index"
    kind: "models.index"
    title: "Find models you already have"
    params:
      engine: "native"

  - key: "artifacts.plan"
    kind: "artifacts.plan"
    title: "Plan required downloads"
    params:
      artifact_ids: ["flux2-diffusion-model", "flux2-text-encoder", "flux2-vae"]

  - key: "artifacts.fetch"
    kind: "artifacts.fetch"
    title: "Download the Flux2 model files"
    params:
      artifact_ids: ["flux2-diffusion-model", "flux2-text-encoder", "flux2-vae"]

  - key: "models.index.downloads"
    kind: "models.index"
    title: "Register downloaded models"
    params:
      engine: "native"

  - key: "preset.ensure"
    kind: "preset.ensure"
    title: "Install and assign the Flux2 preset"
    params:
      preset_id: "01KX46YCC5RB5EGYY38SBMVKR5"

  - key: "pipeline.render"
    kind: "pipeline.render"
    title: "Validate the pipeline"
    params:
      preset_id: "01KX46YCC5RB5EGYY38SBMVKR5"
      mode: "txt2img"

  - key: "generation.smoke"
    kind: "generation.smoke"
    title: "Run a first real generation"
    params:
      preset_id: "01KX46YCC5RB5EGYY38SBMVKR5"
      mode: "txt2img"

  - key: "workspace.activate"
    kind: "workspace.activate"
    title: "Finish onboarding"
    # Only meaningful during the first-run wizard - a run started from
    # Admin -> Recipes skips it.
    onboarding_only: true
    params: {}
