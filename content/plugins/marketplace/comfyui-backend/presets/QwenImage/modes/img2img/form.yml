name: "custom"
short_description: "Restyle or rework an existing image with a prompt."
fields:
  - type: "tabs"
    children:
      - type: "tab"
        anchor: "generation"
        label: "Generation"
        configuration:
          icon: "generation"
          icon_display: "icon_only"
        children: "{{ paths.preset }}/modes/img2img/tabs/generation.yml"

      - type: "tab"
        anchor: "references"
        label: "References"
        configuration:
          icon: "image"
          icon_display: "icon_only"
        children: "{{ paths.preset }}/modes/img2img/tabs/references.yml"

      - type: "tab"
        anchor: "lora"
        label: "LoRA"
        configuration:
          icon: "lora"
          icon_display: "icon_only"
        children: "{{ paths.preset }}/modes/img2img/tabs/lora.yml"

      - type: "tab"
        anchor: "advanced"
        label: "Advanced"
        audience: "advanced"
        configuration:
          icon: "settings"
          icon_display: "icon_only"
        children: "{{ paths.preset }}/modes/img2img/tabs/advanced.yml"
