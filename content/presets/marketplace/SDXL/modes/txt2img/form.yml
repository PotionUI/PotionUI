name: "custom"
short_description: "Generate an image from a text prompt."
fields:
  - type: "tabs"
    children:
      - type: "tab"
        anchor: "generation"
        label: "Generation"
        configuration:
          icon: "generation"
          icon_display: "icon_only"
        children: "{{ paths.preset }}/modes/txt2img/tabs/generation.yml"

      - type: "tab"
        anchor: "lora"
        label: "LoRA"
        configuration:
          icon: "lora"
          icon_display: "icon_only"
        children: "{{ paths.preset }}/modes/txt2img/tabs/lora.yml"

      - type: "tab"
        anchor: "embeddings"
        label: "Embeddings"
        configuration:
          icon: "embedding"
          icon_display: "icon_only"
        children: "{{ paths.preset }}/modes/txt2img/tabs/embeddings.yml"

      - type: "tab"
        anchor: "post_processing"
        label: "Enhance"
        configuration:
          icon: "sparkles"
          icon_display: "icon_only"
        children: "{{ paths.preset }}/modes/txt2img/tabs/post-processing.yml"

      - type: "tab"
        anchor: "face_hand_detailer"
        label: "Face & Hand Detailer"
        configuration:
          icon: "face"
          icon_display: "icon_only"
        children: "{{ paths.preset }}/modes/txt2img/tabs/face-hand-detailer.yml"

      - type: "tab"
        anchor: "controlnet"
        label: "ControlNet"
        configuration:
          icon: "image"
          icon_display: "icon_only"
        children: "{{ paths.preset }}/modes/txt2img/tabs/controlnet.yml"

      - type: "tab"
        anchor: "advanced"
        label: "Advanced"
        audience: "advanced"
        configuration:
          icon: "settings"
          icon_display: "icon_only"
        children: "{{ paths.preset }}/modes/txt2img/tabs/advanced.yml"
