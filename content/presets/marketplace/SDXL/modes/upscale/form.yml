name: "custom"
mode_label: "Upscale & refine"
short_description: "Enlarge a picture 2 to 4 times and re-detail it with your checkpoint."
prompt: "optional"
prompt_label: "Describe the picture"
prompt_placeholder: "sharp focus, fine skin texture, detailed fabric"
fields:
  - type: "tabs"
    children:
      - type: "tab"
        anchor: "generation"
        label: "Upscale"
        configuration:
          icon: "generation"
          icon_display: "icon_only"
        children: "{{ paths.preset }}/modes/upscale/tabs/generation.yml"

      - type: "tab"
        anchor: "advanced"
        label: "Advanced"
        audience: "advanced"
        configuration:
          icon: "settings"
          icon_display: "icon_only"
        children: "{{ paths.preset }}/modes/upscale/tabs/advanced.yml"
