fields:
  - name: "speed_profile"
    type: "select"
    formula: "speed"
    label: "Speed profile"
    default: "quality"
    ai_hint: "Quality runs 24 steps and holds the look of the source best. Turbo runs 4 steps and is softer. Flex runs 6 steps with the Pika Flex adapter, which needs the Flex adapter model on the Models section; it is fast, and it ignores the LoRA tab and the sampler settings. Custom hands the Steps slider on the Advanced tab to the user."
    configuration:
      options:
        - { label: "Quality", value: "quality", sub_label: "24 steps" }
        - { label: "Turbo", value: "turbo", sub_label: "4 steps" }
        - { label: "Flex", value: "flex", sub_label: "6 steps · Flex adapter" }
        - { label: "Custom", value: "custom", sub_label: "your own steps, left alone" }
  - type: "section"
    label: "Video"
    children:
      - type: "row"
        children:
          - name: "seed"
            type: "seed"
            label: "Seed"
            default: -1
            width: "3/5"
          - name: "quantity"
            type: "stepper"
            label: "Quantity"
            default: 1
            configuration: {min: 1, max: 4, step: 1}
            width: "2/5"
            full_width: true
      - name: "added_seconds"
        type: "slider"
        formula: "size"
        label: "Added length (seconds)"
        default: 5
        description: "How much new footage to add."
        ai_hint: "Seconds of new footage, generated in one MiniMax-H3 window. Cost is close to linear in this. The prompt describes only what happens in the new part, not the original clip."
        configuration: {min: 1, max: 13.5, step: 0.5}
  - type: "section"
    label: "Models"
    formula: "models"
    children: "{{ paths.preset }}/files/form/models_fl2va.yml"
