  - {title: "src/Core/Program.cs:144 Data/Settings.fds, :531-547 model sets (Stable-Diffusion plus tensorrt, diffusion_models and unet)", url: "https://github.com/mcmonkeyprojects/SwarmUI/blob/de7b834b4aabc6b0239acb76940833277445fe51/src/Core/Program.cs"}
