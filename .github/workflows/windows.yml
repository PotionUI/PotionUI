name: Windows

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  PYTHONUTF8: "1"
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"

jobs:
  doctor:
    name: potionui doctor (Windows)
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: potionui doctor
        shell: cmd
        run: .\potionui.cmd doctor

      - name: potionui doctor --json
        shell: cmd
        run: .\potionui.cmd doctor --json > doctor.json

      - name: Upload doctor report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: potionui-doctor-report-windows
          path: doctor.json
          retention-days: 14

  install-smoke-remote:
    name: install smoke (remote profile, Windows real boot)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install harness dependency (requests)
        shell: cmd
        run: pip install requests

      - name: Cache pip downloads for the throwaway checkout
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}\potionui-install-smoke\pip-cache
          key: install-smoke-remote-windows-pip-${{ hashFiles('requirements-cpu.txt') }}
          restore-keys: |
            install-smoke-remote-windows-pip-

      - name: Install matrix (remote profile) - real boot on Windows
        shell: cmd
        run: python tests/install/run.py --profiles remote --from-git HEAD --root "${{ runner.temp }}\potionui-install-smoke" --json report.json

      - name: Upload install-smoke report + logs (Windows)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: install-smoke-remote-windows-report
          path: |
            report.json
            ${{ runner.temp }}\potionui-install-smoke\logs-remote\
          retention-days: 14

  backend-tests:
    name: backend pytest (Windows, ${{ matrix.shard.name }})
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard:
          - name: platform
            paths: >-
              tests/platform
              --ignore=tests/platform/runtime/native/test_engine.py
              --ignore=tests/platform/runtime/native/arch/test_minimax_music3_ar_loop.py
            serial_paths: >-
              tests/platform/runtime/native/test_engine.py
              tests/platform/runtime/native/arch/test_minimax_music3_ar_loop.py
          - name: rest
            paths: tests/ --ignore=tests/platform
            serial_paths: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-ci.txt
            requirements-dev.txt

      - name: Install backend dependencies (CPU-only torch)
        shell: cmd
        run: |
          python -m pip install --upgrade pip || exit /b
          pip install -r requirements-ci.txt --extra-index-url https://download.pytorch.org/whl/cpu || exit /b
          pip install -r requirements-dev.txt || exit /b
          pip install pytest-timeout

      - name: pytest (CPU-only, no GPU/model-file/gc-sensitive tests)
        shell: cmd
        run: |
          python -m pytest ${{ matrix.shard.paths }} -q --timeout=300 -n 4 -m "not requires_gpu and not requires_models and not gc_sensitive" --junitxml=junit-windows-${{ matrix.shard.name }}.xml > pytest-windows-${{ matrix.shard.name }}.log 2>&1
          set PYTEST_EXIT=%ERRORLEVEL%
          type pytest-windows-${{ matrix.shard.name }}.log
          exit /b %PYTEST_EXIT%

      - name: pytest (sequential quarantine — xdist-only failures on this runner)
        if: matrix.shard.serial_paths != ''
        timeout-minutes: 8
        shell: cmd
        run: |
          python -m pytest ${{ matrix.shard.serial_paths }} -q --timeout=300 --timeout-method=thread -m "not requires_gpu and not requires_models and not gc_sensitive" --junitxml=junit-windows-${{ matrix.shard.name }}-serial.xml > pytest-windows-${{ matrix.shard.name }}-serial.log 2>&1
          set PYTEST_EXIT=%ERRORLEVEL%
          type pytest-windows-${{ matrix.shard.name }}-serial.log
          exit /b %PYTEST_EXIT%

      - name: pytest (marketplace plugin test suites)
        if: matrix.shard.name == 'rest'
        shell: cmd
        run: |
          python tests/plugins/run_suites.py -q --timeout=300 -m "not requires_gpu and not requires_models and not gc_sensitive" > plugin-suites-windows.log 2>&1
          set PYTEST_EXIT=%ERRORLEVEL%
          type plugin-suites-windows.log
          exit /b %PYTEST_EXIT%

      - name: Upload pytest results (Windows)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-tests-windows-${{ matrix.shard.name }}
          path: |
            junit-windows-${{ matrix.shard.name }}.xml
            pytest-windows-${{ matrix.shard.name }}.log
            junit-windows-${{ matrix.shard.name }}-serial.xml
            pytest-windows-${{ matrix.shard.name }}-serial.log
            plugin-suites-windows.log
          retention-days: 14

  release-gate:
    name: release gate (CPU-safe gates, Windows)
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-ci.txt
            requirements-dev.txt

      - name: Install backend dependencies (CPU-only torch)
        shell: cmd
        run: |
          python -m pip install --upgrade pip || exit /b
          pip install -r requirements-ci.txt --extra-index-url https://download.pytorch.org/whl/cpu || exit /b
          pip install -r requirements-dev.txt || exit /b
          pip install pytest-timeout

      - name: python tests/release/release_gate.py --skip-gpu --lint-only
        shell: cmd
        run: python tests/release/release_gate.py --skip-gpu --lint-only

  frontend:
    name: frontend check + tests + build (Windows)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            content/plugins/package-lock.json

      - name: npm ci
        shell: cmd
        working-directory: frontend
        run: npm ci

      - name: npm run check
        shell: cmd
        working-directory: frontend
        run: npm run check

      - name: npm run test:unit
        shell: cmd
        working-directory: frontend
        run: npm run test:unit

      - name: npm run test:component
        shell: cmd
        working-directory: frontend
        run: npm run test:component

      - name: npm run build
        shell: cmd
        working-directory: frontend
        run: npm run build

      - name: npm ci (plugin toolchain)
        shell: cmd
        working-directory: content/plugins
        run: npm ci

      - name: npm run build:plugins + drift check
        shell: cmd
        working-directory: frontend
        run: |
          npm run build:plugins || exit /b
          git -C .. diff --exit-code --stat -- "content/plugins/*/*/frontend/dist"

  e2e:
    name: HTTP journeys + Playwright UI (Windows)
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      PLAYWRIGHT_BROWSERS_PATH: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-ci.txt
            requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies (CPU-only torch)
        shell: cmd
        run: |
          python -m pip install --upgrade pip || exit /b
          pip install -r requirements-ci.txt --extra-index-url https://download.pytorch.org/whl/cpu || exit /b
          pip install -r requirements-dev.txt || exit /b
          pip install requests

      - name: npm ci
        shell: cmd
        working-directory: frontend
        run: npm ci

      - name: Read Playwright version
        id: playwright-version
        shell: cmd
        working-directory: frontend
        run: |
          for /f "delims=" %%v in ('node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version"') do set PW_VERSION=%%v
          echo version=%PW_VERSION%>>"%GITHUB_OUTPUT%"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: frontend/node_modules/playwright-core/.local-browsers
          key: playwright-browsers-windows-${{ steps.playwright-version.outputs.version }}

      - name: Playwright Chromium
        id: browsers
        shell: cmd
        working-directory: frontend
        run: |
          npx playwright install chromium chromium-headless-shell || exit /b
          npx playwright install --list

      - name: HTTP journeys (throwaway backend)
        shell: cmd
        run: |
          python tests/e2e/journeys/run.py > journeys-windows.log 2>&1
          set RUN_EXIT=%ERRORLEVEL%
          type journeys-windows.log
          exit /b %RUN_EXIT%

      - name: Playwright UI journeys (throwaway backend + vite preview)
        if: ${{ !cancelled() && steps.browsers.outcome == 'success' }}
        shell: cmd
        run: |
          python tests/e2e/ui/run.py > playwright-windows.log 2>&1
          set RUN_EXIT=%ERRORLEVEL%
          type playwright-windows.log
          exit /b %RUN_EXIT%

      - name: Upload E2E logs + artifacts (Windows)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-windows
          path: |
            journeys-windows.log
            playwright-windows.log
            tests/e2e/ui/artifacts/
          retention-days: 14
