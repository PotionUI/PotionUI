name: Backend + frontend tests

# Runs the real pytest suite (not just the dry-run resolve + architecture
# guard onboarding-smoke.yml already covers) on a CPU-only runner, plus the
# frontend unit tests. GPU-bound and real-model-file tests are excluded via
# the `requires_gpu`/`requires_models` markers (see tests/conftest.py) - this
# runner has no CUDA device and, per the maintainer's hard rule, must never
# read a real model checkpoint even if one happened to be present.
#
# requirements-ci.txt is a trimmed copy of requirements.txt (see its own
# header for what's excluded and why); constraints.txt is NOT used here, as
# it pins the maintainer's CUDA-specific transitive closure, which has no
# CPU-only equivalent.

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: backend-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    # Two parallel shards: the whole suite in one job needs ~25-30 min of
    # wall clock on the 4-vCPU runner (~3x slower per core than a dev box,
    # where the same config takes 8 min) - right at/over the old timeout.
    # tests/platform holds the tensor-heavy native-runtime suites (5m50s of
    # the dev box's 8 min; the other ~11.7k tests take 2m18s), so it gets a
    # shard to itself. Bonus: the split separates test_migration_runner's
    # Database-singleton teardown leak (tests/platform) from the
    # tests/features/setup fixtures it is known to poison in shared sessions.
    name: backend pytest (CPU-only, ${{ matrix.shard.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard:
          - name: platform
            paths: tests/platform
          - name: rest
            paths: tests/ --ignore=tests/platform
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-ci.txt
            requirements-dev.txt

      # libglib2.0-0 supplies libgthread-2.0.so.0, which `import cv2` needs
      # (see docs/testing-notes.md) - without it the cv2-dependent suites
      # skip silently rather than fail, so install it for real coverage.
      # ffmpeg unlocks the media-editing suite's video/audio round-trips the
      # same way.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libglib2.0-0 ffmpeg

      # pytest-timeout backs pytest.ini's `timeout = 300` - it is not in
      # requirements-dev.txt today, so it's installed explicitly here rather
      # than assumed present.
      - name: Install backend dependencies (CPU-only torch)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt --extra-index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-dev.txt
          pip install pytest-timeout

      # -n 4: the suite is ~15.7k tests and takes 18-23 min sequentially -
      # right at the job timeout. pytest-xdist across the runner's 4 cores
      # keeps the whole job well under it. The worker count is pinned (not
      # `auto`) so a runner-size change can't silently change test isolation.
      #
      # The *_NUM_THREADS=1 pins are load-bearing, not an optimization: with
      # 4 workers each running torch at its default 4 OMP threads, the first
      # -n 4 run oversubscribed the 4 cores 4x - two conv2d calls hung past
      # the 300s test timeout, and OMP/MKL adjusting thread counts under
      # contention changed float-reduction splits mid-test, breaking the
      # chunked-vs-unchunked torch.equal contracts and a bf16 tolerance.
      # One thread per worker = 4 busy cores and deterministic reductions.
      - name: pytest (CPU-only, no GPU/model-file/gc-sensitive tests)
        env:
          OMP_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
        run: >
          python -m pytest ${{ matrix.shard.paths }} -q --timeout=300 -n 4
          -m "not requires_gpu and not requires_models and not gc_sensitive"

  frontend-tests:
    name: frontend unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm ci
        working-directory: frontend
        run: npm ci

      # onboarding-smoke.yml's frontend-build job already covers
      # `svelte-kit sync` + a production build; this job adds the vitest
      # suite that job doesn't run. `npm run check` is deliberately not
      # added here to avoid duplicating that coverage.
      - name: npm run test:unit
        working-directory: frontend
        run: npm run test:unit
