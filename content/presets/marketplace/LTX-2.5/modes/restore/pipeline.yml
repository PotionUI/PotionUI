pipeline:
  - name: "media_loader"
    id: "media_loader"
    enabled: true
    configuration:
      validate_files: true
      max_file_size: 524288000
      auto_detect_type: true
      media:
        - type: "video"
          path: "{{ form.input_video }}"

  - name: "model_loader/ltx"
    enabled: true
    configuration:
      model:
        file_path: "{{ form.model }}"
        name: "{{ form.model }}"
      text_encoder:
        file_path: "{{ form.text_encoder }}"
        name: "{{ form.text_encoder }}"
      vae:
        file_path: "{{ form.video_vae }}"
        name: "{{ form.video_vae }}"
      loras:
        "@loop":
          items: "{{ form.loras }}"
          template:
            file_path: "{{ item.model }}"
            weight: "{{ item.strength }}"

  - name: "prompt_encoder"
    input:
      - ["text_encoder", "model_loader/ltx", "text_encoder"]
    enabled: true
    configuration:
      p_prompt:
        input: &caption "{% set text = ((item.positive if item is defined else generation.prompts.first.positive) or '') %}{% set scene = text.strip().rstrip('. ') or 'the scene' %}{% if form.restore_task == 'restore' %}{{ text | text_or('Restored archival footage with natural colour, sharp photographic detail, crisp faces and clothing texture, natural grain, high resolution footage') }}{% elif form.restore_task == 'deblur' %}Reference shows {{ scene }}, heavily out of focus with soft defocused blur and no fine detail. Edited shows the same scene in sharp focus with crisp detail and clean edges. DEBLUR {{ scene }}. Subject identity, framing, and background geometry are identical to the reference; only focus and sharpness differ between reference and edited.{% else %}Reference shows {{ scene }}, heavily compressed with visible macroblocking, chroma bleed, and ringing artifacts. Edited shows the same scene restored to high quality with sharp detail, clean edges, and no compression artifacts. ENHANCE QUALITY {{ scene }}. Subject identity, framing, and background geometry are identical to the reference; only compression artifacts and image quality differ between reference and edited.{% endif %}"
        output: *caption
      n_prompt:
        input: &negative "{{ item.negative if item is defined else generation.prompts.first.negative }}"
        output: *negative
      pairs:
        "@loop":
          items: "{{ generation.prompts.pairs }}"
          template:
            positive: *caption
            negative: *negative
      quantity: "{{ form.quantity }}"
      guidance_scale: "{{ form.cfg | default(generation.profile.guidance) }}"
      negative_applied: "{{ generation.negative_applied }}"

  - name: "seed_generator"
    enabled: true
    configuration:
      seed: "{{ form.seed }}"
      quantity: "{{ form.quantity }}"

  - name: "dynamic_prompts_renderer"
    id: "dynamic_prompts_renderer"
    enabled: true
    configuration:
      pairs: "{{ generation.prompts.pairs }}"
      quantity: "{{ form.quantity }}"

  - name: "from_iotype"
    id: "from_iotype"
    enabled: true
    input:
      - ["seed", "seed_generator", "seed"]
    configuration:
      from: "seed"

  - name: "param_emitter"
    id: "param_emitter"
    enabled: true
    input:
      - ["seed", "from_iotype", "seed"]
    configuration:
      quantity: "{{ form.quantity }}"
      parameters:
        - ["model", "{{ form.model }}"]
        - ["model", "{{ form.text_encoder }}"]
        - ["model", "{{ form.video_vae }}"]
        - ["model", "{{ form.restore_lora if form.restore_task == 'restore' else (form.deblur_lora if form.restore_task == 'deblur' else form.decompress_lora) }}"]
        - "@loop":
            items: "{{ form.loras | active_loras }}"
            template: ["model", "{{ item.model }}"]
        - ["positive_prompt", "{{ generation.prompts.positives }}"]
        - ["negative_prompt", "{{ generation.prompts.negatives }}"]
        - ["cfg", "{{ form.cfg | default(generation.profile.guidance) }}"]
        - ["steps", "{{ form.steps | default(generation.profile.steps) }}"]
        - ["sampler", "{{ form.sampler | default(generation.profile.sampler) }}"]
        - ["schedule", "{{ form.schedule }}"]
        - ["strength", "{{ form.effect_strength }}"]
        - ["fix", "{{ form.restore_task }}"]

  - name: "generator/video_ltx"
    id: "generator"
    input:
      - ["model", "model_loader/ltx", "model"]
      - ["conditioning", "prompt_encoder", "conditioning"]
      - ["seed", "seed_generator", "seed"]
      - ["video", "media_loader", "video"]
      - ["audio", "media_loader", "video"]
    enabled: true
    configuration:
      quantity: "{{ form.quantity }}"
      decode: true
      audio: true
      audio_source: "file"
      match_video: true
      max_pixels: "{{ 2088960 if form.output_size == '1080p' else 921600 }}"
      windows: true
      window_overlap: "{{ preset.vars.edit_window_overlap }}"
      fps: 24.0
      steps: "{{ form.steps | default(generation.profile.steps) }}"
      cfg: "{{ form.cfg | default(generation.profile.guidance) }}"
      sampler: "{{ form.sampler | default(generation.profile.sampler) }}"
      schedule: "{{ form.schedule }}"
      manual_sigmas: "{{ preset.vars.distilled_sigma_recipe if (form.speed_profile == 'distilled') else ('' if (form.speed_profile == 'quality') else (form.manual_sigmas)) }}"
      quality_mode: "{{ (form.speed_profile) == 'quality' }}"
      quality_cfg: "{{ form.cfg | default(generation.profile.guidance) }}"
      quality_stg: "{{ preset.vars.quality_stg }}"
      quality_rescale: "{{ preset.vars.quality_rescale }}"
      quality_modality: "{{ preset.vars.quality_modality }}"
      quality_stg_blocks: "{{ preset.vars.quality_stg_blocks }}"
      step_cache_threshold: "{{ form.step_cache_threshold }}"
      step_cache_warmup_steps: "{{ form.step_cache_warmup_steps }}"
      step_cache_max_skips: "{{ form.step_cache_max_skips }}"
      media_placements:
        - { source: "video", index: 0, frame: "first", strength: 1.0, role: "reference" }
      scoped_loras:
        - file_path: "{{ form.restore_lora if form.restore_task == 'restore' else (form.deblur_lora if form.restore_task == 'deblur' else form.decompress_lora) }}"
          weight: "{{ form.effect_strength }}"

  - name: "gallery"
    input:
      - ["video", "generator", "video"]
      - ["seed", "seed_generator", "seed"]
    enabled: true
