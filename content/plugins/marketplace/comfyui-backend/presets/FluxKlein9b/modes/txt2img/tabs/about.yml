fields:
  - type: "markdown"
    name: "about_info"
    label: "FLUX 2 Klein 9B Information"
    configuration:
      content: |
        ## FLUX 2 Klein 9B

        FLUX 2 Klein is a 9 billion parameter text-to-image diffusion model based on the FLUX architecture.
        It uses a Qwen-based text encoder for improved prompt understanding.

        This preset ships two Speed profiles (Generation tab), each backed by a different trained
        checkpoint -- not the same model with a different sampling recipe:

        - **Balanced** -- the full base checkpoint (`flux-2-klein-base-9b-fp8.safetensors`), 20
          steps, CFG 5.0, real negative-prompt guidance.
        - **Fast** -- a separately-trained distilled checkpoint (`flux-2-klein-9b-fp8.safetensors`),
          4 steps, CFG 1.0. The distilled model bakes zeroed-out conditioning in place of a real
          negative prompt, so the negative prompt field is ignored under this profile.

        Pick the checkpoint that matches your chosen Speed profile in the Diffusion Model field --
        it is not auto-selected. The picker's options narrow to match the selected Speed profile
        (via admin-tagged checkpoints, Admin -> Presets -> Configuration), so an untagged install
        may still show both until an admin tags them.

        ### Key Features
        - **Model Size**: 9B parameters (FP8 quantized)
        - **Architecture**: FLUX 2 with MMDiT (Multimodal Diffusion Transformer)
        - **Text Encoder**: Qwen 3 8B (FP8 mixed precision)
        - **VAE**: FLUX 2 VAE for high-quality decoding

        ### Notes
        - Both checkpoints use the Flux2Scheduler, which automatically handles sigma scheduling.
        - The workflow supports dynamic LoRA loading with up to 6 LoRA slots.
        - Switching Speed profile updates the Steps, CFG, and Sampler defaults together
          (Advanced tab) and locks them so they can't drift out of sync. The Diffusion Model
          field (Generation tab) is not auto-set -- no preset ever names a model file -- but its
          options narrow to the checkpoint tagged for the selected profile.

  - type: "alert"
    configuration:
      variant: "default"
      content: |
        This preset requires ComfyUI with the following custom nodes:
        - **ComfyUI-FLUX** (for Flux2Scheduler, EmptyFlux2LatentImage)
        - **ComfyUI-Custom-Primitives** (for PrimitiveStringMultiline, PrimitiveInt)

  - type: "alert"
    configuration:
      variant: "warning"
      content: |
        **Fast profile**: keep CFG between 1.0-2.0 for the distilled checkpoint. Higher values
        fight the distillation and degrade quality; there's no negative prompt to counteract it.
