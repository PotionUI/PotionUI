fields:
  - name: "speed_profile"
    type: "select"
    formula: "speed"
    label: "Speed profile"
    default: "distilled"
    configuration:
      options:
        - { label: "Distilled", value: "distilled", sub_label: "8 steps · CFG off · distilled sigma recipe" }
        - { label: "Balanced", value: "balanced", sub_label: "24 steps · CFG 4 · needs the dev checkpoint" }
        - { label: "Quality", value: "quality", sub_label: "30 steps · CFG 3 · multimodal guidance · needs the dev checkpoint" }
        - { label: "Custom", value: "custom", sub_label: "your own steps · sampler · CFG, left alone" }

  - type: "section"
    label: "Video"
    children:
      - type: "row"
        children: "{{ paths.preset }}/files/form/seed_quantity.yml"

      - name: "resolution"
        type: "resolution"
        formula: "size"
        label: "Resolution"
        description: "768x448 is the size this mode was trained at. Other sizes are less reliable."
        configuration:
          options:
            - { value: "768x448", description: "Trained size" }
          files:
            - { path: "{{ paths._shared }}/resolutions/video.yml", group: "Other sizes" }
        default: "768x448"

      - name: "duration"
        type: "slider"
        formula: "size"
        label: "Length (seconds)"
        default: 5
        description: "5 seconds is what this mode was trained at, and shorter clips are not offered. Much longer clips are less reliable."
        configuration: {min: 5, max: 10, step: 1}

  - type: "section"
    label: "Models"
    formula: "models"
    children:
      file: "{{ paths.preset }}/files/form/models_effect.yml"
      vars:
        lora_label: "Ingredients LoRA"
        lora_file: "ltx-2.5-22b-ic-lora-ingredients-0.9.safetensors"
        lora_repo: "Lightricks/LTX-2.5-22b-IC-LoRA-Ingredients"
        lora_size: "1.31 GB"
        lora_description: "LTX-2.5 Ingredients IC-LoRA (reference sheets). Gated repo: accept the license on Hugging Face and set a token in Admin - Plugins."
