name: "custom"
mode_label: "Fix faces & hands"
short_description: "Repaint the faces and hands in a picture with your checkpoint."
prompt: "optional"
prompt_label: "Describe the face"
prompt_placeholder: "smiling, detailed eyes, soft light"
fields:
  - type: "tabs"
    children:
      - type: "tab"
        label: "Fix"
        configuration:
          icon: "generation"
          icon_display: "icon_only"
        children: "{{ paths.preset }}/modes/refine_faces/tabs/generation.yml"

      - type: "tab"
        label: "LoRA"
        configuration:
          icon: "lora"
          icon_display: "icon_only"
        children: "{{ paths.preset }}/modes/inpaint/tabs/lora.yml"

      - type: "tab"
        label: "Advanced"
        audience: "advanced"
        configuration:
          icon: "settings"
          icon_display: "icon_only"
        children: "{{ paths.preset }}/modes/refine_faces/tabs/advanced.yml"
