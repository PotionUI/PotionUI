pipeline:
  - name: "model_loader/moss_image"
    enabled: true
    configuration:
      diffusion_model:
        file_path: "{{ form.diffusion_model }}"
        name: "{{ form.diffusion_model }}"
      text_encoder:
        file_path: "{{ form.text_encoder }}"
        name: "{{ form.text_encoder }}"
      vae:
        file_path: "{{ form.vae }}"
        name: "{{ form.vae }}"
      loras:
        "@loop":
          items: "{{ form.loras }}"
          template:
            file_path: "{{ item.model }}"
            weight: "{{ item.strength }}"

  - name: "regional_prompt/moss_image"
    id: "regional_prompt"
    enabled: "{{ (form.regional_prompt | default({})).enabled | default(false) }}"
    configuration:
      pairs: "{{ generation.prompts.pairs }}"
      regional_prompt: "{{ form.regional_prompt }}"
      resolution: "{{ form.resolution }}"

  - name: "prompt_encoder"
    input:
      - ["text_encoder", "model_loader/moss_image", "text_encoder"]
      - ["pairs", "regional_prompt", "pairs"]
    enabled: true
    configuration:
      p_prompt:
        input: "{{ generation.prompts.first.positive }}"
        output: "{{ generation.prompts.first.positive }}"
      n_prompt:
        input: "{{ generation.prompts.first.negative }}"
        output: "{{ generation.prompts.first.negative }}"
      pairs: "{{ generation.prompts.pairs }}"
      quantity: "{{ form.quantity }}"
      guidance_scale: "{{ form.cfg }}"
      negative_applied: "{{ generation.negative_applied }}"

  - name: "seed_generator"
    enabled: true
    configuration:
      seed: "{{ form.seed }}"
      quantity: "{{ form.quantity }}"

  - name: "dynamic_prompts_renderer"
    id: "dynamic_prompts_renderer"
    enabled: true
    configuration:
      pairs: "{{ generation.prompts.pairs }}"
      quantity: "{{ form.quantity }}"

  - name: "from_iotype"
    id: "from_iotype"
    enabled: true
    input:
      - ["seed", "seed_generator", "seed"]
    configuration:
      from: "seed"

  - name: "param_emitter"
    id: "param_emitter"
    enabled: true
    input:
      - ["seed", "from_iotype", "seed"]
    configuration:
      quantity: "{{ form.quantity }}"
      parameters:
        - ["model", "{{ form.diffusion_model }}"]
        - ["model", "{{ form.text_encoder }}"]
        - ["model", "{{ form.vae }}"]
        - "@loop":
            items: "{{ form.loras | active_loras }}"
            template: ["model", "{{ item.model }}"]
        - ["positive_prompt", "{{ generation.prompts.positives }}"]
        - ["negative_prompt", "{{ generation.prompts.negatives }}"]
        - ["cfg", "{{ form.cfg }}"]
        - ["steps", "{{ form.steps }}"]
        - ["sampler", "{{ form.sampler }}"]
        - ["schedule", "{{ form.schedule }}"]
        - ["resolution", "{{ form.resolution }}"]

  - name: "generator/moss_image"
    input:
      - ["model", "model_loader/moss_image", "model"]
      - ["conditioning", "prompt_encoder", "conditioning"]
      - ["seed", "seed_generator", "seed"]
    enabled: true
    configuration:
      steps: "{{ form.steps }}"
      guidance: "{{ form.cfg }}"
      shift: "{% set s = form.shift | default('') %}{% if s is not none and s != '' %}{{ s }}{% endif %}"
      sampler: "{{ form.sampler }}"
      schedule: "{{ form.schedule }}"
      guidance_options:
        cfg_zero_star: false
        uncond_skip_layers: "{{ '22' if form.uncond_layer_skip | default(true) else '' }}"
      resolution: "{{ form.resolution }}"
      quantity: "{{ form.quantity }}"
      step_cache:
        rel_threshold: "{{ form.step_cache_threshold }}"
        warmup_steps: "{{ form.step_cache_warmup_steps }}"
        max_consecutive_skips: "{{ form.step_cache_max_skips }}"

  - name: "gallery"
    input:
      - ["image", "generator/moss_image", "image"]
      - ["seed", "seed_generator", "seed"]
    enabled: true
