fields:
  - name: "speed_profile"
    type: "select"
    formula: "speed"
    label: "Speed profile"
    default: "turbo"
    configuration:
      options:
        - { label: "Turbo", value: "turbo", sub_label: "8 steps, distilled checkpoint" }
        - { label: "Base", value: "base", sub_label: "30 steps" }
        - { label: "Custom", value: "custom", sub_label: "set steps/CFG freely" }

  - type: "section"
    label: "Image"
    children:
      - type: "row"
        children: "{{ paths._shared }}/native/seed_quantity.yml"

      - name: "resolution"
        type: "resolution"
        formula: "size"
        label: "Resolution"
        ai_hint: "The size of the new image. It takes the aspect ratio of the guide picture."
        configuration:
          files:
            - { path: "{{ paths._shared }}/resolutions/sdxl.yml", group: "Z-Image" }
            - { path: "{{ paths._shared }}/resolutions/social_media.yml", group: "Social Media" }
            - { path: "{{ paths._shared }}/resolutions/2k.yml", group: "2K" }
        default: "1024x1024"

  - type: "section"
    label: "Models"
    formula: "models"
    children: "{{ paths.preset }}/files/form/models.yml"
