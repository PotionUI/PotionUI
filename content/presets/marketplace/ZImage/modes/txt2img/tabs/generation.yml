fields:
  - name: "speed_profile"
    type: "select"
    label: "Speed profile"
    default: "turbo"
    configuration:
      options:
        - { label: "Turbo", value: "turbo", sub_label: "8 steps, distilled checkpoint" }
        - { label: "Base", value: "base", sub_label: "30 steps" }
        - { label: "Custom", value: "custom", sub_label: "set steps/CFG freely" }

  - type: "section"
    label: "Image"
    children:
      - type: "row"
        children:
          - name: "seed"
            type: "seed"
            label: "Seed"
            default: -1
            width: "3/5"

          - name: "quantity"
            type: "stepper"
            label: "Quantity"
            default: 1
            configuration: {min: 1, max: 10, step: 1}
            width: "2/5"
            full_width: true

      - name: "resolution"
        type: "resolution"
        label: "Resolution"
        configuration:
          files:
            - { path: "{{ paths._shared }}/resolutions/sdxl.yml", group: "Z-Image" }
            - { path: "{{ paths._shared }}/resolutions/social_media.yml", group: "Social Media" }
            - { path: "{{ paths._shared }}/resolutions/2k.yml", group: "2K" }
        default: "1024x1024"

  - type: "section"
    label: "Models"
    children:
      - name: "diffusion_model"
        type: "model"
        label: "Diffusion Model"
        required: true
        configuration:
          model_type: "diffusion_model"
          placeholder: "Select Z-Image NextDiT (e.g. zImage_turbo)..."
          filter_tags: "@config:checkpoint_tags"
          recommendations:
            - name: "z_image_turbo_bf16.safetensors"
              link: "https://huggingface.co/Comfy-Org/z_image_turbo/resolve/main/split_files/diffusion_models/z_image_turbo_bf16.safetensors"
              size: "11.46 GB"
              sha256: "2407613050b809ffdff18a4ac99af83ea6b95443ecebdf80e064a79c825574a6"
              description: "Z-Image Turbo NextDiT, bf16 reference - the smallest bf16 DiT of any native family."
            - name: "z_image_turbo_int8_convrot.safetensors"
              link: "https://huggingface.co/Comfy-Org/z_image_turbo/resolve/main/split_files/diffusion_models/z_image_turbo_int8_convrot.safetensors"
              size: "5.78 GB"
              sha256: "be517ebd47c912a5626a588e1aeea43e6be4a43c0cdcd2b48a2a780d9f358635"
              description: "Z-Image Turbo, int8 ConvRot - half the bf16 footprint, no Blackwell requirement."
            - name: "z_image_turbo_nvfp4.safetensors"
              link: "https://huggingface.co/Comfy-Org/z_image_turbo/resolve/main/split_files/diffusion_models/z_image_turbo_nvfp4.safetensors"
              size: "4.20 GB"
              sha256: "a553c889dbcb910de4c98293237573219a37007c1074a3f04576646a088bd5c8"
              description: "Z-Image Turbo, nvfp4 - smallest tier; the fast matmul path needs Blackwell."

      # Single text encoder: Qwen3-4B. No CLIP-L for Z-Image.
      - name: "text_encoder"
        type: "model"
        label: "Text Encoder (Qwen3-4B)"
        required: true
        configuration:
          model_type: "text_encoder"
          placeholder: "Select Z-Image text encoder..."
          filter_tags: "@config:text_encoder_tags"
          recommendations:
            - name: "qwen_3_4b.safetensors"
              link: "https://huggingface.co/Comfy-Org/z_image_turbo/resolve/main/split_files/text_encoders/qwen_3_4b.safetensors"
              size: "7.49 GB"
              sha256: "6c671498573ac2f7a5501502ccce8d2b08ea6ca2f661c458e708f36b36edfc5a"
              description: "Qwen3-4B encoder, full precision."
            - name: "qwen_3_4b_fp8_mixed.safetensors"
              link: "https://huggingface.co/Comfy-Org/z_image_turbo/resolve/main/split_files/text_encoders/qwen_3_4b_fp8_mixed.safetensors"
              size: "5.25 GB"
              sha256: "72450b19758172c5a7273cf7de729d1c17e7f434a104a00167624cba94f68f15"
              description: "Qwen3-4B encoder, fp8 mixed."
            - name: "qwen_3_4b_fp4_mixed.safetensors"
              link: "https://huggingface.co/Comfy-Org/z_image_turbo/resolve/main/split_files/text_encoders/qwen_3_4b_fp4_mixed.safetensors"
              size: "3.24 GB"
              sha256: "7ca32dcf07dfe7692945d80fff86e3a74cb83c6206b9b223ac6836b939bb85d6"
              description: "Qwen3-4B encoder, fp4 mixed - smallest tier."

      - name: "vae"
        type: "model"
        label: "VAE"
        required: true
        configuration:
          model_type: "vae"
          placeholder: "Select Z-Image VAE..."
          filter_tags: "@config:vae_tags"
          recommendations:
            - name: "ae.safetensors"
              link: "https://huggingface.co/Comfy-Org/z_image_turbo/resolve/main/split_files/vae/ae.safetensors"
              size: "319.8 MB"
              sha256: "afc8e28272cd15db3919bacdb6918ce9c1ed22e96cb12c4d5ed0fba823529e38"
              description: "Z-Image's Flux-style 2D VAE."
