name: "custom"
mode_label: "Structure"
short_description: "Keep the pose, outlines or depth of a guide picture and paint a new image on it."
prompt_label: "Describe the new picture"
prompt_placeholder: "a knight in silver armor, forest at dawn"
fields:
  - type: "tabs"
    children:
      - type: "tab"
        anchor: "generation"
        label: "Structure"
        configuration:
          icon: "generation"
          icon_display: "icon_only"
        children: "{{ paths.preset }}/modes/control/tabs/generation.yml"

      - type: "tab"
        anchor: "lora"
        label: "LoRA"
        configuration:
          icon: "lora"
          icon_display: "icon_only"
        children:
          file: "{{ paths._shared }}/native/lora.yml"
          vars:
            hint: LoRAs add specialized styles, concepts, or characters to the base model. Multiple LoRAs can be combined. Check model page for recommended strength values. 0.5-0.8 is recommended for most LoRAs, 1.0 = full effect; negative values invert the effect. Leave empty if not needed.
            placeholder: Select a LoRA...
            max_items: 10
            strength_min: -10.0
            strength_max: 10.0
            strength_step: 0.1

      - type: "tab"
        anchor: "embeddings"
        label: "Embeddings"
        configuration:
          icon: "embedding"
          icon_display: "icon_only"
        children: "{{ paths.preset }}/modes/txt2img/tabs/embeddings.yml"

      - type: "tab"
        anchor: "advanced"
        label: "Advanced"
        audience: "advanced"
        configuration:
          icon: "settings"
          icon_display: "icon_only"
        children: "{{ paths.preset }}/modes/txt2img/tabs/advanced.yml"
