fields:
  - type: "section"
    label: "Image"
    children:
      - type: "row"
        children:
          - name: "seed"
            type: "seed"
            label: "Seed"
            default: -1
            width: "3/5"

          - name: "quantity"
            type: "stepper"
            label: "Quantity"
            default: 1
            width: "2/5"
            full_width: true
            configuration: {min: 1, max: 10, step: 1}

      - name: "denoise"
        type: "slider"
        label: "Denoising Strength"
        default: 0.55
        configuration:
          min: 0.0
          max: 1.0
          step: 0.05
          tooltip: "Fraction of the schedule to walk. Low (0.2-0.4) preserves structure and only refines; high (0.8-1.0) approaches a full re-render."

  - type: "section"
    label: "Models"
    children:
      - name: "diffusion_model"
        type: "model"
        label: "Diffusion Model"
        required: true
        configuration:
          model_type: "diffusion_model"
          placeholder: "Select a Flux1 DiT..."
          filter_tags: "@config:checkpoint_tags"

      - name: "text_encoder"
        type: "model"
        label: "Text Encoder"
        required: true
        configuration:
          model_type: "clip"
          placeholder: "Select the T5-XXL text encoder..."
          filter_tags: "@config:clip_tags"

      - name: "clip_l"
        type: "model"
        label: "CLIP-L"
        required: true
        configuration:
          model_type: "clip"
          placeholder: "Select the CLIP-L text encoder..."
          filter_tags: "@config:clip_tags"

      - name: "vae"
        type: "model"
        label: "VAE"
        required: true
        configuration:
          model_type: "vae"
          placeholder: "Select Flux VAE..."
          filter_tags: "@config:vae_tags"
