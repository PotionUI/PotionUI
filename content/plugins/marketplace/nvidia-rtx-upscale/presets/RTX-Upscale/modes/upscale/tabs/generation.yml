# Intent picks which nvvfx effect runs; Quality is its tier. Scale (Advanced
# tab) only applies to the two upscale intents -- a reaction hides it for
# Denoise/Deblur rather than rendering it disabled-and-ignored.
fields:
  - name: "intent"
    type: "select"
    formula: "restoration"
    label: "Intent"
    default: "upscale"
    ai_hint: "What the RTX effect does to the image. Upscale and Upscale (clean source) both increase resolution by Scale, or to Target Short Side when it is set (Advanced tab); Denoise and Deblur enhance at the SAME resolution and ignore both entirely."
    configuration:
      options:
        - { label: "Upscale", value: "upscale", sub_label: "Increase resolution -- removes compression artifacts, for typical compressed video." }
        - { label: "Upscale — clean source", value: "upscale_highbitrate", sub_label: "Increase resolution -- keeps fine detail, for a high-bitrate or lossless source." }
        - { label: "Denoise", value: "denoise", sub_label: "Same-resolution noise reduction." }
        - { label: "Deblur", value: "deblur", sub_label: "Same-resolution sharpening of blurred detail." }

  - name: "quality"
    type: "select"
    formula: "restoration"
    label: "Quality"
    default: "ultra"
    configuration:
      options:
        - { label: "Low", value: "low" }
        - { label: "Medium", value: "medium" }
        - { label: "High", value: "high" }
        - { label: "Ultra", value: "ultra", sub_label: "Recommended -- best quality, slowest." }

  - type: "section"
    label: "Image"
    children:
      - name: "input_image"
        type: "image"
        label: "Input Image"
        required: true
        ai_hint: "Upload an image to process, or pick one of your previous generations from history."
