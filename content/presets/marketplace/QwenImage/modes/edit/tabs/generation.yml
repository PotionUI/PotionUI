fields:
  - name: "speed_profile"
    type: "select"
    label: "Speed profile"
    default: "balanced"
    configuration:
      options:
        - { label: "Balanced", value: "balanced", sub_label: "20 steps" }
        - { label: "Turbo", value: "turbo", sub_label: "8 steps, pair with a Qwen Lightning LoRA" }
        - { label: "Turbo 4-step", value: "turbo_4", sub_label: "4-step Lightning LoRA" }
        - { label: "Custom", value: "custom", sub_label: "set steps/CFG freely" }

  - type: "section"
    label: "Image"
    children:
      - type: "row"
        children:
          - name: "seed"
            type: "seed"
            label: "Seed"
            default: -1
            width: "3/5"

          - name: "quantity"
            type: "stepper"
            label: "Quantity"
            default: 1
            width: "2/5"
            full_width: true
            configuration: {min: 1, max: 10, step: 1}

  - type: "section"
    label: "Models"
    children:
      - name: "diffusion_model"
        type: "model"
        label: "Diffusion Model"
        required: true
        configuration:
          model_type: "diffusion_model"
          placeholder: "Select a Qwen-Image-Edit MMDiT (e.g. qwen_image_edit_2511_fp8)..."
          filter_tags: "@config:checkpoint_tags"
          recommendations:
            - name: "qwen_image_edit_2511_fp8mixed.safetensors"
              link: "https://huggingface.co/Comfy-Org/Qwen-Image-Edit_ComfyUI/resolve/main/split_files/diffusion_models/qwen_image_edit_2511_fp8mixed.safetensors"
              size: "19.12 GB"
              sha256: "c9fdc158e46d3b61ef75f21ae866ca2fe808bf4a53643120d1c1e87c19280a4e"
              description: "Qwen-Image-Edit 2511, fp8/nvfp4 mixed - half the bf16 footprint."
            - name: "qwen_image_edit_2511_bf16.safetensors"
              link: "https://huggingface.co/Comfy-Org/Qwen-Image-Edit_ComfyUI/resolve/main/split_files/diffusion_models/qwen_image_edit_2511_bf16.safetensors"
              size: "38.05 GB"
              sha256: "ae42d927b5fac4f278b9a894554c727e619727a63622976f2d95625be4bce08c"
              description: "Qwen-Image-Edit 2511, full bf16 reference."
            - name: "qwen_image_edit_2509_fp8_e4m3fn.safetensors"
              link: "https://huggingface.co/Comfy-Org/Qwen-Image-Edit_ComfyUI/resolve/main/split_files/diffusion_models/qwen_image_edit_2509_fp8_e4m3fn.safetensors"
              size: "19.03 GB"
              sha256: "318568f61951ab9da21100c7b896e3c1da67f0d2efad6421545e022cfaa2b2b4"
              description: "Qwen-Image-Edit 2509, plain fp8 - the previous edit release."

      # Single text encoder: Qwen2.5-VL. The vision tower is loaded for this mode
      # (model_loader/qwen's `vision: true`, see pipeline.yml) so the same file
      # ALSO grounds the text conditioning on the source image, not just its text
      # description.
      - name: "text_encoder"
        type: "model"
        label: "Text Encoder (Qwen2.5-VL)"
        required: true
        configuration:
          model_type: "text_encoder"
          placeholder: "Select Qwen2.5-VL text encoder..."
          filter_tags: "@config:text_encoder_tags"
          recommendations:
            - name: "qwen_2.5_vl_7b_fp8_scaled.safetensors"
              link: "https://huggingface.co/Comfy-Org/Qwen-Image_ComfyUI/resolve/main/split_files/text_encoders/qwen_2.5_vl_7b_fp8_scaled.safetensors"
              size: "8.74 GB"
              sha256: "cb5636d852a0ea6a9075ab1bef496c0db7aef13c02350571e388aea959c5c0b4"
              description: "Qwen2.5-VL-7B encoder, fp8-scaled - pairs with the fp8 MMDiT."
            - name: "qwen_2.5_vl_7b.safetensors"
              link: "https://huggingface.co/Comfy-Org/Qwen-Image_ComfyUI/resolve/main/split_files/text_encoders/qwen_2.5_vl_7b.safetensors"
              size: "15.45 GB"
              sha256: "cfafd739459bc86257397259f612a9aee88e5b98e85b5c0d0d1717e898b3463a"
              description: "Qwen2.5-VL-7B encoder, full-precision reference."
            - name: "qwen_2.5_vl_7b_nvfp4.safetensors"
              link: "https://huggingface.co/Comfy-Org/Qwen-Image_ComfyUI/resolve/main/split_files/text_encoders/qwen_2.5_vl_7b_nvfp4.safetensors"
              size: "5.69 GB"
              sha256: "c7bb24d331f5df991bab2ce76a15195b12652e86a69a79823183c6a047407463"
              description: "Qwen2.5-VL-7B encoder, nvfp4 - smallest tier, fastest on Blackwell."

      - name: "vae"
        type: "model"
        label: "VAE"
        required: true
        configuration:
          model_type: "vae"
          placeholder: "Select Qwen-Image VAE..."
          filter_tags: "@config:vae_tags"
          recommendations:
            - name: "qwen_image_vae.safetensors"
              link: "https://huggingface.co/Comfy-Org/Qwen-Image_ComfyUI/resolve/main/split_files/vae/qwen_image_vae.safetensors"
              size: "242.0 MB"
              sha256: "a70580f0213e67967ee9c95f05bb400e8fb08307e017a924bf3441223e023d1f"
              description: "Qwen-Image VAE (Wan 2.1 causal-3D). One file for every mode."
