########
## Setup recipe: Wan 2.1 / 2.2 (text-to-video) on the native engine
##
## See src/features/recipes/schema.py for the schema this file is
## validated against (scripts/recipe_lint.py) and
## src/features/recipes/executors/ for what each step kind actually does.
########
schema_version: 1
id: "wan22-starter"
version: 2
name: "Wan 2.1 / 2.2 Starter"
engine: "native"
category: "video"
summary: "Get a working Wan 2.2 text-to-video setup on your local GPU and produce a first clip."
description: >
  Installs the bundled Wan 2.1 / 2.2 preset on the native (in-process) engine,
  makes sure the 14B dual-expert t2v checkpoint pair, text encoder and VAE are
  available, and proves the pipeline is wired up correctly before handing you
  a ready-to-use preset. Wan 2.2's 14B model is a HIGH/LOW-noise expert pair:
  both files are required together, the generator's expert router switches
  between them at the sampling boundary (see docs/models/wan.md). This
  recipe covers text-to-video only - the preset's separate I2V checkpoint
  pair is not fetched here. The four files together are a real download
  (~33 GB). Weights are Apache-2.0 (Wan-AI/Wan2.2-T2V-A14B); no license to
  accept.

plugins:
  - id: "huggingface-provider"
    reason: >
      Resolves the diffusion models, text encoder and VAE from HuggingFace
      (Comfy-Org's official split-file repack of Wan 2.2) by exact repo path.
      HuggingFace has no hash-lookup API, so each artifact below names its
      file explicitly; the sha256 in each artifact's checksum still verifies
      the download afterwards.

backend:
  engine: "native"

artifacts: []
presets:
  - preset_id: "01KX47WANVIDEO0000000000TV"
    path_hint: "marketplace/Wan"
    assign_to_owner: true

smoke:
  preset_id: "01KX47WANVIDEO0000000000TV"
  mode: "video"
  timeout_seconds: 600
  seed: 12345
  # Matches content/presets/marketplace/Wan/tests.yml's own fast smoke case
  # verbatim (a real maintainer Video Director session): the Balanced
  # profile's official t2v expert boundary, at the smallest supported
  # portrait size, 6 steps CFG 1.
  form:
    resolution: "480x832"
    steps: 6
    cfg: 1
    sampler: "euler"
    expert_boundary: 0.875

steps:
  - key: "plugins.ensure"
    kind: "plugins.ensure"
    title: "Enable required plugins"
    params:
      # huggingface-provider is needed so the download step can resolve each
      # artifact's exact repo file.
      plugin_ids: ["huggingface-provider"]

  - key: "backend.ensure"
    kind: "backend.ensure"
    title: "Prepare the native backend"
    params:
      engine: "native"

  # Index BEFORE planning downloads: on a fresh instance nothing is indexed
  # yet, so without this pass artifacts.plan cannot see files the user
  # already has and would ask to download them.
  - key: "models.index"
    kind: "models.index"
    title: "Find models you already have"
    params:
      engine: "native"

  - key: "modes.plan"
    kind: "modes.plan"
    title: "Pick modes and review downloads"
    params:
      preset_id: "01KX47WANVIDEO0000000000TV"
      modes: "all"
      selected: ["video"]
      locked: ["video"]
      extras: "offer"
      preselect_extras: ["t2v_high_noise_model", "t2v_low_noise_model"]

  - key: "artifacts.fetch"
    kind: "artifacts.fetch"
    title: "Download the files"
    params:
      plan: "modes.plan"

  - key: "models.index.downloads"
    kind: "models.index"
    title: "Register downloaded models"
    params:
      engine: "native"

  - key: "preset.ensure"
    kind: "preset.ensure"
    title: "Install and assign the Wan 2.1 / 2.2 preset"
    params:
      preset_id: "01KX47WANVIDEO0000000000TV"

  - key: "preset.defaults"
    kind: "preset.defaults"
    title: "Use the downloaded files by default"
    params:
      plan: "modes.plan"

  - key: "pipeline.render"
    kind: "pipeline.render"
    title: "Validate the pipeline"
    params:
      preset_id: "01KX47WANVIDEO0000000000TV"
      plan: "modes.plan"

  - key: "generation.smoke"
    kind: "generation.smoke"
    title: "Run a first real generation"
    params:
      preset_id: "01KX47WANVIDEO0000000000TV"
      mode: "video"

  - key: "workspace.activate"
    kind: "workspace.activate"
    title: "Finish onboarding"
    # Only meaningful during the first-run wizard - a run started from
    # Admin -> Recipes skips it.
    onboarding_only: true
    params: {}
