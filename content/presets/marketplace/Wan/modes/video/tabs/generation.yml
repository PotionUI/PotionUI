fields:
  - name: "speed_profile"
    type: "select"
    formula: "speed"
    label: "Speed profile"
    default: "balanced"
    configuration:
      options:
        - { label: "Fast", value: "fast", sub_label: "6 steps · UniPC · CFG off · pair with lightning/lightx2v LoRAs (high + low)" }
        - { label: "Balanced", value: "balanced", sub_label: "30 steps · UniPC · CFG 5" }
        - { label: "Custom", value: "custom", sub_label: "your own steps · sampler · CFG, left alone" }

  - type: "section"
    label: "Video"
    children:
      - name: "seed"
        type: "seed"
        label: "Seed"
        default: -1

      - name: "resolution"
        type: "resolution"
        formula: "size"
        label: "Resolution"
        configuration:
          files:
            - { path: "{{ paths._shared }}/resolutions/video.yml", group: "Video" }
            - { path: "{{ paths._shared }}/resolutions/social_media_video.yml", group: "Social Media" }
        default: "832x480"

      - name: "fps"
        type: "slider"
        formula: "size"
        label: "FPS"
        default: 16
        configuration: {min: 1, max: 60, step: 1}

  - type: "section"
    label: "Models"
    formula: "models"
    children:
      - name: "t2v_high_noise_model"
        type: "model"
        label: "t2v DiT (high-noise / single)"
        configuration:
          model_type: "diffusion_model"
          placeholder: "Wan t2v DiT — high-noise expert, or the only DiT..."
          filter_tags: "@config:checkpoint_tags"
          recommendations:
