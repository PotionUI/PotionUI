fields:
  - name: "input_image"
    type: "image"
    label: "Picture"
    required: true
    description: "Who moves, and where."

  - name: "input_video"
    type: "video"
    label: "Video"
    required: true
    description: "Moves to copy. Only about the first 5 seconds are used."

  - name: "effect_strength"
    type: "slider"
    label: "Follow strength"
    default: 1.0
    description: "How closely the moves are copied."
    configuration: {min: 0.5, max: 1.5, step: 0.05}
