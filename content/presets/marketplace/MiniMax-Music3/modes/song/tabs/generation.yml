      - name: "vae"
        type: "model"
        label: "DAV Vocoder"
        required: true
        configuration:
          model_type: "vae"
          placeholder: "minimax_music3_dav..."
          filter_tags: "@config:vae_tags"
          recommendations:
            - name: "minimax_music3_dav.safetensors"
              link: "https://huggingface.co/Comfy-Org/MiniMax-Music-3/resolve/main/vae/minimax_music3_dav.safetensors"
              size: "206.7 MB"
              sha256: "2a32155b769be01445fcc2a8663b910fc9e1751e18dc1c3ec528064512d9ef0c"
              description: "MiniMax-Music-3 DAV audio VAE / vocoder."
