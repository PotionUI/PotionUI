# Video Director mode -- the director editor (form_data.video_director, a
# separate document submitted outside this dynamic form) owns prompts, frames,
# fps, and start/end media per segment. This tab keeps only what the document
# does NOT carry: model-run parameters shared by every segment of a request
# (resolution is constant across a chain; the Speed profile below, and the
# steps/cfg/sampler/expert boundary it bakes on the Advanced tab, are
# per-request DEFAULTS -- chain segments may still individually override
# steps/cfg, see generator/chain_video_wan22). The per-set DiT + LoRA pickers
# live on the T2V Models / I2V Models tabs.
fields:
  - name: "speed_profile"
    type: "select"
    label: "Speed"
    default: "balanced"
    configuration:
      options:
        - { label: "Balanced (30 steps)", value: "balanced", sub_label: "30 steps" }
        - { label: "Fast", value: "fast", sub_label: "(6 steps, pair with Wan lightning/lightx2v LoRAs high+low)" }
        - { label: "Custom", value: "custom", sub_label: "(set steps/CFG freely)" }

  - type: "section"
    label: "Video"
    children:
      - name: "seed"
        type: "seed"
        label: "Seed"
        default: -1

      - name: "resolution"
        type: "resolution"
        label: "Resolution"
        configuration:
          files:
            - { path: "{{ paths._shared }}/resolutions/video.yml", group: "Video" }
            - { path: "{{ paths._shared }}/resolutions/social_media_video.yml", group: "Social Media" }
        default: "832x480"

  - type: "section"
    label: "Text Encoder & VAE"
    children:
      - name: "text_encoder"
        type: "model"
        label: "Text Encoder (UMT5-XXL)"
        required: true
        configuration:
          model_type: "text_encoder"
          placeholder: "Select UMT5-XXL..."
          filter_tags: "@config:text_encoder_tags"
          recommendations:
            - name: "umt5_xxl_fp8_e4m3fn_scaled.safetensors"
              link: "https://huggingface.co/Comfy-Org/Wan_2.2_ComfyUI_Repackaged/resolve/main/split_files/text_encoders/umt5_xxl_fp8_e4m3fn_scaled.safetensors"
              size: "6.27 GB"
              sha256: "c3355d30191f1f066b26d93fba017ae9809dce6c627dda5f6a66eaa651204f68"
              description: "UMT5-XXL text encoder, fp8-scaled - the practical default."
            - name: "umt5_xxl_fp16.safetensors"
              link: "https://huggingface.co/Comfy-Org/Wan_2.2_ComfyUI_Repackaged/resolve/main/split_files/text_encoders/umt5_xxl_fp16.safetensors"
              size: "10.59 GB"
              sha256: "7b8850f1961e1cf8a77cca4c964a358d303f490833c6c087d0cff4b2f99db2af"
              description: "UMT5-XXL text encoder, fp16 reference."

      - name: "vae"
        type: "model"
        label: "VAE"
        required: true
        configuration:
          model_type: "vae"
          placeholder: "Select Wan VAE..."
          filter_tags: "@config:vae_tags"
          recommendations:
            - name: "wan_2.1_vae.safetensors"
              link: "https://huggingface.co/Comfy-Org/Wan_2.2_ComfyUI_Repackaged/resolve/main/split_files/vae/wan_2.1_vae.safetensors"
              size: "242.1 MB"
              sha256: "2fc39d31359a4b0a64f55876d8ff7fa8d780956ae2cb13463b0223e15148976b"
              description: "VAE for the Wan 2.1 and Wan 2.2 14B checkpoints."
            - name: "wan2.2_vae.safetensors"
              link: "https://huggingface.co/Comfy-Org/Wan_2.2_ComfyUI_Repackaged/resolve/main/split_files/vae/wan2.2_vae.safetensors"
              size: "1.31 GB"
              sha256: "e40321bd36b9709991dae2530eb4ac303dd168276980d3e9bc4b6e2b75fed156"
              description: "VAE required by the Wan 2.2 5B TI2V checkpoint - not interchangeable with the 2.1 VAE."
