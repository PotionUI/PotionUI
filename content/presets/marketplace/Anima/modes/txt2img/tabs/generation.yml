fields:
  - type: "section"
    label: "Image"
    children:
      - type: "row"
        children:
          - name: "seed"
            type: "seed"
            label: "Seed"
            default: -1

          - name: "quantity"
            type: "slider"
            label: "Quantity"
            default: 1
            configuration: {min: 1, max: 10, step: 1}

      - name: "resolution"
        type: "resolution"
        formula: "size"
        label: "Resolution"
        configuration:
          files:
            - { path: "{{ paths._shared }}/resolutions/sdxl.yml", group: "SDXL" }
            - { path: "{{ paths._shared }}/resolutions/social_media.yml", group: "Social Media" }
        default: "1024x1024"

  - type: "section"
    label: "Models"
    formula: "models"
    children: "{{ paths.preset }}/modes/txt2img/tabs/models.yml"
