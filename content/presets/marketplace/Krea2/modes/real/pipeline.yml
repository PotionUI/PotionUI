pipeline:
  - name: "model_loader/krea2"
    enabled: true
    configuration:
      diffusion_model:
        file_path: "{{ form.diffusion_model }}"
        name: "{{ form.diffusion_model }}"
      text_encoder:
        file_path: "{{ form.text_encoder }}"
        name: "{{ form.text_encoder }}"
      vae:
        file_path: "{{ form.vae }}"
        name: "{{ form.vae }}"
      vision: true
      loras:
        "@loop":
          items: "{{ ([{'model': form.real_lora, 'strength': form.real_lora_strength | default(1.0)}] if form.real_lora else []) + (form.loras | default([])) }}"
          template:
            file_path: "{{ item.model }}"
            weight: "{{ item.strength }}"
            step_start: "{{ item.step_start | default(none) }}"
            step_end: "{{ item.step_end | default(none) }}"

  - name: "media_loader"
    id: "media_loader"
    enabled: true
    configuration:
      media:
        - type: "image"
          path: "{{ form.source_image }}"

  - name: "prompt_encoder"
    input:
      - ["text_encoder", "model_loader/krea2", "text_encoder"]
      - ["image", "media_loader", "image"]
    enabled: true
    configuration:
      grounding_px: 0
      grounding_area: 147456
      picture_labels: true
      p_prompt:
        input: "{{ generation.prompts.first.positive }}"
        output: "{{ [form.photo_trigger | default('transform the image to realistic photograph'), generation.prompts.first.positive] | select | join('. ') }}"
      n_prompt:
        input: "{{ generation.prompts.first.negative }}"
        output: "{{ generation.prompts.first.negative }}"
      pairs: "{{ generation.prompts.pairs }}"
      quantity: "{{ form.quantity | default(1) }}"
      guidance_scale: 1.0
      negative_applied: "{{ generation.negative_applied }}"

  - name: "seed_generator"
    enabled: true
    configuration:
      seed: "{{ form.seed | default(-1) }}"
      quantity: "{{ form.quantity | default(1) }}"

  - name: "dynamic_prompts_renderer"
    id: "dynamic_prompts_renderer"
    enabled: true
    configuration:
      pairs: "{{ generation.prompts.pairs }}"
      quantity: "{{ form.quantity | default(1) }}"

  - name: "from_iotype"
    id: "from_iotype"
    enabled: true
    input:
      - ["seed", "seed_generator", "seed"]
    configuration:
      from: "seed"

  - name: "param_emitter"
    id: "param_emitter"
    enabled: true
    input:
      - ["seed", "from_iotype", "seed"]
    configuration:
      quantity: "{{ form.quantity | default(1) }}"
      parameters:
        - ["model", "{{ form.diffusion_model }}"]
        - ["model", "{{ form.text_encoder }}"]
        - ["model", "{{ form.vae }}"]
        - "@loop":
            items: "{{ (([{'model': form.real_lora, 'strength': form.real_lora_strength | default(1.0)}] if form.real_lora else []) + (form.loras | default([]))) | active_loras }}"
            template: ["model", "{{ item.model }}"]
        - ["positive_prompt", "{{ generation.prompts.positives }}"]
        - ["negative_prompt", "{{ generation.prompts.negatives }}"]
        - ["cfg", 1.0]
        - ["steps", "{{ form.steps | default(8) }}"]
        - ["sampler", "euler"]

  - name: "generator/krea2_edit"
    input:
      - ["model", "model_loader/krea2", "model"]
      - ["conditioning", "prompt_encoder", "conditioning"]
      - ["seed", "seed_generator", "seed"]
      - ["image", "media_loader", "image"]
    enabled: true
    configuration:
      ref_style: "ostris"
      steps: "{{ form.steps | default(8) }}"
      guidance: 1.0
      sampler: "euler"
      quantity: "{{ form.quantity | default(1) }}"
      ref_pixels: 1048576
      output_pixels: "{{ {'1': 1048576, '2': 2097152, '4': 4194304}[form.output_size | default('1')] }}"

  - name: "gallery"
    input:
      - ["image", "generator/krea2_edit", "image"]
      - ["seed", "seed_generator", "seed"]
    enabled: true
