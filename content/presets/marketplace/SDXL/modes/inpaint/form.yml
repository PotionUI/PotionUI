name: "custom"
short_description: "Repaint a masked area of an image."
fields:
  - type: "tabs"
    children:
      - type: "tab"
        anchor: "inpainting"
        label: "Inpainting"
        configuration:
          icon: "generation"
          icon_display: "icon_only"
        children: "{{ paths.preset }}/modes/inpaint/tabs/inpainting.yml"

      - type: "tab"
        anchor: "references"
        label: "References"
        configuration:
          icon: "image"
          icon_display: "icon_only"
        children: "{{ paths.preset }}/modes/inpaint/tabs/references.yml"

      - type: "tab"
        anchor: "lora"
        label: "LoRA"
        configuration:
          icon: "lora"
          icon_display: "icon_only"
        children: "{{ paths.preset }}/modes/inpaint/tabs/lora.yml"

      - type: "tab"
        anchor: "embeddings"
        label: "Embeddings"
        configuration:
          icon: "embedding"
          icon_display: "icon_only"
        children: "{{ paths.preset }}/modes/txt2img/tabs/embeddings.yml"

      - type: "tab"
        anchor: "advanced"
        label: "Advanced"
        audience: "advanced"
        configuration:
          icon: "settings"
          icon_display: "icon_only"
        children: "{{ paths.preset }}/modes/inpaint/tabs/advanced.yml"
