prompt_label: "What moves"
prompt_placeholder: "the lake ripples and the reeds sway in a light breeze"
name: "custom"
mode_label: "Perfect loop"
short_description: "Bring a picture to life with movement that loops without a seam."
fields:
  - type: "tabs"
    children:
      - type: "tab"
        anchor: "generation"
        label: "Generation"
        configuration: {icon: "generation", icon_display: "icon_only"}
        children: "{{ paths.preset }}/modes/loop/tabs/generation.yml"
      - type: "tab"
        anchor: "lora"
        label: "LoRA"
        configuration: {icon: "lora", icon_display: "icon_only"}
        children: "{{ paths.preset }}/modes/video/tabs/lora.yml"
      - type: "tab"
        anchor: "advanced"
        label: "Advanced"
        audience: "advanced"
        configuration: {icon: "settings", icon_display: "icon_only"}
        children: "{{ paths.preset }}/modes/refs/tabs/advanced.yml"
