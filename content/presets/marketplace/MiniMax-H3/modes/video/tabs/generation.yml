fields:
  - name: "speed_profile"
    type: "select"
    label: "Speed"
    default: "turbo"
    ai_hint: >-
      Turbo is a 4-step recipe. It works on the base model alone — MiniMax-H3
      turns out to be a capable few-step generator on its own schedule — so no
      LoRA is required; expect softer detail than the 24-step Quality profile.
      The turbo distillation LoRA on the LoRA tab sharpens it further, but read
      that field's hint before loading one: the original ModelTC file omits its
      PEFT alpha metadata and produces noise unless its strength is set to 0.125
      by hand, while Kijai's conversion is correct at about 0.75. Pick Quality
      for anything final. Custom pins nothing and hands the Steps slider to the
      user — suggest it whenever they ask for a specific step count.
    configuration:
      options:
        - { label: "Quality (24 steps)", value: "quality" }
        - { label: "Turbo (4 steps, optional distillation LoRA)", value: "turbo" }
        - { label: "Custom (set Steps yourself)", value: "custom" }

  - type: "section"
    label: "Video"
    children:
      # Krea-2 layout: seed+quantity row first, then resolution.
      - type: "row"
        children:
          - name: "seed"
            type: "seed"
            label: "Seed"
            default: -1
            width: "3/5"

          - name: "quantity"
            type: "stepper"
            label: "Quantity"
            default: 1
            configuration: {min: 1, max: 4, step: 1}
            width: "2/5"
            full_width: true

      - name: "resolution"
        type: "resolution"
        label: "Resolution"
        ai_hint: "Both axes must be multiples of 32, aspect ratio between 1:4 and 4:1 — the offered sizes are what MiniMax-H3's own canvas math produces. Area is the dominant cost."
        configuration:
          files:
            - { path: "{{ paths.preset }}/files/form/resolutions_canvas.yml", group: "Native canvas (768 short edge)" }
            - { path: "{{ paths.preset }}/files/form/resolutions_fast.yml", group: "Faster (below native canvas)" }
        default: "1344x768"

  - type: "section"
    label: "Models"
    children:
      - name: "model"
        type: "model"
        label: "MiniMax-H3 DiT"
        required: true
        configuration:
          model_type: "diffusion_model"
          placeholder: "minimax_h3_fl2va_pruned_fp8_scaled..."
          filter_tags: "@config:checkpoint_tags"
          recommendations:
            - name: "minimax_h3_fl2va_pruned_fp8_scaled.safetensors"
              link: "https://huggingface.co/Comfy-Org/MiniMax-H3/resolve/main/diffusion_models/minimax_h3_fl2va_pruned_fp8_scaled.safetensors"
              size: "19.52 GB"
              sha256: "12944c1f7791637e7de12208aef04da82bd26b95271b1b47d817364315ade993"
              description: "MiniMax-H3 first/last-frame to video+audio, pruned + fp8-scaled - the practical local checkpoint."
            - name: "minimax_h3_fl2va_pruned_int8_convrot.safetensors"
              link: "https://huggingface.co/Comfy-Org/MiniMax-H3/resolve/main/diffusion_models/minimax_h3_fl2va_pruned_int8_convrot.safetensors"
              size: "19.53 GB"
              sha256: "e889202c41dafb67b10d67b97f0d8541508036a6090af23425a5c2615d03c47a"
              description: "MiniMax-H3 first/last-frame to video+audio, pruned + int8 ConvRot - same size class as fp8, no fp8 hardware needed."
            - name: "minimax_h3_fl2va_pruned_bf16.safetensors"
              link: "https://huggingface.co/Comfy-Org/MiniMax-H3/resolve/main/diffusion_models/minimax_h3_fl2va_pruned_bf16.safetensors"
              size: "37.46 GB"
              sha256: "a32572fb90b5508b201ec7c2eddcc184b13ddfd3c6f6d2cf06a0b46535d541b4"
              description: "MiniMax-H3 first/last-frame to video+audio, pruned bf16 reference."

      - name: "text_encoder"
        type: "model"
        label: "Text Encoder (Qwen3-VL-32B)"
        required: true
        configuration:
          model_type: "text_encoder"
          placeholder: "Select the Qwen3-VL-32B encoder..."
          filter_tags: "@config:text_encoder_tags"
          recommendations:
            - name: "qwen3vl_32b_minimax_h3_nvfp4_awq.safetensors"
              link: "https://huggingface.co/Comfy-Org/MiniMax-H3/resolve/main/text_encoders/qwen3vl_32b_minimax_h3_nvfp4_awq.safetensors"
              size: "14.61 GB"
              sha256: "35a88d51044231fe332301d7a62aa81e3f2cba62febeb446e2c1e3e0ef76f2c6"
              description: "Qwen3-VL-32B encoder, nvfp4 AWQ - a third of bf16; the only tier that fits most cards."
            - name: "qwen3vl_32b_minimax_h3_int8_convrot.safetensors"
              link: "https://huggingface.co/Comfy-Org/MiniMax-H3/resolve/main/text_encoders/qwen3vl_32b_minimax_h3_int8_convrot.safetensors"
              size: "25.28 GB"
              sha256: "bc2ced0fbea64757fa9acddccfc0b3f4819d1dcf1da6c124d690d368be283923"
