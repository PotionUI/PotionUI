fields:
  - name: "ip_adapter_enabled"
    type: "gate"
    label: "Reference picture"
    default: false
    configuration:
      experimental: true
      summary: "Borrow the look, subject or style of a picture with an IP-Adapter; the prompt still steers the rest."
    children:
      - name: "ip_adapter_image"
        type: "image"
        label: "Reference picture"
        ai_hint: "The picture whose look, subject or style the new image borrows. It is read by an image encoder, so it does not need to match the output size."

      - name: "ip_adapter_scale"
        type: "slider"
        formula: "control"
        label: "Reference strength"
        default: 0.6
        ai_hint: "How strongly the reference pulls on the result. Around 0.5 to 0.7 mixes it with the prompt; 1.0 or more copies it closely and can ignore the prompt."
        configuration: { min: 0.0, max: 1.5, step: 0.05 }

      - name: "ip_adapter_model"
        type: "model"
        label: "IP-Adapter"
        formula: "models"
        ai_hint: "The IP-Adapter file. Plus reads more detail from the reference than the plain adapter; both listed here use the ViT-H image encoder."
        configuration:
          model_type: "model_patch"
          allow_info_modal: true
          placeholder: "Select an SDXL IP-Adapter..."
          recommendations:
            - name: "ip-adapter-plus_sdxl_vit-h.safetensors"
              link: "https://huggingface.co/h94/IP-Adapter/resolve/main/sdxl_models/ip-adapter-plus_sdxl_vit-h.safetensors"
              size: "848 MB"
              sha256: "3f5062b8400c94b7159665b21ba5c62acdcd7682262743d7f2aefedef00e6581"
              description: "IP-Adapter Plus for SDXL (Apache-2.0): follows the reference closely, style and subject. Experimental."
            - name: "ip-adapter_sdxl_vit-h.safetensors"
              link: "https://huggingface.co/h94/IP-Adapter/resolve/main/sdxl_models/ip-adapter_sdxl_vit-h.safetensors"
              size: "698 MB"
              sha256: "ebf05d918348aec7abb02a5e9ecef77e0aaea6914a5c4ea13f50d45eb1681831"
              description: "IP-Adapter for SDXL (Apache-2.0): a lighter hold on the reference, leaves the prompt more room. Experimental."

      - name: "ip_adapter_encoder"
        type: "model"
        label: "Image encoder"
        formula: "models"
        ai_hint: "The CLIP image encoder the IP-Adapter was trained with. ViT-H for the vit-h adapters, ViT-bigG for ip-adapter_sdxl."
        configuration:
          model_type: "model_patch"
          allow_info_modal: true
          placeholder: "Select the CLIP ViT-H image encoder..."
          recommendations:
            - name: "CLIP-ViT-H-14-laion2B-s32B-b79K.safetensors"
              link: "https://huggingface.co/h94/IP-Adapter/resolve/main/models/image_encoder/model.safetensors"
              size: "2.53 GB"
              sha256: "6ca9667da1ca9e0b0f75e46bb030f7e011f44f86cbfb8d5a36590fcd7507b030"
              description: "CLIP ViT-H image encoder (MIT) for the vit-h IP-Adapters."
