fields:
  - name: "first_image"
    type: "image"
    label: "First picture"
    required: true
    description: "Where the video starts."

  - name: "last_image"
    type: "image"
    label: "Last picture"
    required: true
    description: "Where the video ends."

  - name: "effect_strength"
    type: "slider"
    label: "Transition LoRA strength"
    default: 1.0
    description: "Only used with the Transition LoRA."
    configuration: {min: 0.5, max: 1.5, step: 0.05}
