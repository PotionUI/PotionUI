schema: 1
id: "01M52YQH5XRAH60J82RY5NTM2V"
name: "MOSS-Image"
category: "image"
version: "1.0.0"
engine: "native"
tags: ["moss", "moss-image", "local", "experimental"]

requires:
  min_vram_gb: 12
  recommended_vram_gb: 24

configuration:
  checkpoint_tags:
    type: "model_tags"
    label: "Checkpoint tags"
    description: "Only models with any of these tags appear in the Diffusion Model picker."
  text_encoder_tags:
    type: "model_tags"
    label: "Text encoder tags"
    description: "Only models with any of these tags appear in the Text Encoder picker."
  vae_tags:
    type: "model_tags"
    label: "VAE tags"
    description: "Only models with any of these tags appear in the VAE picker."
  lora_tags:
    type: "model_tags"
    label: "LoRA tags"
    description: "Only LoRAs with any of these tags appear in the LoRA picker."

speed_profiles:
  base:   { steps: 50, guidance: 3.0, sampler: "euler" }
  custom: { steps: 50, guidance: 3.0, sampler: "euler" }

llm:
  guide: |
    Write MOSS-Image prompts as cohesive natural-language prose; comma-separated tags also
    work but prose is the better default. Describe what is visible: subject and action,
    relevant appearance, setting, camera and framing, medium, lighting, materials, palette
    and mood. Keep everything the user gave: subjects, counts, relationships, medium,
    style, exclusions and any words to render. Fill ordinary creative gaps yourself and
    ask only when a missing choice would change the image a lot. Do not add quality tags,
    unrequested style changes or invented facts, and keep a minimalist brief minimalist.
    Write descriptive prose in English unless asked otherwise. Put every word that should
    appear in the image in double quotes, verbatim in its original language, with the
    requested capitalisation and line breaks, and write the real copy rather than
    placeholders such as "headline here". A quoted sentence in the user's request is not
    always text to render: separate visible wording from reference material.
    For designed images (posters, covers, infographics) compose text and imagery together:
    a clear reading order, relative prominence, coherent groups, and text short enough to
    stay readable at the chosen size.
    For exact placement of text or objects, several panels, or controlled object
    relationships, use regional prompting instead of writing a JSON layout into the prompt:
    set_regional_prompt in chat, or form_overrides.regional_prompt via start_generation.
    The prompt then describes the whole image, and each region's description covers only
    what is inside its box; quoted words in a region description are rendered as exact text.
    A detailed image does not by itself need regions.
    The negative prompt is empty by default and only used when CFG is above 1; keep it to
    a few short tags such as "blurry, low quality, watermark".

formulas:
  groups:
    speed:  { label: "Speed and sampling" }
    size:   { label: "Size" }
    loras:  { label: "LoRAs" }
    cache:  { label: "Step cache" }
    models: { label: "Models", preselect: false }

negative_prompt:
  applies_when: { field: "cfg", not_equals: 1 }

vars:
  regional_prompt:
    modes: [txt2img]
    size_field: resolution

modes:
  - txt2img
  - inpaint
