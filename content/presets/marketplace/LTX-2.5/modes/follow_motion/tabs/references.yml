fields:
  - name: "input_video"
    type: "video"
    label: "Video"
    required: true
    description: "Camera and layout to copy. Only about the first 5 seconds are used."

  - name: "input_image"
    type: "image"
    label: "First Frame"
    required: true
    description: "How the new scene starts."

  - name: "guide_type"
    type: "select"
    label: "Follow"
    default: "depth"
    description: "What to copy from the video."
    configuration:
      options:
        - { label: "Depth", value: "depth", sub_label: "camera and layout, loosely" }
        - { label: "Edges", value: "edges", sub_label: "outlines, closely" }

  - name: "effect_strength"
    type: "slider"
    label: "Follow strength"
    default: 1.0
    description: "How closely the moves are copied."
    configuration: {min: 0.5, max: 1.5, step: 0.05}
