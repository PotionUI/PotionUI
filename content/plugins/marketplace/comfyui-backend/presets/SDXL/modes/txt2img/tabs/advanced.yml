fields:
  - type: "group"
    label: "Sampler Settings"
    children:
      - type: "row"
        children:
          - name: "steps"
            type: "slider"
            label: "Steps"
            configuration:
              min: 1
              max: 80
              step: 1
            default: 27

          - name: "cfg"
            type: "slider"
            label: "CFG Scale"
            configuration:
              min: 1.0
              max: 20.0
              step: 0.1
            default: 4.0

      - type: "row"
        children:
          - name: "sampler_name"
            type: "select"
            label: "Sampler"
            configuration:
              file: { path: "{{ paths._shared }}/comfyui/form/samplers/all.yml" }
            default: "euler"

          - name: "scheduler"
            type: "select"
            label: "Scheduler"
            configuration:
              file: { path: "{{ paths._shared }}/comfyui/form/schedulers/all.yml" }
            default: "normal"

      - type: "row"
        children:
          - name: "denoise"
            type: "slider"
            label: "Denoise"
            configuration:
              min: 0.0
              max: 1.0
              step: 0.05
            default: 1.0
