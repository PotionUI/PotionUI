fields:
  - name: "speed_profile"
    type: "select"
    formula: "speed"
    label: "Speed profile"
    default: "control"
    configuration:
      options:
        - { label: "Control", value: "control", sub_label: "40 steps, CFG 1" }
        - { label: "Custom", value: "custom", sub_label: "set steps/CFG freely" }

  - type: "section"
    label: "Image"
    children:
      - type: "row"
        children:
          - name: "seed"
            type: "seed"
            label: "Seed"
            default: -1
            width: "3/5"

          - name: "quantity"
            type: "stepper"
            label: "Quantity"
            default: 1
            width: "2/5"
            full_width: true
            configuration: {min: 1, max: 10, step: 1}

      - name: "resolution"
        type: "resolution"
        formula: "size"
        label: "Resolution"
        configuration:
          files:
            - { path: "{{ paths._shared }}/resolutions/qwen_image21.yml", group: "Qwen-Image-2.1" }
            - { path: "{{ paths._shared }}/resolutions/social_media.yml", group: "Social Media" }
            - { path: "{{ paths._shared }}/resolutions/2k.yml", group: "2K" }
        default: "1024x1024"

  - type: "section"
    label: "Models"
    formula: "models"
    reactions:
      - when:
          logic: "AND"
          conditions:
            - { field: "guide_only", equals: true }
            - { field: "guide_extract", equals: true }
            - { field: "guide", not_in: ["none", "grayscale"] }
        then: { set_visibility: false }
    children:
      - name: "diffusion_model"
        type: "model"
        label: "Diffusion Model"
        required: true
        configuration:
          model_type: "diffusion_model"
          placeholder: "Select Qwen-Image-2.1 MMDiT (e.g. qwen_image_2.1_bf16)..."
          filter_tags: "@config:checkpoint_tags"
          recommendations:
            - name: "qwen_image_2.1_bf16.safetensors"
              link: "https://huggingface.co/Comfy-Org/Qwen-Image-2.1/resolve/main/diffusion_models/qwen_image_2.1_bf16.safetensors"
              size: "14.23 GB"
              sha256: "89f4158d066cc33906a199fca85634f766892dd78f49b6698dabf187ac86c4bc"
              description: "Qwen-Image-2.1 MMDiT, bf16 - the validated local checkpoint."

      - name: "text_encoder"
        type: "model"
        label: "Text Encoder (Qwen3-VL-8B)"
        required: true
        configuration:
          model_type: "text_encoder"
          placeholder: "Select Qwen3-VL-8B text encoder..."
          filter_tags: "@config:text_encoder_tags"
          recommendations:
            - name: "qwen3vl_8b_bf16.safetensors"
              link: "https://huggingface.co/Comfy-Org/Qwen-Image-2.1/resolve/main/text_encoders/qwen3vl_8b_bf16.safetensors"
              size: "17.53 GB"
              sha256: "68bdc82bc1b66851162ae656225e7e2068166b603db19bd5d5a3b90eb12669a9"
              description: "Qwen3-VL-8B encoder, bf16 - pairs with the bf16 MMDiT."

      - name: "vae"
        type: "model"
        label: "VAE"
        required: true
        configuration:
          model_type: "vae"
          placeholder: "Select Qwen-Image-2.1 VAE..."
          filter_tags: "@config:vae_tags"
          recommendations:
            - name: "qwen_image_2.1_vae_bf16.safetensors"
              link: "https://huggingface.co/Comfy-Org/Qwen-Image-2.1/resolve/main/vae/qwen_image_2.1_vae_bf16.safetensors"
              size: "0.68 GB"
              sha256: "bb21f7473051e1ac368515dd3f2e15cd44d7a11748ee8823e1ddca3e4876b7c9"
              description: "Qwen-Image-2.1 VAE (RGBA, 16x latent). Alpha is dropped on decode in this v1 preset."

      - name: "control_model"
        type: "model"
        label: "Fun ControlNet"
        required: true
        configuration:
          model_type: "model_patch"
          placeholder: "Select a Fun ControlNet..."
          filter_tags: "@config:control_tags"
          recommendations:
            - name: "Qwen-Image-2.1-Fun-Controlnet-Union.safetensors"
              link: "https://huggingface.co/alibaba-pai/Qwen-Image-2.1-Fun-Controlnet-Union/resolve/main/Qwen-Image-2.1-Fun-Controlnet-Union.safetensors"
              size: "7.55 GB"
              sha256: "65d6b66d734da9e7ff5ef04e7db3a133553a52a3f29a7fcb3e9cce8fa21dcfcd"
              description: "Alibaba PAI's Fun ControlNet Union, bf16 - eight control types plus inpainting in one file."
