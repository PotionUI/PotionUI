  - {path: Embeddings, model_type: embedding, key: SDEmbeddingFolder, write: true}
  - {path: controlnet, model_type: controlnet, key: SDControlNetsFolder, write: true}
  - {path: text_encoders, model_type: text_encoder, key: SDClipFolder, write: true}
  - {path: clip, model_type: text_encoder, key: SDClipFolder}
  - {path: upscale_models, model_type: upscaler, write: true}
  - {path: ESRGAN, model_type: upscaler}
  - {path: RealESRGAN, model_type: upscaler}
  - {path: upscale-models, model_type: upscaler, optional: true}
  - {path: latent_upscale_models, model_type: upscaler, optional: true}
  - {path: yolov8, model_type: adetailer, write: true, optional: true}
