[pytest]
# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test directories
testpaths = tests

# Markers for categorizing tests
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (medium speed)
    e2e: End-to-end tests (slow, full system)
    requires_gpu: Tests that need a real CUDA device (opt in with POTIONUI_GPU_TESTS=1)
    requires_models: Tests that need real model files on disk (opt in with POTIONUI_MODEL_TESTS=1)
    slow: Slow tests (> 5 seconds)
    gc_sensitive: Tests whose result depends on the full suite's live heap (full-suite-only flakes)

# Coverage settings (opt in with --cov=src --cov-report=...; see [coverage] below)
addopts =
    --strict-markers
    --tb=short
    -p no:warnings

# Async support
asyncio_mode = auto

# Timeout for tests (prevent hanging)
timeout = 300

# Show extra test summary info
console_output_style = progress

# Ignore certain files/directories
norecursedirs =
    .git
    .tox
    dist
    build
    *.egg
    venv
    node_modules
    frontend

# Logging
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Performance
# Use xdist for parallel test execution
# Run with: pytest -n auto
