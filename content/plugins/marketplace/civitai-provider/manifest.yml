id: "civitai-provider"
name: "CivitAI Provider"
version: "1.0.0"
description: "Marketplace provider for CivitAI - fetch model metadata, preview images, and download links"
author: "PotionUI Team"
type: "full-stack"
category: "sources"

capabilities:
  - "marketplace-provider"
  - "model-lookup"
  - "media-download"

api:
  module: "backend/api.py"

hooks:
  backend:
    - hook: "provider.register"
      handler: "hooks.provider_hooks.register_provider"

contributions:
  - slot: "admin.models.card.actions"
    component: "FetchCivitaiInfoButton.js"
    label: "Fetch CivitAI data"
    order: 100
  - slot: "admin.models.card.actions"
    component: "FetchCivitaiPromptsButton.js"
    label: "Fetch prompts from CivitAI"
    order: 110

settings:
  - name: "api_key"
    type: "string"
    label: "CivitAI API Key"
    description: "Your CivitAI API key (optional but recommended for higher rate limits)"
    required: false
    is_secret: true
  - name: "rate_limit_delay"
    type: "number"
    label: "Rate Limit Delay (seconds)"
    description: "Delay between API requests to avoid rate limiting"
    default: 1.0
    min: 0.5
    max: 10.0
  - name: "download_media"
    type: "boolean"
    label: "Download Preview Media"
    description: "Download preview images and videos when fetching model info"
    default: true
  - name: "max_media_files"
    type: "number"
    label: "Max Media Files"
    description: "Maximum number of preview media files to download per model"
    default: 10
    min: 1
    max: 50

organize_actions:
  - key: "civitai-provider.fetch_info"
    label: "Fetch CivitAI data"
    subjects: ["model"]
    scope: "instance"
    handler: "organize_actions.fetch_info"
    description: "Looks the model up on CivitAI by its file hash and fills in its empty description, trigger words, tags and previews."
    notes:
      - "Only an exact SHA-256 match is accepted. CivitAI sometimes answers with a different file's record, and PotionUI ignores it."
      - "What you wrote yourself is never overwritten, and fetched data cannot be undone."
    needs: ["digest"]
    done_label: "Fetched CivitAI data"
    paced: true
