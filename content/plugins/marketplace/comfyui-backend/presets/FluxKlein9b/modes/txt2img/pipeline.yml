pipeline:
  #############
  ## Rendered prompts (provenance)
  ## Surfaces the per-image expanded prompts ({a|b}, ${variables}, autocomplete
  ## already resolved on the backend - see src/features/prompt/expander.py) as
  ## pipe artifacts, the prompt counterpart of seed_generator. A single-workflow
  ## engine runs the whole batch off pairs[0]; the pipe broadcasts it across
  ## `quantity` so every image reports the prompt it actually ran with.
  ############
  - name: "dynamic_prompts_renderer"
    id: "dynamic_prompts_renderer"
    enabled: true
    configuration:
      pairs: "{{ generation.prompts.pairs }}"
      quantity: "{{ form.quantity }}"

  #############
  ## Seed Generator
  #############
  - name: "seed_generator"
    id: "seed_generator"
    enabled: true
    configuration:
      seed: "{{ form.seed }}"
      quantity: "{{ form.quantity }}"
  #############
  ## IOType to Value Converter
  ## Converts IOType values (like seed) to regular values for param_emitter
  #############
  - name: "from_iotype"
    id: "from_iotype"
    enabled: true
    input:
      - ["seed", "seed_generator", "seed"]
    configuration:
      from: "seed"

  #############
  ## Parameter Emitter
  ## Emits generation parameters for tracking and display in UI
  #############
  - name: "param_emitter"
    id: "param_emitter"
    enabled: true
    input:
      - ["seed", "from_iotype", "seed"]
    configuration:
      quantity: "{{ form.quantity }}"
      parameters:
        # Main diffusion model
        - ["model", "{{ form.diffusion_model | default('') }}"]
        # CLIP model
        - ["model", "{{ form.clip | default('') }}"]
        # VAE model
        - ["model", "{{ form.vae | default('') }}"]

        # LoRAs (the picker value only contains selected entries)
        - "@loop":
            items: "{{ form.loras | active_loras }}"
            template: ["model", "{{ item.model }}"]

        # Prompts
        - ["positive_prompt", "{{ generation.prompts.first.positive }}"]
        # Negative prompt only exists under Balanced -- Fast's checkpoint
        # bakes zeroed-out conditioning in place of a real negative prompt
        # (see the "fast" branch of the comfyui pipe's field_mappings below).
        - "@loop":
            items: "{{ [generation.prompts.first.negative] }}"
            when: "{{ (form.speed_profile) == 'balanced' }}"
            template: ["negative_prompt", "{{ item }}"]

        # Generation parameters
        - ["cfg", "{{ form.cfg | default(get_speed_profile(form.speed_profile)['guidance']) }}"]
        - ["steps", "{{ form.steps | default(get_speed_profile(form.speed_profile)['steps']) }}"]
        - ["sampler", "{{ form.sampler_name | default(get_speed_profile(form.speed_profile)['sampler']) }}"]
        - ["resolution", "{{ form.resolution }}"]

  #############
  ## ComfyUI Workflow Executor
  ## workflow_file switches on Speed profile: Balanced runs the base-checkpoint
  ## graph (node-id namespace "75:"), Fast runs the distilled-checkpoint graph
  ## (namespace "77:") -- see preset.vars.node_prefix for the lookup used
  ## throughout node_manipulations/field_mappings below.
  #############
  - name: "comfyui"
    enabled: true
    input:
      - ["seed", "seed_generator", "seed"]
    configuration:
      host: "127.0.0.1"
      port: 8188
      workflow_file: "{{ paths.preset }}/modes/txt2img/files/workflows/{% if (form.speed_profile) == 'balanced' %}txt2img_balanced.json{% else %}txt2img_fast.json{% endif %}"
      timeout: 300
      secure: false

      #############
      ## Node Manipulations
      ## LoRA chain built from the `loras` picker value ([{model, strength}, ...] -
      ## only selected entries, may be empty):
      ## UNETLoader (<prefix>:70) -> LoRA 1 -> LoRA 2 -> ... -> CFGGuider (<prefix>:63)
      #############
      node_manipulations:
        # Add one LoraLoaderModelOnly node per selected LoRA, chaining each entry
        # to the previous one (the first connects to the base model <prefix>:70)
        - "@loop":
            items: "{{ form.loras }}"
            template:
              type: "add_node"
              node_id: "lora_{{ loop.index }}"
              node_config:
                inputs:
                  lora_name: "{{ item.model | strip_model_dir }}"
                  strength_model: "{{ item.strength }}"
                  model: ["{% if loop.first %}{{ preset.vars.node_prefix[form.speed_profile] }}:70{% else %}lora_{{ loop.index0 }}{% endif %}", 0]
                class_type: "LoraLoaderModelOnly"
                _meta:
                  title: "LoRA {{ loop.index }}"

        # Connect CFGGuider (<prefix>:63) to the end of the chain: the last generated LoRA
        # node, or the base model <prefix>:70 (the workflow default) when no LoRAs are selected
        - type: "update_node_input"
          node_id: "{{ preset.vars.node_prefix[form.speed_profile] }}:63"
          input_key: "model"
          input_value: ["{% set loras = form.loras %}{% if loras %}lora_{{ loras | length }}{% else %}{{ preset.vars.node_prefix[form.speed_profile] }}:70{% endif %}", 0]

        #############
        ## Negative prompt (Balanced only): the base-checkpoint graph has a
        ## real CLIPTextEncode node for it (<balanced-prefix>:67); the distilled
        ## graph has no equivalent node at all (it zeroes conditioning instead),
        ## so this manipulation is skipped entirely under Fast via `condition:`
        ## rather than pointed at a node that doesn't exist in that graph.
        #############
        - type: "update_node_input"
          condition: "{% if (form.speed_profile) == 'balanced' %}true{% else %}false{% endif %}"
          node_id: "75:67"
          input_key: "text"
          input_value: "{{ generation.prompts.first.negative }}"

      #############
      ## Field Mappings
      ## Map form values to workflow node inputs. Node ids are namespaced by
      ## preset.vars.node_prefix so the same mapping targets the right graph
      ## regardless of which Speed profile is selected.
      #############
      field_mappings:
        # Prompts - node 76 is PrimitiveStringMultiline for positive prompt
        # (same unprefixed id in both graphs)
        - ["{{ generation.prompts.first.positive }}", "76.inputs.value", "str"]

        # Models
        # UNETLoader (<prefix>:70)
        - ["{{ form.diffusion_model | strip_model_dir }}", "{{ preset.vars.node_prefix[form.speed_profile] }}:70.inputs.unet_name", "str"]
        # CLIPLoader (<prefix>:71)
        - ["{{ form.clip | strip_model_dir }}", "{{ preset.vars.node_prefix[form.speed_profile] }}:71.inputs.clip_name", "str"]
        # VAELoader (<prefix>:72)
        - ["{{ form.vae | strip_model_dir }}", "{{ preset.vars.node_prefix[form.speed_profile] }}:72.inputs.vae_name", "str"]

        # Resolution - EmptyFlux2LatentImage (<prefix>:66) gets size from PrimitiveInt nodes
        # Width node (<prefix>:68)
        - ["{{ (form.resolution).split('x')[0] }}", "{{ preset.vars.node_prefix[form.speed_profile] }}:68.inputs.value", "int"]
        # Height node (<prefix>:69)
        - ["{{ (form.resolution).split('x')[1] }}", "{{ preset.vars.node_prefix[form.speed_profile] }}:69.inputs.value", "int"]

        # Batch size - EmptyFlux2LatentImage (<prefix>:66)
        - ["{{ form.quantity }}", "{{ preset.vars.node_prefix[form.speed_profile] }}:66.inputs.batch_size", "int"]

        # Seed - RandomNoise (<prefix>:73)
        - ["@seed", "{{ preset.vars.node_prefix[form.speed_profile] }}:73.inputs.noise_seed", "int"]

        # Steps - Flux2Scheduler (<prefix>:62)
        - ["{{ form.steps | default(get_speed_profile(form.speed_profile)['steps']) }}", "{{ preset.vars.node_prefix[form.speed_profile] }}:62.inputs.steps", "int"]

        # CFG - CFGGuider (<prefix>:63)
        - ["{{ form.cfg | default(get_speed_profile(form.speed_profile)['guidance']) }}", "{{ preset.vars.node_prefix[form.speed_profile] }}:63.inputs.cfg", "float"]

        # Sampler - KSamplerSelect (<prefix>:61)
        - ["{{ form.sampler_name | default(get_speed_profile(form.speed_profile)['sampler']) }}", "{{ preset.vars.node_prefix[form.speed_profile] }}:61.inputs.sampler_name", "str"]

  #############
  ## Gallery - Collect all outputs
  #############
  - name: "gallery"
    enabled: true
    input:
      - ["image", "comfyui", "image"]
