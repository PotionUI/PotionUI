fields:
  - type: "section"
    label: "Image"
    children:
      - type: "row"
        children:
          - name: "seed"
            type: "seed"
            label: "Seed"
            default: -1
            width: "3/5"
          - name: "quantity"
            type: "stepper"
            label: "Quantity"
            default: 1
            width: "2/5"
            full_width: true
            configuration: { min: 1, max: 30, step: 1 }

      - name: "denoise"
        type: "slider"
        label: "Denoising Strength"
        default: 0.75
        configuration:
          min: 0.0
          max: 1.0
          step: 0.05
          tooltip: "How much to change the inpainted area. 0.5 = subtle, 1.0 = complete regeneration"

      - name: "mask_blur"
        type: "slider"
        label: "Mask Blur"
        default: 4
        configuration:
          min: 0
          max: 20
          step: 1
          tooltip: "Blur the mask edges for smoother blending"
  - type: "section"
    label: "Model"
    children:
      - name: "model"
        type: "model"
        label: "Model"
        configuration:
          model_type: "checkpoint"
          allow_info_modal: true
          placeholder: "Select model..."
          filter_tags: "@config:checkpoint_tags"

