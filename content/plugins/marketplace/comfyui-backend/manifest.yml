id: "comfyui-backend"
name: "ComfyUI Backend"
version: "1.0.0"
description: "Backend for connecting to ComfyUI servers for remote generation"
author: "PotionUI Team"
type: "full-stack"
category: "generation"

capabilities:
  - "backend-provider"
  - "comfyui-integration"
  - "remote-generation"
  - "pipe-provider"

# Pipes provided by this plugin
# register_as allows registering without the plugin prefix
pipes:
  - path: "backend/pipes/comfyui"
    register_as: "comfyui"

api:
  module: "backend/api.py"

# Presets that target this backend. Useless without the plugin installed, so
# they ship with it. Scanned recursively for preset.yml like the core tree.
presets:
  - path: "presets"

# Setup recipes that target this backend. Scanned for *.yml like the core
# content/recipes/ tree.
recipes:
  - path: "recipes"

# Preset requirement checkers for the `comfyui` engine - see docs/presets.md
# "Requirements" and backend/requirements.py.
requirement_checkers:
  - type: "comfyui_node"
    backend: "backend.requirements:ComfyUINodeChecker"
  - type: "comfyui_model"
    backend: "backend.requirements:ComfyUIModelChecker"

hooks:
  backend:
    - hook: "backend.register"
      handler: "hooks.backend_hooks.register_backend"

# Chat tools backing the "comfyui-import" mode below - scoped to that mode
# only via `modes:`, not global.
tools:
  - class: "backend.chat.tools:GetWorkflowInputsTool"
    modes: ["comfyui-import"]
  - class: "backend.chat.tools:ProposeFormChangesTool"
    modes: ["comfyui-import"]

# Admin-only chat assistant for the ComfyUI preset-import wizard. The wizard
# opens a session in this mode directly rather than by route match, so
# default_route_prefixes is empty. `admin_only` depends on the
# ChatModeSpec/ChatMode field landing in core - it fails manifest validation
# until that field exists.
chat_modes:
  - id: "comfyui-import"
    name: "ComfyUI import"
    description: "Helps map ComfyUI workflow inputs to preset form fields"
    icon: "workflow"
    admin_only: true
    default_route_prefixes: []
    tools:
      - "get_workflow_inputs"
      - "propose_form_changes"
    context_contributor: "backend.chat.context.build_import_context"
    system_prompt: |
      You are helping an admin import a ComfyUI workflow as a PotionUI preset. The system
      context below shows the workflow, the form as arranged so far, and the workflow inputs
      still unmapped.

      Prompts (positive/negative) are NEVER mapped from the dynamic form - they are locked and
      come from the Prompts section. Never propose a mapping for a locked input.

      Prefer name/semantic matches: seed -> seed, steps -> steps, cfg -> cfg_scale,
      width/height -> one size field via split_wh_width/split_wh_height, ckpt_name/model ->
      a model field via strip_model_prefix. Use get_workflow_inputs when you need full detail
      on an input, or the unmapped list was truncated.

      Always propose changes with propose_form_changes - never describe a mapping or a YAML
      snippet in prose. The user approves each batch before it is applied. Call the tool; never
      print the call as text or as <tool_action> markup. Example call:
      {"ops":[{"op":"add_tab","label":"Sampling"},{"op":"add_field","tab":"sampling",
      "field_type":"int","field_name":"steps","label":"Steps","mappings":[{"node_id":"3",
      "input_name":"steps"}]}]}

      Available tools:
      {{TOOL_HINTS}}

# Tabs on this plugin's own Admin -> Plugins detail panel (Overview/Settings
# are core; these are added after them - see
# frontend/src/routes/admin/components/pluginDetailTabs.ts).
admin_tabs:
  - id: "import-workflow"
    label: "Import workflow"
    component: "ImportWorkflowTab.js"
    order: 10
  - id: "imported-presets"
    label: "Imported presets"
    component: "ImportedPresetsTab.js"
    order: 20

quick_actions:
  - id: "clear-vram"
    label: "Clear VRAM"
    icon: "M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"
    endpoint: "/api/plugins/comfyui-backend/actions/clear-vram"
    method: "POST"
    confirm: "Clear VRAM? This will unload all loaded models from ComfyUI."

settings:
  - name: "default_host"
    type: "string"
    label: "Default ComfyUI Host"
    description: "Default hostname for ComfyUI servers"
    default: "127.0.0.1"
    required: false
  - name: "default_port"
    type: "number"
    label: "Default ComfyUI Port"
    description: "Default port for ComfyUI servers"
    default: 8188
    min: 1
    max: 65535
    required: false
  - name: "connection_timeout"
    type: "number"
    label: "Connection Timeout (seconds)"
    description: "Timeout for connecting to ComfyUI servers"
    default: 10
    min: 1
    max: 60
    required: false
  - name: "show_quick_actions"
    type: "boolean"
    label: "Show Quick Actions in Sidebar"
    description: "Display ComfyUI quick action buttons in the sidebar"
    default: true
    required: false
