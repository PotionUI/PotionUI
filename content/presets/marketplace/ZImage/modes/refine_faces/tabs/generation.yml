fields:
  - type: "section"
    label: "Image"
    children:
      - name: "source_image"
        type: "image"
        label: "Image"
        required: true
        ai_hint: "The picture to fix. Faces in it are found automatically and repainted by your checkpoint; everything else stays as it is."

  - type: "section"
    label: "Fix"
    children:
      - name: "fix_strength"
        type: "slider"
        label: "Strength"
        default: 0.35
        ai_hint: "How much each face is repainted. 0.3 to 0.4 cleans it up and keeps the look; above 0.6 changes it noticeably."
        configuration: {min: 0.1, max: 1.0, step: 0.05}

      - name: "face_detailer_hands"
        type: "checkbox"
        label: "Fix hands too"
        default: false
        ai_hint: "Also finds and repaints hands. Needs the hand detection model; without it only faces are repainted."

      - name: "seed"
        type: "seed"
        label: "Seed"
        default: -1

  - type: "section"
    label: "Detection"
    formula: "models"
    children:
      - name: "face_model"
        type: "model"
        formula: "models"
        label: "Face Detection Model"
        required: true
        ai_hint: "The detector that finds the faces to repaint."
        configuration:
          model_type: "mediapipe"
          allow_info_modal: true
          placeholder: "Select face finder..."
          filter_tags: "@config:mediapipe_tags"
          recommendations:
            - name: "MediaPipe Face Landmarker"
              link: "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task"
              size: "3.58 MB"
              description: "Locates facial landmarks so faces can be found precisely for refinement."

      - name: "face_detailer_hand_model"
        type: "model"
        formula: "models"
        label: "Hand Detection Model"
        visible: false
        ai_hint: "The detector that finds the hands to repaint."
        configuration:
          model_type: "mediapipe"
          allow_info_modal: true
          placeholder: "Select hand finder..."
          filter_tags: "@config:mediapipe_tags"
          recommendations:
            - name: "MediaPipe Hand Landmarker"
              link: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task"
              size: "7.5 MB"
              description: "Locates hands so they can be found precisely for refinement."
        reactions:
          - when: { field: "face_detailer_hands", equals: true }
            then: { set_visibility: true }
          - when: { field: "face_detailer_hands", equals: false }
            then: { set_visibility: false }

  - type: "section"
    label: "Models"
    formula: "models"
    children: "{{ paths.preset }}/files/form/models.yml"
