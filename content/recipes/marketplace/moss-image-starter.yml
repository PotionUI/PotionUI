schema_version: 1
id: "moss-image-starter"
version: 2
name: "MOSS-Image Starter"
engine: "native"
category: "image"
summary: "Get a working MOSS-Image setup on your local GPU and produce a first image."
description: >
  Installs the bundled MOSS-Image preset on the native (in-process) engine,
  makes sure its three model files are available, and proves the pipeline is
  wired up correctly before handing you a ready-to-use preset (see
  docs/models/moss_image.md). The recipe pins the SFT checkpoint in bf16,
  the int8 Qwen3.5-9B text encoder and the shared Flux2 VAE from
  Comfy-Org's MOSS-Image release (Apache-2.0). The three files together are
  a real download (~20 GB); a 24 GB GPU is recommended.

plugins:
  - id: "huggingface-provider"
    reason: >
      Resolves the diffusion model, text encoder and VAE from HuggingFace
      (Comfy-Org's split-file release of MOSS-Image) by exact repo path.
      HuggingFace has no hash-lookup API, so each artifact below names its
      file explicitly; the sha256 in each artifact's checksum still verifies
      the download afterwards.

backend:
  engine: "native"

artifacts: []
presets:
  - preset_id: "01M52YQH5XRAH60J82RY5NTM2V"
    path_hint: "marketplace/MOSS-Image"
    assign_to_owner: true

smoke:
  preset_id: "01M52YQH5XRAH60J82RY5NTM2V"
  mode: "txt2img"
  prompt: "a small red boat on a calm lake at sunset, photograph"
  seed: 12345
  form:
    speed_profile: "custom"
    steps: 12
    cfg: 3.0
    sampler: "euler"
    resolution: "1024x1024"

steps:
  - key: "plugins.ensure"
    kind: "plugins.ensure"
    title: "Enable required plugins"
    params:
      plugin_ids: ["huggingface-provider"]

  - key: "backend.ensure"
    kind: "backend.ensure"
    title: "Prepare the native backend"
    params:
      engine: "native"

  - key: "models.index"
    kind: "models.index"
    title: "Find models you already have"
    params:
      engine: "native"

  - key: "modes.plan"
    kind: "modes.plan"
    title: "Pick modes and review downloads"
    params:
      preset_id: "01M52YQH5XRAH60J82RY5NTM2V"
      modes: "all"
      selected: ["txt2img"]
      locked: ["txt2img"]
      extras: "offer"

  - key: "artifacts.fetch"
    kind: "artifacts.fetch"
    title: "Download the files"
    params:
      plan: "modes.plan"

  - key: "models.index.downloads"
    kind: "models.index"
    title: "Register downloaded models"
    params:
      engine: "native"

  - key: "preset.ensure"
    kind: "preset.ensure"
    title: "Install and assign the MOSS-Image preset"
    params:
      preset_id: "01M52YQH5XRAH60J82RY5NTM2V"

  - key: "preset.defaults"
    kind: "preset.defaults"
    title: "Use the downloaded files by default"
    params:
      plan: "modes.plan"

  - key: "pipeline.render"
    kind: "pipeline.render"
    title: "Validate the pipeline"
    params:
      preset_id: "01M52YQH5XRAH60J82RY5NTM2V"
      plan: "modes.plan"

  - key: "generation.smoke"
    kind: "generation.smoke"
    title: "Run a first real generation"
    params:
      preset_id: "01M52YQH5XRAH60J82RY5NTM2V"
      mode: "txt2img"

  - key: "workspace.activate"
    kind: "workspace.activate"
    title: "Finish onboarding"
    onboarding_only: true
    params: {}
